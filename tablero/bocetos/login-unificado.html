<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boceto · login unificado de las herramientas internas</title>
<!--
  BOCETO de la ENTRADA a las herramientas internas. Un archivo suelto, sin build y sin servidor: se
  abre con doble clic y se proyecta. Los botones NO hablan con Google ni con GitHub — simulan el
  resultado de cada camino.

  El flujo es de dos pasos, y el orden es el mensaje:

    1· Google es la PUERTA. Cualquiera con correo de la compañía entra. Una sola, para todas las
       herramientas — no un login por herramienta.
    2· GitHub se OFRECE después, y es opcional. No es un segundo factor de seguridad: es una segunda
       IDENTIDAD vinculada a la misma sesión, la que le dice a una herramienta qué desarrollador sos
       para poder mostrarte TUS ramas. Decirle «doble autenticación» sería incorrecto y confunde a
       quien tiene que aprobarlo.

  Y el detalle que hace que el paso 2 no moleste: la vinculación se guarda. Se pide UNA vez.
-->
<style>
  /* Mismos tokens que el resto de las herramientas: fondo plano, bordes de 1px, cero sombras, y color
     solo para estado. Lo único con color de marca es el logo de Google — la gente reconoce el botón
     por eso, y pelearle sería vanidad. */
  :root{
    --page:#ffffff; --panel:#ffffff; --panel-2:#fafafa;
    --line:#eaeaea; --line-fuerte:#d4d4d4;
    --ink:#171717; --soft:#666666; --tenue:#8f8f8f;
    --accent:#0068d6; --ok:#0d7a4d;
    --soft-bg:#fafafa; --soft-bg2:#f2f2f2;
    --inv-bg:#171717; --inv-ink:#ffffff;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --page:#000000; --panel:#0a0a0a; --panel-2:#111111;
      --line:#1f1f1f; --line-fuerte:#333333;
      --ink:#ededed; --soft:#a1a1a1; --tenue:#6f6f6f;
      --accent:#52a8ff; --ok:#4cc38a;
      --soft-bg:#111111; --soft-bg2:#1a1a1a;
      --inv-bg:#ffffff; --inv-ink:#000000;
    }
  }
  :root[data-theme="dark"]{
    --page:#000000; --panel:#0a0a0a; --panel-2:#111111;
    --line:#1f1f1f; --line-fuerte:#333333;
    --ink:#ededed; --soft:#a1a1a1; --tenue:#6f6f6f;
    --accent:#52a8ff; --ok:#4cc38a;
    --soft-bg:#111111; --soft-bg2:#1a1a1a;
    --inv-bg:#ffffff; --inv-ink:#000000;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  header{border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:11px}
  .marca{font-size:14px;font-weight:600;letter-spacing:-.02em}
  .marca span{color:var(--tenue);font-weight:400}
  .etq{font-size:10px;color:var(--tenue);border:1px solid var(--line-fuerte);border-radius:5px;
    padding:1px 7px;letter-spacing:.04em}
  header .der{margin-left:auto;display:flex;gap:8px}
  .ctl{background:var(--panel);color:var(--soft);border:1px solid var(--line);border-radius:6px;
    padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  .ctl:hover{background:var(--soft-bg);color:var(--ink)}

  /* El centro: una sola tarjeta, siempre en el mismo lugar. Los tres pasos se reemplazan adentro para
     que la pantalla no salte cuando se proyecta. */
  main{flex:1;display:grid;place-items:center;padding:40px 20px 60px}
  .tarjeta{width:100%;max-width:392px}

  .logo-c{width:42px;height:42px;border-radius:10px;background:var(--inv-bg);color:var(--inv-ink);
    display:grid;place-items:center;margin:0 auto 17px;font-weight:700;font-size:17px}
  h1{font-size:21px;font-weight:600;letter-spacing:-.022em;margin:0 0 7px;text-align:center}
  .sub{color:var(--soft);font-size:13.5px;margin:0 0 24px;text-align:center;line-height:1.55}

  .btn{display:flex;align-items:center;gap:11px;width:100%;padding:12px 15px;border-radius:8px;
    border:1px solid var(--line-fuerte);background:var(--panel);color:var(--ink);cursor:pointer;
    font-size:13.5px;font-family:inherit;text-align:left;transition:background .15s,border-color .15s}
  .btn:hover{background:var(--soft-bg);border-color:var(--soft)}
  .btn svg{width:17px;height:17px;flex:0 0 auto}
  .btn b{font-weight:500}
  .btn i{font-style:normal;color:var(--tenue);font-size:11.5px;margin-left:auto;padding-left:12px}
  .btn.principal{background:var(--inv-bg);color:var(--inv-ink);border-color:var(--inv-bg);
    justify-content:center}
  .btn.principal:hover{opacity:.9;background:var(--inv-bg)}
  .btn.principal i{color:inherit;opacity:.6}
  .btn.plano{border:none;background:none;color:var(--soft);justify-content:center;padding:9px}
  .btn.plano:hover{color:var(--ink);background:none}

  .pila{display:flex;flex-direction:column;gap:9px}

  .pie{margin-top:20px;padding-top:15px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--tenue);line-height:1.6}
  .pie b{color:var(--soft);font-weight:500}

  /* Paso 2 · quién entró ya */
  .yo{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--line);
    border-radius:9px;background:var(--panel-2);margin-bottom:20px}
  .av{width:27px;height:27px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    font-size:10px;font-weight:700;background:var(--soft-bg2);color:var(--soft)}
  .yo-txt{min-width:0;flex:1}
  .yo-txt b{display:block;font-size:12.5px;font-weight:500;line-height:1.3}
  .yo-txt span{display:block;font-size:11.5px;color:var(--tenue);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tic{color:var(--ok);flex:0 0 auto}
  .tic svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;
    stroke-linejoin:round}

  .gana{border:1px solid var(--line);border-radius:9px;padding:13px 14px;margin-bottom:18px;
    background:var(--panel)}
  .gana p{margin:0 0 9px;font-size:12.5px;color:var(--soft)}
  .gana ul{margin:0;padding-left:17px;font-size:12.5px;color:var(--ink)}
  .gana li{margin:3px 0}
  .gana li span{color:var(--tenue)}

  /* Paso 3 · lo que quedó habilitado */
  .fila{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);
    border-radius:8px;background:var(--panel)}
  .fila + .fila{margin-top:7px}
  .fila.trabada{background:var(--panel-2)}
  .fila b{font-size:13px;font-weight:500;flex:1;min-width:0}
  .fila .marca-quien{font-size:10.5px;color:var(--tenue);border:1px solid var(--line);
    border-radius:5px;padding:1px 7px;white-space:nowrap}
  .fila .marca-quien.tech{color:var(--accent);border-color:var(--accent)}
  .fila .ico{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);flex:0 0 auto;
    display:grid;place-items:center;color:var(--soft)}
  .fila .ico svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;
    stroke-linecap:round;stroke-linejoin:round}
  .fila .candado{color:var(--tenue);flex:0 0 auto}
  .fila .candado svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.5}
  h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tenue);
    margin:20px 0 8px}
  h2:first-of-type{margin-top:0}

  .paso{font-size:11px;color:var(--tenue);text-align:center;margin:0 0 20px;letter-spacing:.02em}
</style>
</head>
<body>

<header>
  <span class="marca">CreditOp <span>· herramientas</span></span>
  <span class="etq">BOCETO</span>
  <div class="der">
    <button class="ctl" id="reiniciar" style="display:none">reiniciar</button>
    <button class="ctl" id="tema">tema</button>
  </div>
</header>

<main><div class="tarjeta" id="tarjeta"></div></main>

<script>
  /* ── Los datos del boceto ────────────────────────────────────────────────────────────────────── */

  const GOOGLE_SVG = `<svg viewBox="0 0 18 18" aria-hidden="true">
    <path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5Z"/>
    <path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18Z"/>
    <path fill="#FBBC05" d="M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8l3-2.3Z"/>
    <path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6Z"/></svg>`

  const OCTO_SVG = `<svg viewBox="0 0 16 16" aria-hidden="true" style="fill:currentColor">
    <path d="M8 .8a7.2 7.2 0 0 0-2.3 14c.4.1.5-.1.5-.4v-1.3c-2 .4-2.5-.5-2.7-1-.1-.2-.5-.9-.9-1.1-.3-.2-.7-.6 0-.6.6 0 1 .6 1.2.8.7 1.2 1.8.9 2.3.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.2 0-.2-.3-1 .1-2.1 0 0 .7-.2 2.2.8a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.2 0 3.1-1.9 3.8-3.6 4 .3.3.6.8.6 1.5v2.2c0 .3.1.5.5.4A7.2 7.2 0 0 0 8 .8Z"/></svg>`

  const TIC = `<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 5"/></svg>`
  const CANDADO = `<svg viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>`

  const TODAS = [
    { n:'Asistente interno',       quien:'google', i:'<path d="M2.5 3.5h11v7h-5l-3 2.5v-2.5h-3z"/>' },
    { n:'Estado de los servicios', quien:'google', i:'<path d="M1.8 11.5 5 6.5l3 2.5 3-5.5 3.2 8z"/>' },
    { n:'Tablero de épicas',       quien:'github', i:'<path d="M2 2.5h5v5H2zM9 2.5h5v5H9zM2 8.5h5v5H2zM9 8.5h5v5H9z"/>' },
    { n:'Trazador de solicitudes', quien:'github', i:'<path d="M3 13V6M8 13V3M13 13V9"/>' },
    { n:'Panel de pruebas',        quien:'github', i:'<path d="M5.5 2h5v4l3 8H2.5l3-8z"/>' },
  ]

  const t = document.getElementById('tarjeta')
  const btnReiniciar = document.getElementById('reiniciar')

  /* ── Paso 1 · la puerta ──────────────────────────────────────────────────────────────────────── */
  function puerta(){
    btnReiniciar.style.display = 'none'
    t.innerHTML = `
      <div class="logo-c">C</div>
      <h1>Herramientas internas</h1>
      <p class="sub">Una sola entrada para todas.<br>No hay usuario ni contraseña propios.</p>
      <div class="pila">
        <button class="btn" onclick="sumar()">
          ${GOOGLE_SVG}<b>Continuar con Google</b><i>@creditop.com</i>
        </button>
      </div>
      <p class="pie">
        Entra cualquier persona con correo de la compañía. Si sos del equipo de Tech, en el paso
        siguiente podés <b>sumar tu cuenta de GitHub</b> — se pide una sola vez.
      </p>`
  }

  /* ── Paso 2 · ofrecer GitHub ─────────────────────────────────────────────────────────────────
     El corazón del boceto. GitHub se ofrece DESPUÉS y es opcional: no es un segundo factor de
     seguridad, es una segunda identidad. Por eso el texto habla de lo que DESTRABA, no de proteger. */
  function sumar(){
    btnReiniciar.style.display = ''
    const tech = TODAS.filter(h => h.quien === 'github').length
    t.innerHTML = `
      <p class="paso">paso 2 de 2 · opcional</p>
      <div class="yo">
        <span class="av">MO</span>
        <div class="yo-txt">
          <b>Miguel Angel Ochoa</b>
          <span class="mono">miguel@creditop.com</span>
        </div>
        <span class="tic" title="dentro">${TIC}</span>
      </div>

      <h1>¿Sumás tu GitHub?</h1>
      <p class="sub">Ya estás adentro. Esto es para las herramientas del equipo de Tech.</p>

      <div class="gana">
        <p>Vinculando tu cuenta:</p>
        <ul>
          <li>se habilitan <b>${tech} herramientas</b> más <span>— las del equipo</span></li>
          <li>cada una sabe <b>qué desarrollador sos</b> <span>— para mostrarte tus propias ramas</span></li>
        </ul>
      </div>

      <div class="pila">
        <button class="btn principal" onclick="dentro(true)">${OCTO_SVG}<b>Vincular GitHub</b></button>
        <button class="btn plano" onclick="dentro(false)">Ahora no</button>
      </div>

      <p class="pie">
        Se pide <b>una sola vez</b>: queda vinculada a tu correo y la próxima vez entrás con Google y ya
        tenés todo. Es permiso de <b>lectura</b>, y podés desvincularla cuando quieras.
      </p>`
  }

  /* ── Paso 3 · lo que quedó habilitado ────────────────────────────────────────────────────────── */
  function dentro(vinculado){
    btnReiniciar.style.display = ''
    const fila = h => {
      const trabada = h.quien === 'github' && !vinculado
      return `<div class="fila ${trabada ? 'trabada' : ''}">
        <span class="ico"><svg viewBox="0 0 16 16">${h.i}</svg></span>
        <b>${h.n}</b>
        <span class="marca-quien ${h.quien === 'github' ? 'tech' : ''}">${h.quien === 'github' ? 'Tech' : 'Compañía'}</span>
        ${trabada ? `<span class="candado" title="requiere GitHub">${CANDADO}</span>` : ''}
      </div>`
    }
    t.innerHTML = `
      <div class="yo">
        <span class="av">MO</span>
        <div class="yo-txt">
          <b>Miguel Angel Ochoa</b>
          <span class="mono">miguel@creditop.com${vinculado ? ' · mig-creditop' : ''}</span>
        </div>
        <span class="tic">${TIC}</span>
      </div>

      <h2>${vinculado ? 'Tus herramientas' : 'Habilitadas'}</h2>
      ${TODAS.filter(h => h.quien === 'google' || vinculado).map(fila).join('')}

      ${vinculado ? '' : `
        <h2>Requieren GitHub</h2>
        ${TODAS.filter(h => h.quien === 'github').map(fila).join('')}
        <div class="pila" style="margin-top:14px">
          <button class="btn" onclick="dentro(true)">${OCTO_SVG}<b>Vincular GitHub</b>
            <i>destraba 3</i></button>
        </div>`}

      <p class="pie">
        ${vinculado
          ? 'Entraste con <b>Google</b> y tu identidad de <b>GitHub</b> quedó vinculada: se listan las cinco.'
          : 'Entraste con <b>Google</b>. Las del equipo siguen visibles a propósito — así se sabe que existen y qué falta para usarlas.'}
      </p>`
  }

  btnReiniciar.onclick = puerta
  document.getElementById('tema').onclick = () => {
    const r = document.documentElement
    const oscuro = r.getAttribute('data-theme') === 'dark'
      || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches)
    r.setAttribute('data-theme', oscuro ? 'light' : 'dark')
  }

  puerta()
</script>
</body>
</html>
