<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boceto · entrada a las herramientas internas</title>
<!--
  BOCETO de la ENTRADA a las herramientas internas. Archivo suelto: doble clic y se proyecta. Los
  botones NO hablan con Google ni con GitHub — simulan el resultado de cada camino.

  Dos pasos, y el ORDEN es el mensaje:
    1· Google es la puerta. Entra cualquiera con correo de la compañía. Una sola, para todas.
    2· GitHub se OFRECE después, opcional. No es un segundo factor de seguridad: es una segunda
       IDENTIDAD en la misma sesión —vinculación de cuentas— y es lo que le dice a una herramienta qué
       desarrollador sos. Por eso en ningún texto dice «doble autenticación»: sería incorrecto y hace
       dudar a quien tiene que aprobarlo.

  ICONOS: trazos de Lucide (lucide.dev, ISC) copiados acá adentro, no por CDN. Un boceto que se
  proyecta no puede depender de la red de la sala: sin wifi, un CDN lo deja sin iconos. Todos comparten
  la misma grilla de 24 y el mismo grosor de trazo — eso es lo que hace que se vean de una familia.
-->
<style>
  :root{
    --page:#ffffff; --panel:#ffffff; --panel-2:#fbfbfb;
    --line:#ebebeb; --line-fuerte:#dcdcdc;
    --ink:#141414; --soft:#6a6a6a; --tenue:#9a9a9a;
    --accent:#0068d6; --ok:#0d7a4d;
    --hover:#f7f7f7;
    --inv-bg:#141414; --inv-ink:#ffffff;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --page:#000000; --panel:#0a0a0a; --panel-2:#0d0d0d;
      --line:#1e1e1e; --line-fuerte:#2e2e2e;
      --ink:#ededed; --soft:#a0a0a0; --tenue:#6a6a6a;
      --accent:#52a8ff; --ok:#4cc38a;
      --hover:#141414;
      --inv-bg:#ffffff; --inv-ink:#000000;
    }
  }
  :root[data-theme="dark"]{
    --page:#000000; --panel:#0a0a0a; --panel-2:#0d0d0d;
    --line:#1e1e1e; --line-fuerte:#2e2e2e;
    --ink:#ededed; --soft:#a0a0a0; --tenue:#6a6a6a;
    --accent:#52a8ff; --ok:#4cc38a;
    --hover:#141414;
    --inv-bg:#ffffff; --inv-ink:#000000;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.94em}

  /* Todo icono hereda el color del texto y el mismo grosor: es lo único que hay que respetar para que
     un set de iconos se vea como un set y no como estampas pegadas. */
  .i{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round}

  header{padding:16px 22px;display:flex;align-items:center;gap:10px}
  .marca{font-size:13.5px;font-weight:600;letter-spacing:-.02em}
  .marca span{color:var(--tenue);font-weight:400}
  .etq{font-size:9.5px;color:var(--tenue);border:1px solid var(--line-fuerte);border-radius:4px;
    padding:1px 6px;letter-spacing:.06em}
  header .der{margin-left:auto;display:flex;gap:6px;align-items:center}
  .ctl{background:none;color:var(--tenue);border:none;border-radius:6px;padding:5px 9px;
    font-size:12px;cursor:pointer;font-family:inherit}
  .ctl:hover{background:var(--hover);color:var(--ink)}

  /* Control DEL BOCETO, no del producto: quién entra. Es lo que hace demostrable que la misma puerta
     da dos experiencias distintas — y que quien no es de Tech ni se entera de que GitHub existe. */
  .simular{display:flex;align-items:center;gap:1px;border:1px solid var(--line);border-radius:7px;
    padding:2px;margin-right:6px}
  .simular span{font-size:10px;color:var(--tenue);padding:0 7px 0 5px;letter-spacing:.03em}
  .simular button{background:none;border:none;border-radius:5px;padding:4px 9px;font-size:11.5px;
    color:var(--tenue);cursor:pointer;font-family:inherit}
  .simular button:hover{color:var(--ink)}
  .simular button[aria-pressed="true"]{background:var(--inv-bg);color:var(--inv-ink)}

  main{flex:1;display:grid;place-items:center;padding:24px 22px 72px}
  .caja{width:100%;max-width:392px}
  .caja.ancha{max-width:520px}

  h1{font-size:20px;font-weight:600;letter-spacing:-.025em;margin:0 0 6px;text-align:center}
  .sub{color:var(--soft);font-size:13px;margin:0 0 26px;text-align:center}
  .pie{margin-top:18px;font-size:11.5px;color:var(--tenue);text-align:center}

  .marca-c{width:38px;height:38px;border-radius:11px;background:var(--inv-bg);color:var(--inv-ink);
    display:grid;place-items:center;margin:8px auto 16px;font-weight:700;font-size:15px}

  /* ── botones ─────────────────────────────────────────────────────────────── */
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;
    border-radius:10px;border:1px solid var(--line-fuerte);background:var(--panel);color:var(--ink);
    cursor:pointer;font-size:13.5px;font-weight:500;font-family:inherit;
    transition:background .15s,border-color .15s}
  .btn:hover{background:var(--hover);border-color:var(--soft)}
  .btn.principal{background:var(--inv-bg);color:var(--inv-ink);border-color:var(--inv-bg)}
  .btn.principal:hover{background:var(--inv-bg);opacity:.88}
  .btn.plano{border-color:transparent;background:none;color:var(--tenue);font-weight:400;padding:9px}
  .btn.plano:hover{background:none;color:var(--ink)}
  .pila{display:flex;flex-direction:column;gap:8px}

  /* ── la identidad, en chip ───────────────────────────────────────────────── */
  .quien{display:flex;align-items:center;gap:9px;padding:8px 12px 8px 9px;border:1px solid var(--line);
    border-radius:99px;background:var(--panel-2);width:fit-content;margin:0 auto 22px;max-width:100%}
  .av{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    font-size:9px;font-weight:700;background:var(--inv-bg);color:var(--inv-ink)}
  .quien .txt{font-size:12px;color:var(--soft);min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .quien .i{width:15px;height:15px;color:var(--ok)}

  /* ── LAS TARJETAS ────────────────────────────────────────────────────────── */
  .grilla{display:grid;gap:9px;grid-template-columns:repeat(2,minmax(0,1fr))}
  @media (max-width:460px){ .grilla{grid-template-columns:1fr} }

  .tarjeta{position:relative;border:1px solid var(--line);border-radius:12px;padding:15px 15px 14px;
    background:var(--panel);transition:border-color .15s,background .15s;cursor:pointer;
    display:flex;flex-direction:column;gap:9px;min-height:104px}
  .tarjeta:hover{border-color:var(--line-fuerte);background:var(--panel-2)}
  .tarjeta .i{width:19px;height:19px;color:var(--ink)}
  .tarjeta b{font-size:13px;font-weight:500;letter-spacing:-.01em;line-height:1.3}
  .tarjeta em{font-style:normal;font-size:11px;color:var(--tenue);margin-top:-5px}
  .tarjeta .esquina{position:absolute;top:13px;right:13px;color:var(--tenue)}
  .tarjeta .esquina .i{width:14px;height:14px;color:var(--tenue)}

  /* Trabada: no se tacha ni se pinta de rojo — se apaga. Que se vea es el punto: así se sabe que
     existe y qué falta para usarla. */
  .tarjeta.trabada{background:var(--panel-2);cursor:default}
  .tarjeta.trabada .i,
  .tarjeta.trabada b{color:var(--tenue)}
  .tarjeta.trabada:hover{border-color:var(--line)}

  /* La salida del que dijo «ahora no»: una línea, no una tarjeta. Discreta pero presente — si
     desaparece del todo, el desarrollador no vuelve a enterarse de que esas herramientas existen. */
  .rescate{margin-top:18px;padding-top:15px;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tenue)}
  .rescate .i{width:15px;height:15px}
  .rescate button{margin-left:auto;background:none;border:1px solid var(--line-fuerte);
    border-radius:7px;padding:5px 11px;font-size:12px;color:var(--ink);cursor:pointer;
    font-family:inherit;white-space:nowrap}
  .rescate button:hover{background:var(--hover)}

  .oculto{display:none}
</style>
</head>
<body>

<header>
  <span class="marca">CreditOp <span>· herramientas</span></span>
  <span class="etq">BOCETO</span>
  <div class="der">
    <div class="simular">
      <span>entra</span>
      <button id="s-comp" aria-pressed="true"  onclick="quienEntra('compania')">Compañía</button>
      <button id="s-tech" aria-pressed="false" onclick="quienEntra('tech')">Tech</button>
    </div>
    <button class="ctl" id="reiniciar" style="display:none">reiniciar</button>
    <button class="ctl" id="tema">tema</button>
  </div>
</header>

<main><div class="caja" id="caja"></div></main>

<script>
  /* ── Iconos: trazos de Lucide (lucide.dev, ISC). Misma grilla de 24, mismo grosor. ───────────── */
  const ICO = {
    bot:     '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
    activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
    grid:    '<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
    rama:    '<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
    matraz:  '<path d="M10 2v7.5a2 2 0 0 1-.2.9L4.7 20.6a1 1 0 0 0 .9 1.4h12.8a1 1 0 0 0 .9-1.4l-5.1-10.2a2 2 0 0 1-.2-.9V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>',
    tic:     '<path d="M20 6 9 17l-5-5"/>',
    candado: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    github:  '<path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 5-2 5-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C5 2 4 2 4 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 3 9c0 3.5 2 5.5 5 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/>',
  }
  const i = (n, clase = '') => `<svg class="i ${clase}" viewBox="0 0 24 24" aria-hidden="true">${ICO[n]}</svg>`

  /* Google va con su logo de marca y a color: es lo único con color acá, y es a propósito — la gente
     reconoce ese botón por eso. Redibujarlo en trazo lo haría más "coherente" y menos usable. */
  const GOOGLE = `<svg width="17" height="17" viewBox="0 0 18 18" aria-hidden="true" style="flex:0 0 auto">
    <path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5Z"/>
    <path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18Z"/>
    <path fill="#FBBC05" d="M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8l3-2.3Z"/>
    <path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6Z"/></svg>`

  const HERR = [
    { n:'Asistente interno',       ico:'bot',      via:'google', d:'preguntá por Slack' },
    { n:'Estado de los servicios', ico:'activity', via:'google', d:'qué está arriba' },
    { n:'Tablero de épicas',       ico:'grid',     via:'github', d:'en qué anda cada quien' },
    { n:'Trazador de solicitudes', ico:'rama',     via:'github', d:'seguir una solicitud' },
    { n:'Panel de pruebas',        ico:'matraz',   via:'github', d:'correr un flujo' },
  ]

  const caja = document.getElementById('caja')
  const btnReiniciar = document.getElementById('reiniciar')

  /* QUIÉN ENTRA. En el producto esto NO se elige: sale del propio login de Google — el grupo de
     Workspace (tech@creditop.com) viaja en el token. Acá es un botón solo para poder mostrar las dos
     experiencias en la misma demo.

     La regla que se está mostrando: si no sos de Tech, GitHub no existe para vos. Ni el paso 2, ni
     tarjetas trabadas, ni un candado. No es esconder por seguridad —esas herramientas igual piden
     sesión— es no ofrecerle a alguien de Cartera algo que no va a poder usar nunca. */
  let PERSONA = 'compania'
  function quienEntra(p){
    PERSONA = p
    document.getElementById('s-comp').setAttribute('aria-pressed', String(p === 'compania'))
    document.getElementById('s-tech').setAttribute('aria-pressed', String(p === 'tech'))
    puerta()
  }
  const esTech = () => PERSONA === 'tech'
  const correo = () => esTech() ? 'miguel@creditop.com' : 'laura@creditop.com'
  const iniciales = () => esTech() ? 'MO' : 'LG'

  const chip = extra => `<div class="quien"><span class="av">${iniciales()}</span>
      <span class="txt mono">${correo()}${extra || ''}</span>${i('tic')}</div>`

  /* ── 1 · la puerta ───────────────────────────────────────────────────────── */
  function puerta(){
    btnReiniciar.style.display = 'none'
    caja.className = 'caja'
    caja.innerHTML = `
      <div class="marca-c">C</div>
      <h1>Herramientas internas</h1>
      <p class="sub">Una sola entrada para todas.</p>
      <div class="pila">
        <button class="btn" onclick="${esTech() ? 'sumar()' : 'dentro(false)'}">
          ${GOOGLE} Continuar con Google</button>
      </div>
      <p class="pie">Con tu correo de la compañía.</p>`
  }

  /* ── 2 · ofrecer GitHub ──────────────────────────────────────────────────── */
  function sumar(){
    btnReiniciar.style.display = ''
    caja.className = 'caja'
    const n = HERR.filter(h => h.via === 'github').length
    caja.innerHTML = `
      ${chip()}
      <h1>¿Sumás tu GitHub?</h1>
      <p class="sub">Habilita ${n} herramientas del equipo, y cada una<br>sabe qué desarrollador sos.</p>
      <div class="pila">
        <button class="btn principal" onclick="dentro(true)">${i('github')} Vincular GitHub</button>
        <button class="btn plano" onclick="dentro(false)">Ahora no</button>
      </div>
      <p class="pie">Se pide una sola vez. Solo lectura.</p>`
  }

  /* ── 3 · las tarjetas ─────────────────────────────────────────────────────
     Solo lo que la persona PUEDE usar. Nada trabado, ningún candado: quien no es de Tech ve dos
     tarjetas y se va a trabajar. El único que necesita una salida es el desarrollador que dijo
     «ahora no», y la tiene abajo en una línea. */
  function dentro(vinculado){
    btnReiniciar.style.display = ''
    caja.className = 'caja ancha'

    const tarjeta = h => `<div class="tarjeta">${i(h.ico)}<b>${h.n}</b><em>${h.d}</em></div>`
    const mias = HERR.filter(h => h.via === 'google' || vinculado)
    const faltan = HERR.length - mias.length

    caja.innerHTML = `
      ${chip(vinculado ? ' · mig-creditop' : '')}
      <div class="grilla">${mias.map(tarjeta).join('')}</div>
      ${esTech() && !vinculado ? `
        <div class="rescate">
          ${i('github')}
          <span>Sos del equipo de Tech: vinculá GitHub y sumás ${faltan} herramientas.</span>
          <button onclick="dentro(true)">Vincular</button>
        </div>` : ''}`
  }

  btnReiniciar.onclick = puerta
  document.getElementById('tema').onclick = () => {
    const r = document.documentElement
    const oscuro = r.getAttribute('data-theme') === 'dark'
      || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches)
    r.setAttribute('data-theme', oscuro ? 'light' : 'dark')
  }

  puerta()
</script>
</body>
</html>
