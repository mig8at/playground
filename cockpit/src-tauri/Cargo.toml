[package]
name = "cockpit"
version = "0.1.0"
description = "Cockpit: las herramientas del playground en una app, con barra de aplicaciones"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-deep-link = "2.6"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"
tauri-plugin-autostart = "2.7"

[profile.release]
strip = true
lto = true
