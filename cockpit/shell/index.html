<!doctype html>
<!--
  COCKPIT: la carcasa. Una barra de aplicaciones a la izquierda (como la de VS Code) y, a la derecha, cada herramienta
  de my-tools en su panel. Cada app es la interfaz de siempre (su propio servidor en localhost), abierta en un iframe
  que queda vivo al cambiar de app: lo que estabas haciendo sigue ahí.

  Qué apps hay y cómo se levantan lo dice la app de Rust (`apps`, src-tauri/src/main.rs); acá sólo el ícono de cada una.
  Se hablan por postMessage (chat/src/desktop.js y tools/ui/workbench.js): la app manda `badge` (su numerito); la
  carcasa manda `route` (al tocar un aviso) y `visible` (si la app está a la vista: un iframe escondido no se entera
  solo, y el chat marcaría leído). Y `theme` va en los dos sentidos: Cockpit tiene UN tema para todas (cada iframe
  tiene su origen y guardaría el suyo); cambiarlo en una app lo cambia en la barra y en las demás. Los enlaces que abren ventana nueva los atrapa Rust y los abre en tu navegador.
-->
<html lang="es" data-style="panels">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit</title>
<!-- EL TEMA ANTES DE PINTAR: el renglón es `THEME_BOOT` de tools/ui/workbench.js, y lo rellena `make style-sync`. -->
<script>/* <theme-boot> */try{var t=localStorage.getItem('ui.theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.classList.toggle('dark',t==='dark');document.documentElement.style.colorScheme=t}catch(e){}try{var p=localStorage.getItem('ui.palette');if(p&&p!=='default'&&/^(default|vintage|catppuccin|nord|monokaipro|ristretto)$/.test(p))document.documentElement.setAttribute('data-palette',p)}catch(e){}/* </theme-boot> */</script>
<!-- El mismo tema y taller que las apps (copias de tools/ui, `make style-sync`): la barra se apoya en el MISMO lienzo
     que los paneles de cada app, y cambia con ellas de claro a oscuro. -->
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="workbench.css">
<style>
  /* Los colores de estado son de Cockpit (el tema no los trae, y su «destructivo» en oscuro es un gris verdoso): «terminó
     bien» y «falló o frenado», en claro y en oscuro, los mismos del chat (presencia y mensaje que no salió). */
  :root {
    --cockpit-stop: #dc2626;
    --settings-backdrop: rgb(0 0 0 / .45);
    --settings-tint: color-mix(in oklab, var(--primary) 14%, transparent);
    --settings-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 12px 32px -12px rgb(0 0 0 / .3);
  }
  :root.dark {
    --cockpit-stop: #f87171;
  }
  * { box-sizing: border-box }
  html, body { margin: 0; height: 100%; overflow: hidden }
  body { display: flex; background: var(--canvas); font-family: var(--font-sans, system-ui), -apple-system, sans-serif; font-size: var(--text-base) }
  /* La barra va sobre el lienzo, sin fondo propio: es el borde de la ventana, como el pie de cada app. */
  nav { flex: none; width: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px;
    -webkit-user-select: none; user-select: none }
  nav button { position: relative; width: 48px; height: 44px; border: 0; background: none; color: var(--fg-3); cursor: pointer;
    display: grid; place-items: center }
  nav button:hover, nav button.on { color: var(--foreground) }
  nav button.on::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 1px; background: var(--foreground) }
  nav button:focus-visible { outline: 1px solid var(--ring); outline-offset: -2px }
  nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }
  .badge { position: absolute; right: 6px; bottom: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
    background: var(--primary); color: var(--primary-foreground); font-size: 10px; font-weight: 600; line-height: 16px; text-align: center }
  .tip { position: fixed; left: 52px; padding: 4px 8px; border-radius: 4px; background: var(--popover); color: var(--popover-foreground);
    border: 1px solid var(--border); font-size: var(--text-sm); white-space: nowrap; pointer-events: none; z-index: 10 }
  main { flex: 1; min-width: 0; position: relative }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--canvas) }
  iframe[hidden] { display: none }
  .waiting { position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg-2) }
  /* Una app que se cayó: el aviso la TAPA (el iframe muestra un error del navegador) hasta que vuelve. */
  .waiting.over { z-index: 1; background: var(--canvas); text-align: center; padding: 0 var(--space-6) }
  /* Al pie de la barra, el engranaje: las preferencias de Cockpit. El panel «Claude» se abre desde el pie de cada app
     (el asterisco que agrega tools/ui/workbench.js). */
  nav .spacer { flex: 1 }
  nav .settings-toggle { margin-bottom: 8px }
  /* LA CONFIGURACIÓN: un modal como el de canon (tools/canon/src/components/Settings.vue del playground compartido).
     Un <dialog> nativo abierto con showModal(): Escape cierra, el foco queda adentro y lo de atrás no se toca, con el
     fondo desenfocado. A la izquierda el buscador y las secciones (la elegida, teñida); a la derecha la elegida, con su
     título, una línea de qué es y sus bloques: un rótulo chico y una caja. `margin: auto` + `inset: 0` lo centra. */
  .settings { position: fixed; inset: 0; margin: auto; width: min(880px, calc(100vw - 32px)); height: min(600px, calc(100dvh - 32px));
    max-width: none; max-height: none; padding: 0; border: 1px solid var(--panel-border, var(--border)); border-radius: calc(var(--radius) + 10px);
    background: var(--panel-surface, var(--background)); color: var(--foreground); box-shadow: var(--settings-shadow); overflow: hidden }
  .settings::backdrop { background: var(--settings-backdrop); backdrop-filter: blur(4px) }
  .settings-frame { display: grid; grid-template-columns: 220px minmax(0, 1fr); height: 100% }
  .settings-nav { display: flex; flex-direction: column; gap: 2px; padding: 16px 8px; background: var(--canvas);
    border-right: 1px solid var(--panel-border, var(--border)); overflow: auto }
  .settings-search { position: relative; display: block; margin: 0 4px 12px }
  .settings-search .ui-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--fg-3) }
  .settings-search .input { width: 100%; box-sizing: border-box; padding-left: 32px; background: var(--panel-surface, var(--background)) }
  .settings-group { margin: 0; padding: 8px 12px 4px; font-size: var(--text-sm); color: var(--fg-3) }
  .settings-none { margin: 0; padding: 8px 12px; font-size: var(--text-sm); color: var(--fg-3) }
  .settings-nav .section { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 0 12px; border: 0;
    border-radius: calc(var(--radius) - 2px); background: none; color: var(--fg-2); font: inherit; text-align: left; cursor: pointer }
  .settings-nav .section:hover { background: var(--hover); color: var(--foreground) }
  .settings-nav .section .ui-icon { color: var(--fg-3) }
  .settings-nav .section[aria-selected="true"] { background: var(--settings-tint); color: var(--foreground); font-weight: 600 }
  .settings-nav .section[aria-selected="true"] .ui-icon { color: var(--primary) }
  .settings-body { position: relative; padding: 32px 36px; overflow: auto }
  .settings .settings-close { position: absolute; top: 12px; right: 12px }
  .settings-head { margin-bottom: 24px }
  .settings-title { margin: 0 0 4px; font-size: 20px; font-weight: 600; letter-spacing: -.02em }
  .settings-what { margin: 0; color: var(--fg-2); font-size: var(--text-sm) }
  .settings-blocks { display: flex; flex-direction: column; gap: 24px; max-width: 72ch }
  .settings-blocks > section { display: flex; flex-direction: column; gap: 8px }
  .settings-blocks h3 { margin: 0; font-size: var(--text-xs); font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: .04em }
  .settings-blocks p { margin: 0; line-height: 1.6; color: var(--fg-2) }
  .settings-blocks p b, .settings-blocks li b { color: var(--foreground) }
  .settings-blocks code { font-family: var(--font-mono); font-size: var(--text-sm) }
  /* Una opción: nombre, qué hace, y el ✓ si está elegida (como `.opcion` de canon). */
  .options { display: flex; flex-direction: column; gap: 8px }
  .option { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; width: 100%; padding: 12px 16px;
    text-align: left; cursor: pointer; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--border);
    border-radius: calc(var(--radius) + 4px) }
  .option:hover { background: var(--hover) }
  .option:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px }
  .option[aria-checked="true"] { border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring) }
  .option-name { font-weight: 600 }
  .option-what { grid-column: 1; font-size: var(--text-sm); color: var(--fg-2) }
  .option .ui-icon { grid-row: 1 / 3; grid-column: 2; visibility: hidden; color: var(--ring) }
  .option[aria-checked="true"] .ui-icon { visibility: visible }
  /* Una caja con filas: cada app con su estado y lo que se hace con ella. */
  .settings-box { border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px); background: var(--card); overflow: hidden }
  .settings-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px }
  .settings-row + .settings-row { border-top: 1px solid var(--border) }
  .settings-row-text { flex: 1; min-width: 0 }
  .settings-row-name { display: block; font-weight: 600 }
  .settings-row-what { display: block; font-size: var(--text-sm); color: var(--fg-2) }
  .settings-row .state { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--fg-2) }
  .settings-row .state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3) }
  .settings-row .state.up::before { background: var(--status-ok) }
  .settings-box.padded { padding: 16px }
  /* LAS MUESTRAS de color (como `.paleta-muestra` de canon): cada círculo lleva dos colores FIJOS de su paleta —el
     acento y el lienzo, en claro o en oscuro según su fila—, no var(--primary): con una paleta puesta, un círculo que
     usara el token cambiaría con ella y dejaría de decir qué se elige. */
  .palette-rows { display: flex; flex-direction: column; gap: 12px }
  .palette-row { display: flex; align-items: center; gap: 12px }
  .palette-row-name { flex: none; width: 56px; font-size: var(--text-sm); color: var(--fg-2) }
  .palette-options { display: flex; flex-wrap: wrap; align-items: center; gap: 12px }
  .palette-swatch { width: 28px; height: 28px; padding: 0; flex: none; cursor: pointer; border-radius: 999px;
    border: 1px solid var(--border); background: var(--swatch, var(--muted)) }
  .palette-swatch[data-mode="dark"] { background: var(--swatch-dark, var(--muted)) }
  .palette-swatch:hover { border-color: var(--fg-3) }
  .palette-swatch[aria-checked="true"] { box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--foreground) }
  .palette-swatch:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px }
  .palette-swatch[data-palette-pick="default"] {
    --swatch: linear-gradient(135deg, oklch(0.6716 0.1368 48.5130) 50%, oklch(1 0 0) 50%);
    --swatch-dark: linear-gradient(135deg, oklch(0.7214 0.1337 49.9802) 50%, oklch(0.1797 0.0043 308.1928) 50%);
  }
  .palette-swatch[data-palette-pick="vintage"] {
    --swatch: linear-gradient(135deg, hsl(30 36% 38%) 50%, hsl(39 35% 92%) 50%);
    --swatch-dark: linear-gradient(135deg, hsl(30 33.7% 62.7%) 50%, hsl(25 15.4% 15.3%) 50%);
  }
  .palette-swatch[data-palette-pick="catppuccin"] {
    --swatch: linear-gradient(135deg, #8839ef 50%, #eff1f5 50%);
    --swatch-dark: linear-gradient(135deg, #cba6f7 50%, #1e1e2e 50%);
  }
  .palette-swatch[data-palette-pick="nord"] {
    --swatch: linear-gradient(135deg, #4a6a94 50%, #eceff4 50%);
    --swatch-dark: linear-gradient(135deg, #88c0d0 50%, #2e3440 50%);
  }
  .palette-swatch[data-palette-pick="monokaipro"] {
    --swatch: linear-gradient(135deg, #c6305f 50%, #faf4f2 50%);
    --swatch-dark: linear-gradient(135deg, #ff6188 50%, #2d2a2e 50%);
  }
  .palette-swatch[data-palette-pick="ristretto"] {
    --swatch: linear-gradient(135deg, #bd3a63 50%, #f8efe7 50%);
    --swatch-dark: linear-gradient(135deg, #fd6883 50%, #2c2525 50%);
  }
  .settings-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: var(--fg-2); line-height: 1.5 }
  /* EL PANEL «CLAUDE»: lo que hace Claude en vivo, como un panel más sobre el lienzo. */
  aside { flex: none; width: 340px; display: flex; flex-direction: column; min-height: 0; margin: calc(var(--panels-gap) / 2);
    margin-left: 0; border: 1px solid var(--panel-border); border-radius: var(--panels-radius); background: var(--panel-surface);
    color: var(--foreground); overflow: hidden }
  aside[hidden] { display: none }
  aside header { flex: none; display: flex; align-items: center; gap: var(--space-2); height: var(--region-head-h); padding: 0 var(--space-1) 0 var(--gutter);
    border-bottom: 1px solid var(--border); font-size: var(--text-sm); font-weight: 600; color: var(--fg-2) }
  aside header .grow { flex: 1 }
  aside header button { width: 24px; height: 24px; border: 0; border-radius: var(--radius-control); background: none; color: var(--fg-2); cursor: pointer; display: grid; place-items: center }
  aside header button:hover { background: var(--hover); color: var(--foreground) }
  aside header svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .feed { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-2) 0 }
  .feed .empty { padding: var(--space-3) var(--gutter); color: var(--fg-3); font-size: var(--text-sm); line-height: 1.5 }
  .act { display: flex; gap: var(--space-2); align-items: baseline; padding: 3px var(--gutter); font-size: var(--text-sm); line-height: 1.45 }
  .act time { flex: none; margin-left: auto; color: var(--fg-3); font-size: var(--text-xs); font-variant-numeric: tabular-nums }
  .act .sess { flex: none; color: var(--fg-3); font-size: var(--text-xs) }
  .act.say { padding-block: var(--space-2) }
  .act.say p { margin: 0; color: var(--foreground); white-space: pre-wrap; overflow-wrap: anywhere }
  .act.cmd code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono, ui-monospace, monospace); font-size: var(--text-xs); color: var(--fg-2) }
  .act.cmd .tool { flex: none; color: var(--fg-3); font-size: var(--text-xs) }
  .act .state { flex: none; width: 8px; height: 8px; border-radius: 50%; align-self: center; background: var(--fg-3) }
  .act .state.run { background: var(--primary); animation: blink 1s ease-in-out infinite }
  .act .state.ok { background: var(--status-ok) }
  .act .state.fail { background: var(--cockpit-stop) }
  .act.open { color: var(--fg-2) }
  @keyframes blink { 50% { opacity: .35 } }
  /* Seguir a Claude: el punto naranja sigue, gris queda quieto (como en Jarvis). */
  aside header .follow { width: auto; gap: 6px; padding: 0 var(--space-2); font-size: var(--text-xs); font-weight: 400; display: inline-flex; align-items: center }
  aside header .follow i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3) }
  aside header .follow.on i { background: var(--primary) }
  /* Frenar: el botón se pinta en rojo mientras está frenado, y debajo de la cabecera queda el aviso (barra y tinte,
     como un callout de la guía) con «Reanudar». */
  aside header #stopToggle.on { background: var(--cockpit-stop); color: var(--background) }
  .stopbar { flex: none; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--gutter);
    border-left: 3px solid var(--cockpit-stop); background: color-mix(in oklab, var(--cockpit-stop) 14%, transparent);
    font-size: var(--text-sm); line-height: 1.4 }
  .stopbar[hidden] { display: none }
  .session-bar { flex: none; display: flex; flex-wrap: wrap; gap: var(--space-1); padding: var(--space-1) var(--gutter) }
  .session-bar[hidden] { display: none }
  .sess-chip { border: 1px solid var(--border); background: none; color: var(--fg-3); font: inherit; font-size: var(--text-xs);
    font-family: var(--font-mono); padding: 1px 8px; border-radius: 999px; cursor: pointer }
  .sess-chip.on { color: var(--foreground); border-color: var(--primary) }
  .sess-chip.stopped { color: var(--status-bad) }
  .stopbar span { flex: 1 }
  .stopbar button { flex: none; height: 24px; padding: 0 var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-control);
    background: var(--panel-surface); color: var(--foreground); font: inherit; font-size: var(--text-xs); cursor: pointer }
  .stopbar button:hover { background: var(--hover) }
  .act.stop { color: var(--fg-2); font-weight: 600 }
  /* LA SESIÓN DEL PLAYGROUND (2026-11-19, Miguel: «cuando esté caducada debería aparecerme como una alerta en el centro
     de la pantalla, con un botoncito de login»). Vencida: un modal con el fondo oscurecido, como la configuración. Por
     vencer: una franja arriba del panel, que no bloquea. */
  .login-dialog { position: fixed; inset: 0; margin: auto; width: min(400px, calc(100vw - 32px)); height: fit-content; padding: 22px 24px;
    border: 1px solid var(--panel-border, var(--border)); border-radius: calc(var(--radius) + 10px); background: var(--panel-surface, var(--background));
    color: var(--foreground); box-shadow: var(--settings-shadow) }
  .login-dialog::backdrop { background: var(--settings-backdrop); backdrop-filter: blur(4px) }
  .login-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px }
  .login-icon { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    background: color-mix(in oklab, var(--cockpit-stop) 14%, transparent); color: var(--cockpit-stop) }
  .login-icon.ok { background: color-mix(in oklab, var(--status-ok) 14%, transparent); color: var(--status-ok) }
  .login-title { margin: 0; font-size: var(--text-title); font-weight: 600 }
  .login-when { margin: 2px 0 0; font-size: var(--text-sm); color: var(--fg-2) }
  .login-what { margin: 0 0 6px; color: var(--fg-2) }
  .login-list { margin: 0 0 18px; padding-left: 18px; color: var(--foreground); line-height: 1.7 }
  .login-actions { display: flex; justify-content: flex-end; gap: 8px }
  .login-foot { margin: 12px 0 0; font-size: var(--text-sm); color: var(--fg-3) }
  .login-wait { display: flex; align-items: center; gap: 8px; color: var(--fg-2) }
  .login-error { margin: 10px 0 0; font-size: var(--text-sm); color: var(--cockpit-stop) }
  .session-soon { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: 6px 8px 6px 14px; border-radius: 999px; border: 1px solid color-mix(in oklab, var(--cockpit-stop) 40%, var(--border));
    background: var(--panel-surface, var(--background)); color: var(--foreground); box-shadow: var(--settings-shadow); font-size: var(--text-sm) }
  .session-soon[hidden] { display: none }
  .session-soon .btn { padding: 2px 10px }
  /* LA BANDEJA DE AVISOS (2026-11-21): la campana de la barra abre una hoja pegada a la barra, con lo que avisó cada
     herramienta, también lo callado (apagado, con su motivo). La mandan lib/notice y sus archivos; acá sólo se leen
     (bin/cockpit notices --json, por Rust). Es un <dialog> no modal: Escape o un clic afuera la cierran. */
  .notices { position: fixed; left: 52px; top: 8px; bottom: 8px; width: min(400px, calc(100vw - 64px)); height: auto; max-height: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--panels-radius, 10px);
    background: var(--panel-surface, var(--background)); color: var(--foreground); box-shadow: var(--settings-shadow); overflow: hidden; z-index: 20 }
  .notices:not([open]) { display: none }
  .notices .region-body { flex: 1; min-height: 0; overflow: auto }
  .notice-row { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px var(--space-2); width: 100%; padding: var(--space-2) var(--gutter);
    border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer }
  .notice-row:hover { background: var(--hover) }
  .notice-row:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px }
  .notice-row svg { width: 16px; height: 16px; margin-top: 2px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; color: var(--fg-3) }
  .notice-title { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .notice-time { font-size: var(--text-xs); color: var(--fg-3); font-variant-numeric: tabular-nums }
  .notice-body { grid-column: 2 / -1; font-size: var(--text-sm); color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line }
  .notice-why { grid-column: 2 / -1; font-size: var(--text-xs); color: var(--fg-3) }
  .notice-row.unread .notice-title::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 6px 2px 0; border-radius: 50%; background: var(--primary); vertical-align: middle }
  .notice-row.silenced .notice-title { font-weight: 400; color: var(--fg-3) }
  .notice-row.failed .notice-why { color: var(--status-bad) }
  .notices-filter { margin-left: auto }
  /* Los ajustes de avisos, en el engranaje. */
  .notice-levels { display: inline-flex }
  .quiet-row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap }
  .quiet-row .input { width: auto }
</style>
</head>
<body>
<nav id="bar" aria-label="Aplicaciones"></nav>
<main id="panels"><div class="session-soon" id="sessionSoon" role="status" hidden><span id="sessionSoonText"></span>
  <button type="button" class="btn btn-sm" id="sessionSoonLogin">Renovar</button>
  <button type="button" class="region-action" id="sessionSoonClose" title="Ocultar hasta que venza" aria-label="Ocultar el aviso"><span class="ui-icon" data-icon="close" aria-hidden="true"></span></button></div></main>
<dialog class="login-dialog" id="loginDialog" aria-labelledby="loginTitle">
  <div class="login-head"><div class="login-icon" id="loginIcon"><span class="ui-icon" data-icon="lock" aria-hidden="true"></span></div>
    <div><h2 class="login-title" id="loginTitle"></h2><p class="login-when" id="loginWhen"></p></div></div>
  <div id="loginBody"></div>
</dialog>
<dialog class="notices" id="notices" aria-labelledby="noticesTitle">
  <div class="region-head"><span id="noticesTitle">Avisos</span>
    <div class="region-actions">
      <button type="button" class="region-action" id="noticesSilenced" aria-pressed="false" title="Ver también lo callado" aria-label="Ver también lo callado"><span class="ui-icon" data-icon="eye" aria-hidden="true"></span></button>
      <button type="button" class="region-action" id="noticesSettings" title="Ajustes de avisos" aria-label="Ajustes de avisos"><span class="ui-icon" data-icon="settings" aria-hidden="true"></span></button>
      <button type="button" class="region-action" id="noticesClose" title="Cerrar" aria-label="Cerrar los avisos"><span class="ui-icon" data-icon="close" aria-hidden="true"></span></button>
    </div></div>
  <div class="region-body" id="noticesBody"></div>
</dialog>
<dialog class="settings" id="settings" aria-label="Configuración de Cockpit">
  <div class="settings-frame">
    <!-- No es un <nav>: el estilo de la barra de Cockpit (nav, 48 px) lo aplastaba. -->
    <div class="settings-nav" role="navigation" aria-label="Secciones">
      <label class="settings-search">
        <span class="ui-icon" data-icon="search" aria-hidden="true"></span>
        <input id="settingsSearch" class="input" type="search" placeholder="Buscar" aria-label="Buscar en la configuración">
      </label>
      <p class="settings-group">Configuración</p>
      <div id="settingsSections" role="tablist" aria-orientation="vertical"></div>
    </div>
    <div class="settings-body" id="settingsBody">
      <button class="region-action settings-close" type="button" title="Cerrar" aria-label="Cerrar la configuración" id="settingsClose">
        <span class="ui-icon" data-icon="close" aria-hidden="true"></span>
      </button>
      <header class="settings-head"><h2 class="settings-title" id="settingsTitle"></h2><p class="settings-what" id="settingsWhat"></p></header>
      <div class="settings-blocks" id="settingsBlocks"></div>
    </div>
  </div>
</dialog>
<aside id="activity" aria-label="Lo que hace Claude" hidden>
  <header><span>Claude</span><span class="grow"></span>
    <button type="button" id="followToggle" class="follow"><i aria-hidden="true"></i><span></span></button>
    <button type="button" id="stopToggle" title="Frenar a Claude: no va a poder usar más herramientas" aria-label="Frenar a Claude"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    <button type="button" id="stopAll" class="follow" title="Frenar a todas las sesiones de Claude" hidden><span>todas</span></button>
    <button type="button" id="activityClear" title="Vaciar" aria-label="Vaciar el panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12.5a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5L18.5 7M9 7V4.5h6V7"/></svg></button>
    <button type="button" id="activityClose" title="Ocultar" aria-label="Ocultar el panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="session-bar" id="sessionBar" role="group" aria-label="Sesiones de Claude" hidden></div>
  <div class="stopbar" id="stopbar" role="status" hidden><span>Claude está frenado: no puede usar herramientas hasta que lo reanudes o le escribas.</span><button type="button" id="resume">Reanudar</button></div>
  <div class="feed" id="feed" aria-live="polite"><p class="empty">Cuando una sesión de Claude use herramientas, lo vas a ver acá, en vivo.</p></div>
</aside>
<script>
// Los íconos de cada app (trazos de 24×24, como los de la barra de VS Code).
const ICONS = {
  chat: '<path d="M4 5.5h16v10H9l-5 4v-14z"/><path d="M8 9.5h8M8 12.5h5"/>',
  tablero: '<rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M9.5 4.5v15M15 4.5v15"/><path d="M5.5 8h2M11.5 8h2M17 8h2M5.5 11h2M11.5 11h2"/>',
  harness: '<path d="M9.5 3.5h5M10.5 3.5v5.2L5.2 17.8A1.8 1.8 0 0 0 6.8 20.5h10.4a1.8 1.8 0 0 0 1.6-2.7L13.5 8.7V3.5"/><path d="M7.6 14h8.8"/>',
  jarvis: '<path d="M5 4.5l5.6 14.2 2-5.6 5.6-2z"/><path d="M12.6 13.1l5 5"/><path d="M18.5 3v3M17 4.5h3"/>',
  designer: '<path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.3 0 1.9-.8 1.9-1.7 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-.9.8-1.7 1.7-1.7h2a3.9 3.9 0 0 0 3.9-3.9C20.5 6.9 16.7 3.5 12 3.5z"/><circle cx="7.6" cy="11.2" r="1.1"/><circle cx="10.2" cy="7.4" r="1.1"/><circle cx="14.6" cy="7.6" r="1.1"/>',
  ecommerce: '<path d="M4 4.5h2l2.1 10.2a1.5 1.5 0 0 0 1.5 1.2h7.6a1.5 1.5 0 0 0 1.5-1.1L20 8.5H7"/><circle cx="10" cy="19.5" r="1.2"/><circle cx="17" cy="19.5" r="1.2"/>',
  sentinel: '<path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/>',
  goldfish: '<path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/><path d="M18 12v.5"/><path d="M16 17.93a9.77 9.77 0 0 1 0-11.86"/><path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33"/><path d="M10.46 7.26C10.2 5.88 9.17 4.24 8 3h5.8a2 2 0 0 1 1.98 1.67l.23 1.4"/><path d="m16.01 17.93-.23 1.4A2 2 0 0 1 13.8 21H9.5a5.96 5.96 0 0 0 1.49-3.98"/>',
  correo: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  flow: '<rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/>',
  news: '<path d="M15 18h-5"/><path d="M18 14h-8"/><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/><rect x="10" y="6" width="8" height="4" rx="1"/>',
  vault: '<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 19.5 3.5"/><path d="m16.5 6.5 2.5 2.5"/><path d="m14 9 2 2"/>',
  knowledge: '<path d="M4 4.5h6a2 2 0 0 1 2 2v13a1.5 1.5 0 0 0-1.5-1.5H4z"/><path d="M20 4.5h-6a2 2 0 0 0-2 2v13a1.5 1.5 0 0 1 1.5-1.5H20z"/><path d="m15 10 1.5 1.5L19 9"/>',
  sabueso: '<path d="M11.25 16.25h1.5L12 17z"/><path d="M16 14v.5"/><path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309"/><path d="M8 14v.5"/><path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5"/>',
  minutes: '<circle cx="7" cy="12" r="3.5"/><path d="M14 9v6M17.5 6.5v11M21 10v4"/>',
  wally: '<path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>',
}
const FALLBACK = '<rect x="4" y="4" width="16" height="16" rx="3"/>'

const tauri = window.__TAURI__
const invoke = tauri.core.invoke
const bar = document.getElementById('bar')
const panels = document.getElementById('panels')
const badges = {}       // id → número que mandó la app
const frames = {}       // id → su iframe, creado la primera vez que se abre
let apps = []
let current = ''
let pendingRoute = null // { id, hash }: un aviso que llegó antes de que la app cargara
// La bandeja de avisos (abajo, «LOS AVISOS»): acá arriba porque render() la usa para la campana.
const noticesEl = document.getElementById('notices')
let noticesData = null
let noticesUnread = 0

const pick = (key, fallback) => { try { return localStorage.getItem(key) || fallback } catch { return fallback } }
const keep = (key, value) => { try { localStorage.setItem(key, value) } catch { /* no hace falta */ } }

/* LAS APPS QUE NO SE VEN EN LA BARRA (Miguel, 2026-11-18: «poder quitar de la parte visual algunas herramientas»): se
   eligen en el engranaje → Apps, con un interruptor por app. Ocultar no apaga nada: la app sigue andando (sus avisos,
   su servidor de fondo) y se abre igual por un aviso o con `bin/cockpit open`; mientras está al frente se ve en la
   barra, para saber dónde se está. Los atajos ⌘1, ⌘2… cuentan sólo las visibles. */
const HIDDEN_KEY = 'cockpit.hidden-apps'
const hiddenApps = new Set((() => { try { return JSON.parse(pick(HIDDEN_KEY, '[]')) } catch { return [] } })())
const barApps = () => apps.filter((a) => !hiddenApps.has(a.id) || a.id === current)
function setVisible(id, visible) {
  if (!visible && apps.filter((a) => !hiddenApps.has(a.id)).length <= 1) return // al menos una queda en la barra
  if (visible) hiddenApps.delete(id)
  else hiddenApps.add(id)
  keep(HIDDEN_KEY, JSON.stringify([...hiddenApps]))
  render()
}

function render() {
  bar.innerHTML = ''
  barApps().forEach((app, i) => {
    const b = document.createElement('button')
    b.type = 'button'
    b.className = app.id === current ? 'on' : ''
    b.setAttribute('aria-label', app.name)
    b.setAttribute('aria-pressed', String(app.id === current))
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[app.id] || FALLBACK}</svg>`
    if (badges[app.id] > 0) b.insertAdjacentHTML('beforeend', `<span class="badge">${badges[app.id] > 99 ? '99+' : badges[app.id]}</span>`)
    b.addEventListener('click', () => { manualAt = Date.now(); select(app.id) })
    b.addEventListener('mouseenter', () => showTip(b, `${app.name}  ⌘${i + 1}`))
    b.addEventListener('mouseleave', hideTip)
    bar.append(b)
  })
  const spacer = document.createElement('div')
  spacer.className = 'spacer'
  const gear = document.createElement('button')
  gear.type = 'button'
  gear.className = 'settings-toggle' + (settingsOpen ? ' on' : '')
  gear.setAttribute('aria-label', 'Configuración')
  gear.setAttribute('aria-haspopup', 'dialog')
  gear.setAttribute('aria-expanded', String(settingsOpen))
  gear.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>'
  gear.addEventListener('click', () => { hideTip(); setSettingsOpen(!settingsOpen) })
  gear.addEventListener('mouseenter', () => { if (!settingsOpen) showTip(gear, 'Configuración') })
  gear.addEventListener('mouseleave', hideTip)
  const bell = document.createElement('button')
  bell.type = 'button'
  bell.className = 'notices-toggle' + (noticesEl.open ? ' on' : '')
  bell.setAttribute('aria-label', noticesUnread ? `Avisos, ${noticesUnread} sin leer` : 'Avisos')
  bell.setAttribute('aria-haspopup', 'dialog')
  bell.setAttribute('aria-expanded', String(noticesEl.open))
  bell.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>'
    + (noticesUnread > 0 ? `<span class="badge">${noticesUnread > 99 ? '99+' : noticesUnread}</span>` : '')
  bell.addEventListener('click', (e) => { e.stopPropagation(); hideTip(); setNoticesOpen(!noticesEl.open) })
  bell.addEventListener('mouseenter', () => { if (!noticesEl.open) showTip(bell, noticesPaused() ? 'Avisos (en pausa)' : 'Avisos') })
  bell.addEventListener('mouseleave', hideTip)
  bar.append(spacer, bell, gear)
  tellClaude()
}

let tip = null
function showTip(el, text) {
  hideTip()
  tip = document.createElement('div')
  tip.className = 'tip'
  tip.textContent = text
  tip.style.top = `${el.getBoundingClientRect().top + 12}px`
  document.body.append(tip)
}
function hideTip() { tip?.remove(); tip = null }

// Mostrar una app; la primera vez, además, se carga (`load`).
function select(id) {
  if (!apps.some((a) => a.id === id)) return Promise.resolve()
  current = id
  keep('cockpit.app', id)
  invoke('set_current', { id }).catch(() => {})
  render()
  for (const [key, f] of Object.entries(frames)) f.hidden = key !== id
  for (const w of panels.querySelectorAll('.waiting')) w.hidden = w.dataset.app !== id
  if (frames[id]) frames[id].focus()
  tellVisibility()
  return load(id)
}

// EL TEMA ÚNICO: el de la carcasa (guardado, o el del sistema) manda; cada app lo recibe al cargar.
const THEME_KEY = 'ui.theme'
const shellTheme = () => (document.documentElement.classList.contains('dark') ? 'dark' : 'light')
function setShellTheme(theme) {
  document.documentElement.classList.toggle('dark', theme === 'dark')
  document.documentElement.style.colorScheme = theme
  keep(THEME_KEY, theme)
}
/* LA PALETA ÚNICA, como el tema: la de la carcasa manda y cada app la recibe al cargar (cada iframe tiene su origen y
   guardaría la suya). Sus colores están en theme.css (`data-palette`) y el renglón de arranque la aplica antes de pintar. */
const PALETTE_KEY = 'ui.palette'
const PALETTES = [
  { id: 'default', label: 'Por defecto' }, { id: 'vintage', label: 'Vintage Paper' }, { id: 'catppuccin', label: 'Catppuccin' },
  { id: 'nord', label: 'Nord' }, { id: 'monokaipro', label: 'Monokai Pro' }, { id: 'ristretto', label: 'Monokai Ristretto' },
]
const shellPalette = () => document.documentElement.getAttribute('data-palette') || 'default'
function setShellPalette(id) {
  if (!PALETTES.some((p) => p.id === id)) return
  if (id === 'default') document.documentElement.removeAttribute('data-palette')
  else document.documentElement.setAttribute('data-palette', id)
  keep(PALETTE_KEY, id)
}
function tellPalette(f) {
  f.contentWindow?.postMessage({ cockpit: true, type: 'palette', palette: shellPalette() }, new URL(f.src).origin)
}
function tellTheme(f) {
  f.contentWindow?.postMessage({ cockpit: true, type: 'theme', theme: shellTheme() }, new URL(f.src).origin)
}

// A cada app: si está a la vista (la elegida y con la ventana de Cockpit visible).
function tellVisibility() {
  for (const [key, f] of Object.entries(frames)) {
    const visible = key === current && document.visibilityState === 'visible'
    f.contentWindow?.postMessage({ cockpit: true, type: 'visible', visible }, new URL(f.src).origin)
  }
}
document.addEventListener('visibilitychange', tellVisibility)

// Cargar una app: se levanta su servidor (Rust, `ensure_app`), se espera a que conteste y se crea su iframe, visible
// sólo si es la que estás mirando. Una vez por app.
const loading = {}
function load(id) {
  if (!loading[id]) loading[id] = loadOnce(id)
  return loading[id]
}
async function loadOnce(id) {
  const app = apps.find((a) => a.id === id)
  // El aviso de un intento anterior que falló se REUSA: antes cada reintento apilaba otro encima (el viejo quedaba
  // debajo diciendo «no arrancó»). `:not(.over)`: el de «dejó de contestar» (el vigilante) es otro y no se toca.
  let wait = panels.querySelector(`.waiting:not(.over)[data-app="${id}"]`)
  if (!wait) {
    wait = document.createElement('div')
    wait.className = 'waiting'
    wait.dataset.app = id
    panels.append(wait)
  }
  wait.hidden = current !== id
  wait.textContent = `Arrancando ${app.name}…`
  const start = Date.now()
  while (!(await invoke('ensure_app', { id }).catch(() => false))) {
    if (Date.now() - start > 90_000) {
      delete loading[id]
      // Falló: el aviso queda, con un botón para volver a intentar sin tener que cambiar de app y volver.
      const retry = document.createElement('button')
      retry.type = 'button'
      retry.className = 'btn btn-outline btn-sm'
      retry.textContent = 'Reintentar'
      retry.addEventListener('click', () => load(id))
      const box = document.createElement('div')
      box.style.cssText = 'display: grid; gap: var(--space-3); justify-items: center; text-align: center'
      box.append(`${app.name} no arrancó: mirá ~/Library/Logs/cockpit-${id}.log`, retry)
      wait.replaceChildren(box)
      return
    }
    await new Promise((r) => setTimeout(r, 700))
  }
  wait.remove()
  const f = document.createElement('iframe')
  f.title = app.name
  // El micrófono, para dictar (el chat); sin esto un iframe de otro origen no puede pedirlo.
  f.allow = 'microphone'
  f.src = app.url
  f.hidden = current !== id
  f.addEventListener('load', () => { tellTheme(f); tellPalette(f); tellVisibility(); tellClaude(); deliverRoute(id) })
  frames[id] = f
  panels.append(f)
}

// Una ruta a una app ya cargada: `#…` cambia sólo el hash (no recarga: la app lo toma por hashchange/popstate) y
// `/…` es un camino de su mismo origen (el harness rutea por camino). Sirve para cualquier app, sin que la app sepa de
// Cockpit.
function deliverRoute(id) {
  if (!pendingRoute || pendingRoute.id !== id || !frames[id]) return
  const app = apps.find((a) => a.id === id)
  const route = pendingRoute.hash
  pendingRoute = null
  const target = new URL(app.url)
  if (route.startsWith('#')) target.hash = route
  else if (route.startsWith('/')) { const next = new URL(route, target.origin); target.pathname = next.pathname; target.hash = next.hash; for (const [k, v] of next.searchParams) target.searchParams.set(k, v) }
  else return
  frames[id].src = target.href
}

// Lo llama Rust con un enlace cockpit://<app>/#/… (tocar un aviso) o con `bin/cockpit open`: esa app al frente, en esa
// ruta.
window.cockpitOpen = async (id, hash) => {
  pendingRoute = hash ? { id, hash } : null
  await select(id)
  deliverRoute(id)
}

// Lo que cuentan las apps. Sólo se cree a la app de ese origen.
window.addEventListener('message', (e) => {
  const app = apps.find((a) => new URL(a.url).origin === e.origin)
  const d = e.data
  if (!app || !d || d.cockpit !== true) return
  if (d.type === 'palette' && PALETTES.some((p) => p.id === d.palette)) {
    setShellPalette(d.palette)
    for (const f of Object.values(frames)) if (f.contentWindow !== e.source) tellPalette(f)
    if (settingsOpen) paintSettings()
    return
  }
  if (d.type === 'theme' && (d.theme === 'light' || d.theme === 'dark')) {
    setShellTheme(d.theme)
    for (const f of Object.values(frames)) if (f.contentWindow !== e.source) tellTheme(f)
    return
  }
  // Una app pide abrir otra en una ruta. Sólo apps conocidas.
  if (d.type === 'open' && apps.some((x) => x.id === d.app)) {
    window.cockpitOpen(d.app, typeof d.route === 'string' ? d.route : '')
    return
  }
  // El asterisco del pie de una app: abre o cierra el panel «Claude» (workbench.js, `cockpitClaudeButton`).
  if (d.type === 'claude') {
    setActivityOpen(!activityOpen, true)
    return
  }
  if (d.type === 'badge') {
    badges[app.id] = Math.max(0, Number(d.count) || 0)
    render()
    const total = Object.values(badges).reduce((n, c) => n + c, 0)
    tauri.window.getCurrentWindow().setBadgeCount(total > 0 ? total : undefined).catch(() => {})
  }
})

/* EL PANEL «CLAUDE»: lo que manda el puerto de control de Cockpit (Rust, `cockpit-activity`): lo que Claude cuenta
   (`say`, con `bin/cockpit say`), cada herramienta que usa (`start`/`end`, del hook `cockpit` de Claude Code) y cada vez
   que lleva Cockpit a una app (`open`). Se abre solo con actividad, salvo que lo hayas cerrado vos. */
const ACTIVITY_KEY = 'cockpit.activity'
// A cada app, si el panel está abierto y si hubo actividad sin ver: lo pinta su asterisco del pie.
function tellClaude() {
  for (const f of Object.values(frames)) {
    try { f.contentWindow?.postMessage({ cockpit: true, type: 'claude', open: activityOpen, unseen }, new URL(f.src).origin) } catch { /* todavía cargando */ }
  }
}
const activity = document.getElementById('activity')
const feed = document.getElementById('feed')
let activityOpen = pick(ACTIVITY_KEY, 'auto') === 'open'
let unseen = false
/* LAS SESIONES DE CLAUDE (2026-11-18): con más de una trabajando, Cockpit SIGUE a una sola (`focus`) y Frenar actúa
   sobre ésa. Antes cada sesión movía la ventana y Frenar las paraba a todas.
   - `focus` es la primera que habla; cambia sola cuando la que se seguía lleva FOCUS_IDLE sin hacer nada y otra actúa,
     o cuando tocás su ficha en la cabecera del panel (aparecen con dos o más activas).
   - una sesión deja de contar a los SESSION_IDLE sin actividad. */
const sessions = new Map() // id → cuándo se la vio por última vez
const stoppedSessions = new Set() // las frenadas ('*': todas)
let focus = ''
const FOCUS_IDLE = 90_000
const SESSION_IDLE = 30 * 60_000
const activeSessions = () => [...sessions].filter(([, at]) => Date.now() - at < SESSION_IDLE).map(([id]) => id)
function seeSession(id) {
  if (!id) return
  const before = activeSessions().length
  const prev = sessions.get(focus) || 0
  sessions.set(id, Date.now())
  if (!focus || (id !== focus && Date.now() - prev > FOCUS_IDLE)) focus = id
  if (activeSessions().length !== before || !document.getElementById('sessionBar').childElementCount) paintSessions()
}
const startedAt = {}
function setActivityOpen(open, byHand = false) {
  activityOpen = open
  activity.hidden = !open
  if (open) unseen = false
  if (byHand) keep(ACTIVITY_KEY, open ? 'open' : 'closed')
  render()
  if (settingsOpen) paintSettings()
}
document.getElementById('activityClose').addEventListener('click', () => setActivityOpen(false, true))
document.getElementById('activityClear').addEventListener('click', () => {
  feed.innerHTML = '<p class="empty">Vacío. Lo nuevo aparece acá.</p>'
})
const clock = () => new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false })
function line(className, html) {
  feed.querySelector('.empty')?.remove()
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40
  const el = document.createElement('div')
  el.className = `act ${className}`
  el.innerHTML = html
  feed.append(el)
  while (feed.children.length > 300) feed.firstElementChild.remove()
  if (atBottom) feed.scrollTop = feed.scrollHeight
  return el
}
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
// Con más de una sesión mandando, cada línea dice de cuál es (los primeros caracteres de su id).
const tag = (id) => id.slice(0, 4)
const sess = (a) => (seeSession(a.session), activeSessions().length > 1 && a.session ? `<span class="sess">${esc(tag(a.session))}</span>` : '')
/* FRENAR (Rust `set_stopped`, el hook `cockpit` niega las herramientas), POR SESIÓN: el botón de la cabecera frena y
   reanuda a la que se sigue (`focus`); con dos o más, «todas» las frena juntas. El aviso de abajo dice cuál está
   frenada. Escribirle a una sesión la reanuda a ella (el hook en UserPromptSubmit), no a las demás. */
const stopToggle = document.getElementById('stopToggle')
const stopAll = document.getElementById('stopAll')
const stopbar = document.getElementById('stopbar')
const sessionBar = document.getElementById('sessionBar')
const isStopped = (id) => stoppedSessions.has('*') || (!!id && stoppedSessions.has(id))
function paintStop() {
  const on = isStopped(focus)
  const many = activeSessions().length > 1
  const who = many && focus ? `la sesión ${tag(focus)}` : 'Claude'
  stopToggle.classList.toggle('on', on)
  stopToggle.title = on ? `Reanudar a ${who}: vuelve a poder usar herramientas` : `Frenar a ${who}: no va a poder usar más herramientas`
  stopToggle.setAttribute('aria-label', on ? `Reanudar a ${who}` : `Frenar a ${who}`)
  stopToggle.setAttribute('aria-pressed', String(on))
  stopAll.hidden = !many
  const list = stoppedSessions.has('*') ? ['todas las sesiones'] : [...stoppedSessions].map((id) => `la sesión ${tag(id)}`)
  stopbar.hidden = !list.length
  stopbar.querySelector('span').textContent = !list.length ? '' : stoppedSessions.has('*')
    ? 'Frenadas todas las sesiones: no pueden usar herramientas hasta que las reanudes.'
    : many ? `Frenada ${list.join(', ')}: no puede usar herramientas hasta que la reanudes o le escribas.`
    : 'Claude está frenado: no puede usar herramientas hasta que lo reanudes o le escribas.'
}
// Las fichas de las sesiones activas (con dos o más): cuál se sigue y cuál está frenada. Tocar una pasa a seguirla.
function paintSessions() {
  const ids = activeSessions()
  sessionBar.hidden = ids.length < 2
  sessionBar.innerHTML = ids.map((id) => `<button type="button" class="sess-chip${id === focus ? ' on' : ''}${isStopped(id) ? ' stopped' : ''}" data-session="${esc(id)}"
    aria-pressed="${id === focus}" title="${id === focus ? 'Cockpit sigue a esta sesión; Frenar actúa sobre ella' : 'Seguir a esta sesión'}${isStopped(id) ? ' · frenada' : ''}">${esc(tag(id))}${isStopped(id) ? ' ■' : ''}</button>`).join('')
  paintStop()
}
sessionBar.addEventListener('click', (e) => {
  const id = e.target.closest('[data-session]')?.dataset.session
  if (id) { focus = id; sessions.set(id, Date.now()); paintSessions() }
})
stopToggle.addEventListener('click', () => invoke('set_stopped', { stopped: !isStopped(focus), session: focus }).catch(() => {}))
stopAll.addEventListener('click', () => invoke('set_stopped', { stopped: true, session: '' }).catch(() => {}))
// «Reanudar» suelta todo lo frenado: es el botón del aviso, que las nombra.
document.getElementById('resume').addEventListener('click', () => invoke('set_stopped', { stopped: false, session: '' }).catch(() => {}))
paintStop()
function onActivity(a) {
  if (!a || !a.kind) return
  if (a.kind === 'stop') {
    stoppedSessions.clear()
    for (const id of a.list || []) stoppedSessions.add(id)
    paintSessions()
    const who = a.session && activeSessions().length > 1 ? `${tag(a.session)} · ` : ''
    line('stop', `<span>${a.stopped ? '■' : '▶'} ${esc(who + a.text)}</span><time>${clock()}</time>`)
    if (a.stopped && !activityOpen) setActivityOpen(true)
    return
  }
  if (a.kind === 'say') line('say', `${sess(a)}<p>${esc(a.text)}</p><time>${clock()}</time>`)
  else if (a.kind === 'open') line('open', `${sess(a)}<span>→ ${esc(apps.find((x) => x.id === a.app)?.name || a.app)} ${esc(a.text)}</span><time>${clock()}</time>`)
  else if (a.kind === 'start') {
    startedAt[a.id] = Date.now()
    const el = line('cmd', `${sess(a)}<span class="state run" aria-label="corriendo"></span><span class="tool">${esc(a.tool)}</span><code title="${esc(a.text)}">${esc(a.text)}</code><time>${clock()}</time>`)
    el.dataset.id = a.id || ''
  } else if (a.kind === 'end') {
    const el = a.id && [...feed.querySelectorAll('.act.cmd')].reverse().find((x) => x.dataset.id === a.id)
    if (!el) return
    const state = el.querySelector('.state')
    state.className = `state ${a.ok === false ? 'fail' : 'ok'}`
    state.setAttribute('aria-label', a.ok === false ? 'falló' : 'listo')
    if (startedAt[a.id]) {
      const ms = Date.now() - startedAt[a.id]
      el.querySelector('time').textContent = ms < 1000 ? `${ms} ms` : `${(ms / 1000).toFixed(1)} s`
      delete startedAt[a.id]
    }
    return
  }
  if (!activityOpen && pick(ACTIVITY_KEY, 'auto') !== 'closed') setActivityOpen(true)
  else if (!activityOpen) { unseen = true; render() }
}
activity.hidden = !activityOpen
/* SEGUIR A CLAUDE: cuando Claude usa una herramienta que es de una app (el hook dice cuál y en qué ruta: correr el
   harness, escribir en una tarea, manejar Jarvis), Cockpit salta ahí. Si elegiste una app a mano, se respeta 20 s. */
const FOLLOW_KEY = 'cockpit.follow'
let follow = pick(FOLLOW_KEY, 'on') !== 'off'
let manualAt = 0
let lastFollow = ''
const followToggle = document.getElementById('followToggle')
function paintFollow() {
  followToggle.classList.toggle('on', follow)
  followToggle.querySelector('span').textContent = follow ? 'siguiendo' : 'quieto'
  followToggle.title = follow
    ? 'Siguiendo a Claude: Cockpit salta a la app que está usando (si elegís una a mano, se respeta 20 s). Clic para quedarte quieto'
    : 'Quieto: Cockpit no cambia de app solo. Clic para seguir a Claude'
  followToggle.setAttribute('aria-pressed', String(follow))
}
followToggle.addEventListener('click', () => { follow = !follow; keep(FOLLOW_KEY, follow ? 'on' : 'off'); paintFollow() })
paintFollow()

/* LA CONFIGURACIÓN (el engranaje de la barra): un modal como el de canon, con secciones a la izquierda y la elegida a
   la derecha. No guarda nada nuevo: el tema es el de todas las apps, «seguir a Claude» es el mismo punto del panel, y
   «cuándo se abre» es lo que ya decide el panel cuando lo cerrás a mano (cockpit.activity: closed). Las apps se leen de
   Rust (`apps_state`) y se reinician con `restart_app`, lo mismo que `bin/cockpit restart`. */
const settings = document.getElementById('settings')
let settingsOpen = false
const SECTIONS = [
  { id: 'appearance', t: 'Apariencia', icon: 'theme', d: 'El color y el modo, claro u oscuro. Vale para todas las apps de Cockpit.', keys: 'tema claro oscuro color paleta nord catppuccin monokai vintage' },
  { id: 'claude', t: 'Claude', icon: 'claude', d: 'Lo que hace Claude, en vivo, en el panel que abre el asterisco del pie de cada app.', keys: 'seguir panel actividad frenar asterisco' },
  { id: 'model', t: 'Modelo', icon: 'clock', d: 'El modelo de lo que corre en segundo plano: lo agendado, a ciertas horas, sin nadie mirando.', keys: 'modelo claude gemini segundo plano agendado tareas bedrock ia' },
  { id: 'notices', t: 'Avisos', icon: 'bell', d: 'Los avisos de todas las herramientas: el no molestar, una pausa y cuánto avisa cada una. Vale también con Cockpit cerrado.', keys: 'avisos notificaciones no molestar silencio pausa sonido campana' },
  { id: 'apps', t: 'Apps', icon: 'apps', d: 'Las herramientas de la barra: si están arriba, y reiniciar una para que tome un cambio.', keys: 'servidor puerto reiniciar arriba apagada' },
  { id: 'help', t: 'Cómo se usa', icon: 'help', d: 'Lo que hay en cada lugar de Cockpit.', keys: 'ayuda guía atajos barra pie' },
]
let settingsSection = 'appearance'
let settingsFilter = ''
const option = (act, checked, name, what) => `<button type="button" class="option" role="radio" aria-checked="${checked}" data-act="${act}">
  <span class="option-name">${esc(name)}</span><span class="option-what">${esc(what)}</span><span class="ui-icon" data-icon="check" aria-hidden="true"></span></button>`
let appStates = []
async function loadAppStates() {
  appStates = await invoke('apps_state').catch(() => [])
  if (settingsOpen && settingsSection === 'apps') paintSettings()
}
// EL MODELO DE SEGUNDO PLANO: se lee y se guarda con `bin/pg model` (Rust: model_state, set_model), en
// ~/.config/creditop-cockpit/settings.json, para que lo agendado lea lo mismo con Cockpit cerrado.
let modelState = null
let modelError = ''
let modelBusy = false
async function loadModelState() {
  modelBusy = true
  if (settingsOpen && settingsSection === 'model') paintSettings()
  try { modelState = await invoke('model_state'); modelError = '' } catch (err) { modelError = String(err) }
  modelBusy = false
  if (settingsOpen && settingsSection === 'model') paintSettings()
}
const MODEL_CHOICES = [
  { id: 'claude', name: 'Claude', what: 'Claude Sonnet 5.5 en el Bedrock de CreditOp, por el puente de canon: el mismo modelo de canon en producción. Lo paga la empresa; pide la sesión del playground.' },
  { id: 'gemini', name: 'Gemini', what: 'Gemini por su API: gasta la cuota de su llave.' },
]
function paintSections() {
  const q = settingsFilter.trim().toLowerCase()
  const visible = q ? SECTIONS.filter((x) => `${x.t} ${x.keys}`.toLowerCase().includes(q)) : SECTIONS
  if (visible.length && !visible.some((x) => x.id === settingsSection)) settingsSection = visible[0].id
  document.getElementById('settingsSections').innerHTML = visible.map((x) =>
    `<button type="button" class="section" role="tab" aria-selected="${x.id === settingsSection}" data-section="${x.id}"><span class="ui-icon" data-icon="${x.icon}" aria-hidden="true"></span><span>${esc(x.t)}</span></button>`).join('')
    || `<p class="settings-none">Nada coincide con «${esc(settingsFilter)}».</p>`
}
function paintSettings() {
  paintSections()
  const s = SECTIONS.find((x) => x.id === settingsSection)
  document.getElementById('settingsTitle').textContent = s.t
  document.getElementById('settingsWhat').textContent = s.d
  const blocks = document.getElementById('settingsBlocks')
  if (settingsSection === 'appearance') {
    const theme = shellTheme()
    const palette = shellPalette()
    // Dos filas, la misma paleta en claro y en oscuro: se ve cómo queda en cada modo antes de elegir (como en canon).
    const row = (mode, name) => `<div class="palette-row" data-mode="${mode}"><span class="palette-row-name">${name}</span>
      <div class="palette-options" role="radiogroup" aria-label="Paleta de color, ${name.toLowerCase()}">${PALETTES.map((p) =>
        `<button type="button" class="palette-swatch" role="radio" data-palette-pick="${p.id}" data-mode="${mode}"
          aria-checked="${palette === p.id && theme === mode}" title="${esc(p.label)}" aria-label="${esc(p.label)}"></button>`).join('')}</div></div>`
    const current = PALETTES.find((p) => p.id === palette)?.label || 'Por defecto'
    blocks.innerHTML = `<section><h3>Color</h3><div class="settings-box padded"><div class="palette-rows">
      ${row('light', 'Claro')}${row('dark', 'Oscuro')}</div></div>
      <p>${esc(current)}, en modo ${theme === 'dark' ? 'oscuro' : 'claro'}. Vale para todas las apps de Cockpit.</p></section>`
  } else if (settingsSection === 'claude') {
    const auto = pick(ACTIVITY_KEY, 'auto') !== 'closed'
    blocks.innerHTML = `<section><h3>Seguir a Claude</h3><div class="options" role="radiogroup" aria-label="Seguir a Claude">
      ${option('follow-on', follow, 'Siguiendo', 'Cockpit salta a la app que Claude está usando (si elegís una a mano, se respeta 20 s).')}
      ${option('follow-off', !follow, 'Quieto', 'Cockpit no cambia de app solo.')}</div></section>
      <section><h3>El panel de Claude</h3><div class="options" role="radiogroup" aria-label="Cuándo se abre el panel">
      ${option('auto-on', auto, 'Se abre solo con actividad', 'Cuando Claude usa una herramienta, el panel aparece.')}
      ${option('auto-off', !auto, 'Sólo cuando lo abro', 'Queda cerrado; el asterisco del pie marca con un punto lo que no viste.')}</div></section>`
  } else if (settingsSection === 'model') {
    const chosen = modelState?.model || 'claude'
    const status = modelBusy ? 'Comprobando…' : modelError ? modelError : modelState ? (modelState.ready ? `Listo · ${modelState.detail}` : `No está listo · ${modelState.detail}`) : ''
    blocks.innerHTML = `<section><h3>Modelo de segundo plano</h3><div class="options" role="radiogroup" aria-label="Modelo de segundo plano">
      ${MODEL_CHOICES.map((m) => option(`model-${m.id}`, chosen === m.id, m.name, m.what)).join('')}</div></section>
      <section><h3>Estado</h3><div class="settings-box"><div class="settings-row"><span class="settings-row-text">
        <span class="settings-row-name">${esc(MODEL_CHOICES.find((m) => m.id === chosen)?.name || chosen)}</span>
        <span class="settings-row-what">${esc(status)}</span></span>
        <span class="state ${modelState?.ready && !modelBusy ? 'up' : ''}">${modelBusy ? '…' : modelState?.ready ? 'listo' : 'no'}</span>
        <button type="button" class="btn btn-outline btn-sm" data-act="model-check" ${modelBusy ? 'disabled' : ''}>Comprobar</button></div></div>
      <p>Wally elige el suyo aparte, en su barra.</p></section>`
  } else if (settingsSection === 'notices') {
    blocks.innerHTML = noticesSettingsHTML()
  } else if (settingsSection === 'apps') {
    blocks.innerHTML = `<section><h3>Las apps de la barra</h3><div class="settings-box">${apps.map((a) => {
      const st = appStates.find((x) => x.id === a.id) || {}
      const what = `${(st.ports || []).map((p) => ':' + p.split(':').pop()).join(' · ')}${st.started ? ' · la levantó Cockpit' : st.ready ? ' · la levantó una terminal' : ''}`
      const canRestart = a.id !== 'chat' && st.ready
      const visible = !hiddenApps.has(a.id)
      return `<div class="settings-row"><span class="settings-row-text"><span class="settings-row-name">${esc(a.name)}</span><span class="settings-row-what">${esc(what)}</span></span>
        <span class="state ${st.ready ? 'up' : ''}">${st.ready ? 'arriba' : 'apagada'}</span>
        ${canRestart ? `<button type="button" class="btn btn-outline btn-sm" data-restart="${a.id}">Reiniciar</button>` : ''}
        <button type="button" class="switch" role="switch" aria-checked="${visible}" data-visible="${a.id}" title="${visible ? 'Se ve en la barra: tocá para ocultarla' : 'Oculta: tocá para mostrarla en la barra'}" aria-label="${esc(a.name)} en la barra"></button></div>`
    }).join('')}</div><p>El interruptor muestra u oculta la app en la barra; oculta sigue andando (sus avisos, lo de fondo) y se abre igual por un aviso. Reiniciar sirve para que una app tome un cambio en su servidor (Go no se recarga solo). El chat lo cuida Cockpit solo.</p></section>`
  } else {
    blocks.innerHTML = `<section><ol class="settings-steps">
      <li><b>La barra</b>: cada herramienta en su panel; ⌘1, ⌘2… cambian de app. Lo que estabas haciendo sigue ahí.</li>
      <li><b>El asterisco del pie</b>: abre o cierra el panel de Claude, con lo que hace en vivo. Ahí está «Frenar».</li>
      <li><b>Una app que se cae</b> vuelve sola: Cockpit la levanta de nuevo en unos segundos.</li>
    </ol><p>Cerrar la ventana la esconde: Cockpit sigue juntando el chat y avisando.</p></section>`
  }
}
function setSettingsOpen(open) {
  settingsOpen = open
  render()
  if (open && !settings.open) {
    settingsFilter = ''
    document.getElementById('settingsSearch').value = ''
    paintSettings()
    settings.showModal()
    loadAppStates()
  } else if (!open && settings.open) settings.close()
}
settings.addEventListener('close', () => { if (settingsOpen) { settingsOpen = false; render() } })
// Un clic en el fondo (fuera del marco) cierra, como en canon.
settings.addEventListener('click', (e) => { if (e.target === settings) setSettingsOpen(false) })
document.getElementById('settingsClose').addEventListener('click', () => setSettingsOpen(false))
document.getElementById('settingsSearch').addEventListener('input', (e) => { settingsFilter = e.target.value; paintSettings() })
document.getElementById('settingsSections').addEventListener('click', (e) => {
  const id = e.target.closest('[data-section]')?.dataset.section
  if (id) { settingsSection = id; paintSettings(); if (id === 'model') loadModelState(); if (id === 'notices') loadNotices() }
})
document.getElementById('settingsBlocks').addEventListener('click', async (e) => {
  const visibleId = e.target.closest('[data-visible]')?.dataset.visible
  if (visibleId) {
    setVisible(visibleId, hiddenApps.has(visibleId))
    paintSettings()
    document.querySelector(`#settingsBlocks [data-visible="${visibleId}"]`)?.focus()
    return
  }
  const restartId = e.target.closest('[data-restart]')?.dataset.restart
  if (restartId) {
    const b = e.target.closest('button')
    b.disabled = true
    b.textContent = 'Reiniciando…'
    try { await invoke('restart_app', { id: restartId }) } catch (err) { b.textContent = String(err).slice(0, 60); return }
    setTimeout(loadAppStates, 1500)
    return
  }
  const pick = e.target.closest('[data-palette-pick]')
  if (pick) {
    setShellPalette(pick.dataset.palettePick)
    setShellTheme(pick.dataset.mode)
    for (const f of Object.values(frames)) { tellPalette(f); tellTheme(f) }
    paintSettings()
    document.querySelector(`#settingsBlocks [data-palette-pick="${pick.dataset.palettePick}"][data-mode="${pick.dataset.mode}"]`)?.focus()
    return
  }
  if (await noticesSettingsClick(e)) return
  const act = e.target.closest('[data-act]')?.dataset.act
  if (!act) return
  if (act === 'light' || act === 'dark') {
    setShellTheme(act)
    for (const f of Object.values(frames)) tellTheme(f)
  } else if (act === 'follow-on' || act === 'follow-off') {
    follow = act === 'follow-on'
    keep(FOLLOW_KEY, follow ? 'on' : 'off')
    paintFollow()
  } else if (act === 'auto-on' || act === 'auto-off') {
    keep(ACTIVITY_KEY, act === 'auto-on' ? 'auto' : 'closed')
  } else if (act === 'model-check') {
    loadModelState()
    return
  } else if (act.startsWith('model-')) {
    try { await invoke('set_model', { model: act.slice(6) }) } catch (err) { modelError = String(err) }
    loadModelState()
    return
  }
  paintSettings()
  document.querySelector(`#settingsBlocks [data-act="${act}"]`)?.focus()
})

function followTo(app, route) {
  if (!follow || !apps.some((a) => a.id === app) || Date.now() - manualAt < 20_000) return
  const key = `${app}|${route || ''}`
  if (app === current && (!route || key === lastFollow)) return
  lastFollow = key
  pendingRoute = route ? { id: app, hash: route } : null
  select(app).then(() => deliverRoute(app))
}
// UNA APP SE CAYÓ (el vigilante de Rust, `cockpit-app`): un aviso la tapa mientras Cockpit la vuelve a levantar, y
// cuando contesta de nuevo se recarga (el iframe se había quedado con la página de error).
const DOWN_TEXT = {
  down: (name) => `${name} dejó de contestar. Si no vuelve sola en unos segundos, Cockpit la levanta de nuevo.`,
  restarting: (name) => `Levantando ${name} de nuevo…`,
}
tauri.event.listen('cockpit-app', (e) => {
  const { id, state } = e.payload || {}
  const app = apps.find((a) => a.id === id)
  if (!app || !frames[id]) return
  let cover = panels.querySelector(`.waiting.over[data-app="${id}"]`)
  if (state === 'up') {
    if (!cover) return
    cover.remove()
    frames[id].src = frames[id].src
    return
  }
  if (!DOWN_TEXT[state]) return
  if (!cover) {
    cover = document.createElement('div')
    cover.className = 'waiting over'
    cover.dataset.app = id
    cover.hidden = current !== id
    panels.append(cover)
  }
  cover.textContent = DOWN_TEXT[state](app.name)
})

tauri.event.listen('cockpit-activity', (e) => {
  onActivity(e.payload)
  // Sólo la sesión que se sigue mueve la ventana: con dos trabajando, la otra no te cambia de app.
  const p = e.payload
  if (p?.kind === 'start' && p.app && (!p.session || !focus || p.session === focus)) followTo(p.app, p.route)
})

/* ── LOS AVISOS ─────────────────────────────────────────────────────────────────────────────────────────────────
   Los manda lib/notice (Go) desde cada herramienta; Cockpit los lee y edita sus ajustes con `bin/cockpit notices`
   (Rust: notices_state, notices_read, notices_save, notices_test). Rust avisa «cockpit-notices» cuando entra uno. */
let noticesShowSilenced = false
let noticesError = ''
const noticesPaused = () => { const p = noticesData?.settings?.pausedUntil; return !!p && new Date(p) > new Date() }
const NOTIFIER_TEXT = {
  authorized: ['Cockpit puede avisar', 'macOS le dio permiso: los avisos dicen «Cockpit» y tocarlos abre la herramienta.', true],
  notDetermined: ['Falta el permiso de macOS', 'Mientras tanto salen por el avisador viejo del chat. «Probar» lo pide: tocá «Permitir» en el aviso de macOS.', false],
  denied: ['macOS no le da permiso', 'Ajustes del Sistema → Notificaciones → «Cockpit» → permitir. Mientras, salen por osascript.', false],
  missing: ['Falta el avisador', 'make cockpit lo compila (hace falta swiftc). Mientras, salen por el avisador viejo o por osascript.', false],
}
async function loadNotices(read = false) {
  try { noticesData = await invoke(read ? 'notices_read' : 'notices_state'); noticesError = '' } catch (err) { noticesError = String(err) }
  noticesUnread = read ? 0 : (noticesData?.unread || 0)
  render()
  if (noticesEl.open) paintNotices()
  if (settingsOpen && settingsSection === 'notices') paintSettings()
}
function setNoticesOpen(open) {
  if (open && !noticesEl.open) { noticesEl.show(); paintNotices(); loadNotices(true); noticesEl.querySelector('#noticesClose').focus() }
  else if (!open && noticesEl.open) noticesEl.close()
  render()
}
const noticeDay = (d) => {
  const today = new Date(), y = new Date(today.getTime() - 864e5)
  if (d.toDateString() === today.toDateString()) return 'Hoy'
  if (d.toDateString() === y.toDateString()) return 'Ayer'
  return d.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' }).replace(/^./, (c) => c.toUpperCase())
}
function paintNotices() {
  const body = document.getElementById('noticesBody')
  const silencedBtn = document.getElementById('noticesSilenced')
  silencedBtn.setAttribute('aria-pressed', String(noticesShowSilenced))
  silencedBtn.classList.toggle('on', noticesShowSilenced)
  if (noticesError) { body.innerHTML = `<div class="alert alert-bad" style="margin: var(--space-3); width: auto">${esc(noticesError)}</div>`; return }
  if (!noticesData) { body.innerHTML = '<div class="skeleton-row"></div><div class="skeleton-row"></div>'; return }
  const readUntil = noticesData.readUntil || ''
  const items = (noticesData.items || []).filter((r) => noticesShowSilenced || !r.silenced)
  const hiddenCount = (noticesData.items || []).length - items.length
  const pause = noticesPaused() ? `<div class="alert alert-warn" style="margin: var(--space-3); width: auto"><div class="alert-desc">En pausa hasta las ${hhmm(noticesData.settings.pausedUntil)}: los avisos quedan acá sin sonar.</div></div>` : ''
  if (!items.length) {
    body.innerHTML = pause + `<div class="empty"><div class="empty-head"><div class="empty-title">Sin avisos</div><div class="empty-desc">${hiddenCount ? `Hay ${hiddenCount} callado${hiddenCount === 1 ? '' : 's'}: el ojo de arriba los muestra.` : 'Lo que avise cada herramienta va a quedar acá 30 días.'}</div></div></div>`
    return
  }
  const appName = (id) => apps.find((a) => a.id === id)?.name || (noticesData.apps || []).find((a) => a.ID === id)?.Name || id
  let html = pause, day = ''
  for (const r of items) {
    const d = new Date(r.at)
    const dd = noticeDay(d)
    if (dd !== day) { day = dd; html += `<div class="region-head group"><span>${esc(dd)}</span></div>` }
    const cls = ['notice-row', r.silenced ? 'silenced' : '', r.error ? 'failed' : '', !r.silenced && r.at > readUntil ? 'unread' : ''].join(' ')
    const why = r.silenced ? `callado: ${r.silenced}` : r.error ? `no salió: ${r.error}` : ''
    html += `<button type="button" class="${cls}" data-url="${esc(r.url || '')}" title="${esc(appName(r.app))}${r.via ? ' · salió por ' + esc(r.via) : ''}">
      <svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[r.app] || FALLBACK}</svg>
      <span class="notice-title">${esc(r.title)}</span><span class="notice-time">${hhmm(r.at)}</span>
      ${r.body ? `<span class="notice-body">${esc(r.body)}</span>` : ''}${why ? `<span class="notice-why">${esc(why)}</span>` : ''}</button>`
  }
  if (!noticesShowSilenced && hiddenCount) html += `<p class="notice-why" style="padding: var(--space-3) var(--gutter)">${hiddenCount} callado${hiddenCount === 1 ? '' : 's'} sin mostrar.</p>`
  body.innerHTML = html
}
document.getElementById('noticesBody').addEventListener('click', (e) => {
  const row = e.target.closest('.notice-row')
  if (!row) return
  const raw = row.dataset.url
  setNoticesOpen(false)
  if (!raw) return
  try {
    const u = new URL(raw)
    if (u.protocol === 'cockpit:' && apps.some((a) => a.id === u.host)) window.cockpitOpen(u.host, u.hash)
  } catch { /* un enlace raro no abre nada */ }
})
document.getElementById('noticesSilenced').addEventListener('click', () => { noticesShowSilenced = !noticesShowSilenced; paintNotices() })
document.getElementById('noticesClose').addEventListener('click', () => setNoticesOpen(false))
document.getElementById('noticesSettings').addEventListener('click', () => { setNoticesOpen(false); settingsSection = 'notices'; setSettingsOpen(true); loadNotices() })
noticesEl.addEventListener('close', render)
noticesEl.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.preventDefault(); setNoticesOpen(false) } })
document.addEventListener('mousedown', (e) => { if (noticesEl.open && !noticesEl.contains(e.target) && !e.target.closest('.notices-toggle')) setNoticesOpen(false) })
window.cockpitOpenNotices = () => setNoticesOpen(true)
tauri.event.listen('cockpit-notices', () => loadNotices(noticesEl.open))

const LEVEL_NAMES = { all: 'Todos', important: 'Importantes', none: 'Ninguno' }
function noticesSettingsHTML() {
  if (noticesError) return `<div class="alert alert-bad"><div class="alert-desc">${esc(noticesError)}</div></div>`
  if (!noticesData) return '<p>Cargando…</p>'
  const st = noticesData.settings || {}
  const q = st.quiet || {}
  const [name, what, ok] = NOTIFIER_TEXT[noticesData.notifier] || NOTIFIER_TEXT.missing
  const paused = noticesPaused()
  const levels = (noticesData.apps || []).map((a) => {
    const lvl = (st.apps || {})[a.ID] || 'all'
    return `<div class="settings-row"><span class="settings-row-text"><span class="settings-row-name">${esc(a.Name)}</span></span>
      <div class="toggle-group toggle-outline toggle-joined notice-levels" role="radiogroup" aria-label="Avisos de ${esc(a.Name)}">${['all', 'important', 'none'].map((l) =>
        `<button type="button" class="toggle btn-sm" role="radio" aria-checked="${lvl === l}" aria-pressed="${lvl === l}" data-notice-level="${a.ID}:${l}">${LEVEL_NAMES[l]}</button>`).join('')}</div></div>`
  }).join('')
  return `<section><h3>El avisador</h3><div class="settings-box"><div class="settings-row"><span class="settings-row-text">
      <span class="settings-row-name">${esc(name)}</span><span class="settings-row-what">${esc(what)}</span></span>
      <span class="state ${ok ? 'up' : ''}">${ok ? 'listo' : 'no'}</span>
      <button type="button" class="btn btn-outline btn-sm" data-notice-act="test">Probar</button></div></div></section>
    <section><h3>No molestar</h3><div class="settings-box padded"><div class="quiet-row">
      <button type="button" class="switch" role="switch" aria-checked="${!!q.on}" data-notice-act="quiet" aria-label="No molestar todos los días"></button>
      <span>Todos los días de</span>
      <input class="input" type="time" value="${esc(q.from || '19:00')}" data-notice-time="from" ${q.on ? '' : 'disabled'} aria-label="No molestar desde">
      <span>a</span>
      <input class="input" type="time" value="${esc(q.to || '08:00')}" data-notice-time="to" ${q.on ? '' : 'disabled'} aria-label="No molestar hasta"></div>
      <label class="quiet-row" style="margin-top: var(--space-3)"><input type="checkbox" ${st.importantBreaksQuiet ? 'checked' : ''} data-notice-act="breaks"> Los importantes avisan igual (una alerta de Sentinel, una mención en el chat)</label></div></section>
    <section><h3>Pausa</h3><div class="settings-box"><div class="settings-row"><span class="settings-row-text">
      <span class="settings-row-name">${paused ? `En pausa hasta las ${hhmm(st.pausedUntil)}` : 'Sin pausa'}</span>
      <span class="settings-row-what">En pausa no sale ninguno, ni los importantes; igual quedan en la campana.</span></span>
      ${paused ? '<button type="button" class="btn btn-outline btn-sm" data-notice-act="unpause">Quitar la pausa</button>'
        : '<button type="button" class="btn btn-outline btn-sm" data-notice-act="pause-1h">1 hora</button><button type="button" class="btn btn-outline btn-sm" data-notice-act="pause-3h">3 horas</button>'}</div></div></section>
    <section><h3>Cuánto avisa cada una</h3><div class="settings-box">${levels}</div>
      <p><b>Importantes</b>: lo que suena — una alerta de Sentinel, una corrida de Knowledge que frenó o falló, una mención, un correo de quien seguís. Lo que no sale queda en la campana con su motivo.</p></section>`
}
async function saveNoticeSettings(change) {
  const next = { ...(noticesData?.settings || {}), ...change }
  try { await invoke('notices_save', { settings: next }) } catch (err) { noticesError = String(err) }
  await loadNotices()
}
async function noticesSettingsClick(e) {
  const lvl = e.target.closest('[data-notice-level]')?.dataset.noticeLevel
  if (lvl) {
    const [app, level] = lvl.split(':')
    await saveNoticeSettings({ apps: { ...(noticesData.settings.apps || {}), [app]: level } })
    document.querySelector(`#settingsBlocks [data-notice-level="${lvl}"]`)?.focus()
    return true
  }
  const act = e.target.closest('[data-notice-act]')?.dataset.noticeAct
  if (!act) return false
  const st = noticesData?.settings || {}
  if (act === 'test') {
    invoke('notices_test').catch(() => {})
    window.toast?.('Aviso de prueba enviado', { description: 'Si macOS pide permiso, tocá «Permitir».' })
    setTimeout(() => loadNotices(), 4000)
  } else if (act === 'quiet') await saveNoticeSettings({ quiet: { ...st.quiet, on: !st.quiet?.on } })
  else if (act === 'breaks') await saveNoticeSettings({ importantBreaksQuiet: e.target.checked })
  else if (act === 'unpause') await saveNoticeSettings({ pausedUntil: '' })
  else if (act.startsWith('pause-')) await saveNoticeSettings({ pausedUntil: new Date(Date.now() + parseInt(act.slice(6)) * 3600e3).toISOString() })
  document.querySelector(`#settingsBlocks [data-notice-act="${act}"]`)?.focus()
  return true
}
document.getElementById('settingsBlocks').addEventListener('change', (e) => {
  const which = e.target.dataset?.noticeTime
  if (which) saveNoticeSettings({ quiet: { ...(noticesData?.settings?.quiet || {}), [which]: e.target.value } })
})
setTimeout(() => loadNotices(), 800)

// ⌘1, ⌘2…: cambiar de app (dentro de un iframe el atajo no llega acá; desde la barra, sí).
window.addEventListener('keydown', (e) => {
  if (!e.metaKey || e.altKey || e.ctrlKey) return
  const app = barApps()[Number(e.key) - 1]
  if (app) { e.preventDefault(); manualAt = Date.now(); select(app.id) }
})

invoke('apps').then((list) => {
  apps = list
  // Al abrir, la última que se miró si sigue visible; si no, la primera visible.
  const last = pick('cockpit.app', '')
  const visibleApps = apps.filter((a) => !hiddenApps.has(a.id))
  const first = visibleApps.some((a) => a.id === last) ? last : (visibleApps[0] || apps[0])?.id
  if (first) select(first)
  // El chat se carga siempre, aunque mires otra app: su numerito tiene que estar.
  if (apps.some((a) => a.id === 'chat')) load('chat')
})

/* LA SESIÓN DEL PLAYGROUND: casi todo lo de fondo la necesita (el modelo de segundo plano, Knowledge, canon, el chat).
   Vencida (o sin sesión): un modal en el centro con un botón que corre `playground login` (abre el navegador; Miguel
   toca «Continuar con Google»); la carcasa pregunta cada 3 s hasta que vuelve y avisa «listo». Por vencer: una franja
   arriba, que no bloquea. «Más tarde» lo deja una hora. El estado sale de `bin/cockpit session status --json`. */
const loginDialog = document.getElementById('loginDialog')
const soon = document.getElementById('sessionSoon')
let session = null
let loginWaiting = false
let loginSnoozeUntil = 0
let soonHiddenFor = ''
const hhmm = (iso) => new Date(iso).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', hour12: false })
const whenText = (iso) => {
  if (!iso) return ''
  const d = new Date(iso), today = new Date()
  const day = d.toDateString() === today.toDateString() ? 'hoy' : d.toDateString() === new Date(today.getTime() + 864e5).toDateString() ? 'mañana' : d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' })
  return `${day} a las ${hhmm(iso)}`
}
const NEEDS = ['El modelo de segundo plano: Knowledge, la daily, News y Sentinel', 'Canon y el chat del equipo', 'Las herramientas del playground compartido']
function renderLogin() {
  const icon = document.getElementById('loginIcon')
  const body = document.getElementById('loginBody')
  const ok = session?.state === 'ok' || session?.state === 'soon'
  icon.classList.toggle('ok', ok && !loginWaiting)
  icon.querySelector('.ui-icon').dataset.icon = ok ? 'check' : 'lock'
  if (ok) {
    document.getElementById('loginTitle').textContent = 'Listo, entraste al playground'
    document.getElementById('loginWhen').textContent = `la sesión vence ${whenText(session.expiresAt)}`
    body.innerHTML = ''
    return
  }
  document.getElementById('loginTitle').textContent = session?.state === 'none' ? 'No hay sesión del playground' : 'Tu sesión del playground venció'
  document.getElementById('loginWhen').textContent = session?.expiresAt ? `venció ${whenText(session.expiresAt)}` : (session?.detail || '')
  body.innerHTML = loginWaiting
    ? `<p class="login-wait"><span class="spinner" aria-hidden="true"></span>Esperando que termines en el navegador…</p>
       <p class="login-foot">Tocá «Continuar con Google» en la página que se abrió. Esto se cierra solo cuando entres.</p>
       <div class="login-actions" style="margin-top: 14px"><button type="button" class="btn btn-outline btn-sm" data-login="retry">Abrir de nuevo</button><button type="button" class="btn btn-outline btn-sm" data-login="later">Más tarde</button></div>`
    : `<p class="login-what">Sin ella se detiene esto:</p>
       <ul class="login-list">${NEEDS.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>
       <div class="login-actions"><button type="button" class="btn btn-outline btn-sm" data-login="later">Más tarde</button><button type="button" class="btn btn-sm" data-login="go">Iniciar sesión</button></div>
       <p class="login-foot">Abre el navegador: tocás «Continuar con Google» y vuelve solo.</p>`
}
function renderSoon() {
  const show = session?.state === 'soon' && soonHiddenFor !== session.expiresAt
  soon.hidden = !show
  if (show) document.getElementById('sessionSoonText').textContent = `La sesión del playground vence en ${Math.max(1, session.minutesLeft)} min (a las ${hhmm(session.expiresAt)})`
}
async function checkSession() {
  try { session = await invoke('session_state') } catch { return }
  renderSoon()
  const down = session.state === 'expired' || session.state === 'none'
  if (down && !loginDialog.open && Date.now() > loginSnoozeUntil) { loginWaiting = false; renderLogin(); loginDialog.showModal() }
  if (down && loginDialog.open) renderLogin()
  if (!down && loginDialog.open) {
    loginWaiting = false
    renderLogin()
    setTimeout(() => loginDialog.open && loginDialog.close(), 2500)
  }
}
function startLogin() {
  invoke('session_login').catch(() => {})
  loginWaiting = true
  if (!loginDialog.open) loginDialog.showModal()
  renderLogin()
}
loginDialog.addEventListener('click', (e) => {
  const act = e.target.closest('[data-login]')?.dataset.login
  if (act === 'go' || act === 'retry') startLogin()
  if (act === 'later') { loginSnoozeUntil = Date.now() + 60 * 60 * 1000; loginWaiting = false; loginDialog.close() }
})
// Escape es «más tarde», no un cierre que vuelve a abrirse en el siguiente chequeo.
loginDialog.addEventListener('cancel', () => { loginSnoozeUntil = Date.now() + 60 * 60 * 1000; loginWaiting = false })
document.getElementById('sessionSoonLogin').addEventListener('click', startLogin)
document.getElementById('sessionSoonClose').addEventListener('click', () => { soonHiddenFor = session?.expiresAt || ''; renderSoon() })
// Cada minuto, cada 3 s mientras espera el navegador, y al volver a la ventana.
setInterval(() => { if (!loginWaiting) checkSession() }, 60 * 1000)
setInterval(() => { if (loginWaiting) checkSession() }, 3000)
window.addEventListener('focus', checkSession)
setTimeout(checkSession, 1500)
</script>
</body>
