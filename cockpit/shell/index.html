<!doctype html>
<!--
  COCKPIT: la carcasa. Una barra de aplicaciones a la izquierda (como la de VS Code) y, a la derecha, cada herramienta
  del playground en su panel. Cada app es la interfaz de siempre (su propio servidor en localhost), abierta en un iframe
  que queda vivo al cambiar de app: lo que estabas haciendo sigue ahí.

  Qué apps hay y cómo se levantan lo dice la app de Rust (`apps`, src-tauri/src/main.rs); acá sólo el ícono de cada una.
  Se hablan por postMessage (chat/src/desktop.js y tools/ui/workbench.js): la app manda `badge` (su numerito); la
  carcasa manda `route` (al tocar un aviso) y `visible` (si la app está a la vista: un iframe escondido no se entera
  solo, y el chat marcaría leído). Y `theme` va en los dos sentidos: Cockpit tiene UN tema para todas (cada iframe
  tiene su origen y guardaría el suyo); cambiarlo en una app lo cambia en la barra y en las demás. Los enlaces que abren ventana nueva los atrapa Rust y los abre en tu navegador.
-->
<html lang="es" data-style="panels">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit</title>
<!-- EL TEMA ANTES DE PINTAR: el renglón es `THEME_BOOT` de tools/ui/workbench.js, y lo rellena `make estilo-sync`. -->
<script>/* <theme-boot> */try{var t=localStorage.getItem('ui.theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.classList.toggle('dark',t==='dark');document.documentElement.style.colorScheme=t}catch(e){}try{var p=localStorage.getItem('ui.palette');if(p&&p!=='default'&&/^(default|vintage|catppuccin|nord|monokaipro|ristretto)$/.test(p))document.documentElement.setAttribute('data-palette',p)}catch(e){}/* </theme-boot> */</script>
<!-- El mismo tema y taller que las apps (copias de tools/ui, `make estilo-sync`): la barra se apoya en el MISMO lienzo
     que los paneles de cada app, y cambia con ellas de claro a oscuro. -->
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="workbench.css">
<style>
  /* Los colores de estado son de Cockpit (el tema no los trae, y su «destructivo» en oscuro es un gris verdoso): «terminó
     bien» y «falló o frenado», en claro y en oscuro, los mismos del chat (presencia y mensaje que no salió). */
  :root {
    --cockpit-ok: #15803d;
    --cockpit-stop: #dc2626;
    --settings-backdrop: rgb(0 0 0 / .45);
    --settings-tint: color-mix(in oklab, var(--primary) 14%, transparent);
    --settings-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 12px 32px -12px rgb(0 0 0 / .3);
  }
  :root.dark {
    --cockpit-ok: #4ade80;
    --cockpit-stop: #f87171;
  }
  * { box-sizing: border-box }
  html, body { margin: 0; height: 100%; overflow: hidden }
  body { display: flex; background: var(--canvas); font-family: var(--font-sans, system-ui), -apple-system, sans-serif; font-size: 13px }
  /* La barra va sobre el lienzo, sin fondo propio: es el borde de la ventana, como el pie de cada app. */
  nav { flex: none; width: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px;
    -webkit-user-select: none; user-select: none }
  nav button { position: relative; width: 48px; height: 44px; border: 0; background: none; color: var(--fg-3); cursor: pointer;
    display: grid; place-items: center }
  nav button:hover, nav button.on { color: var(--foreground) }
  nav button.on::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 1px; background: var(--foreground) }
  nav button:focus-visible { outline: 1px solid var(--ring); outline-offset: -2px }
  nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }
  .badge { position: absolute; right: 6px; bottom: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
    background: var(--primary); color: var(--primary-foreground); font-size: 10px; font-weight: 600; line-height: 16px; text-align: center }
  .tip { position: fixed; left: 52px; padding: 4px 8px; border-radius: 4px; background: var(--popover); color: var(--popover-foreground);
    border: 1px solid var(--border); font-size: 12px; white-space: nowrap; pointer-events: none; z-index: 10 }
  main { flex: 1; min-width: 0; position: relative }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--canvas) }
  iframe[hidden] { display: none }
  .waiting { position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg-2) }
  /* Una app que se cayó: el aviso la TAPA (el iframe muestra un error del navegador) hasta que vuelve. */
  .waiting.over { z-index: 1; background: var(--canvas); text-align: center; padding: 0 var(--space-6) }
  /* Al pie de la barra, el engranaje: las preferencias de Cockpit. El panel «Claude» se abre desde el pie de cada app
     (el asterisco que agrega tools/ui/workbench.js). */
  nav .spacer { flex: 1 }
  nav .settings-toggle { margin-bottom: 8px }
  /* LA CONFIGURACIÓN: un modal como el de canon (tools/canon/src/components/Settings.vue del playground compartido).
     Un <dialog> nativo abierto con showModal(): Escape cierra, el foco queda adentro y lo de atrás no se toca, con el
     fondo desenfocado. A la izquierda el buscador y las secciones (la elegida, teñida); a la derecha la elegida, con su
     título, una línea de qué es y sus bloques: un rótulo chico y una caja. `margin: auto` + `inset: 0` lo centra. */
  .settings { position: fixed; inset: 0; margin: auto; width: min(880px, calc(100vw - 32px)); height: min(600px, calc(100dvh - 32px));
    max-width: none; max-height: none; padding: 0; border: 1px solid var(--panel-border, var(--border)); border-radius: calc(var(--radius) + 10px);
    background: var(--panel-surface, var(--background)); color: var(--foreground); box-shadow: var(--settings-shadow); overflow: hidden }
  .settings::backdrop { background: var(--settings-backdrop); backdrop-filter: blur(4px) }
  .settings-frame { display: grid; grid-template-columns: 220px minmax(0, 1fr); height: 100% }
  .settings-nav { display: flex; flex-direction: column; gap: 2px; padding: 16px 8px; background: var(--canvas);
    border-right: 1px solid var(--panel-border, var(--border)); overflow: auto }
  .settings-search { position: relative; display: block; margin: 0 4px 12px }
  .settings-search .ui-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--fg-3) }
  .settings-search .input { width: 100%; box-sizing: border-box; padding-left: 32px; background: var(--panel-surface, var(--background)) }
  .settings-group { margin: 0; padding: 8px 12px 4px; font-size: 12px; color: var(--fg-3) }
  .settings-none { margin: 0; padding: 8px 12px; font-size: 12px; color: var(--fg-3) }
  .settings-nav .section { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 0 12px; border: 0;
    border-radius: calc(var(--radius) - 2px); background: none; color: var(--fg-2); font: inherit; text-align: left; cursor: pointer }
  .settings-nav .section:hover { background: var(--hover); color: var(--foreground) }
  .settings-nav .section .ui-icon { color: var(--fg-3) }
  .settings-nav .section[aria-selected="true"] { background: var(--settings-tint); color: var(--foreground); font-weight: 600 }
  .settings-nav .section[aria-selected="true"] .ui-icon { color: var(--primary) }
  .settings-body { position: relative; padding: 32px 36px; overflow: auto }
  .settings .settings-close { position: absolute; top: 12px; right: 12px }
  .settings-head { margin-bottom: 24px }
  .settings-title { margin: 0 0 4px; font-size: 20px; font-weight: 600; letter-spacing: -.02em }
  .settings-what { margin: 0; color: var(--fg-2); font-size: 12px }
  .settings-blocks { display: flex; flex-direction: column; gap: 24px; max-width: 72ch }
  .settings-blocks > section { display: flex; flex-direction: column; gap: 8px }
  .settings-blocks h3 { margin: 0; font-size: 11px; font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: .04em }
  .settings-blocks p { margin: 0; line-height: 1.6; color: var(--fg-2) }
  .settings-blocks p b, .settings-blocks li b { color: var(--foreground) }
  .settings-blocks code { font-family: var(--font-mono); font-size: 12px }
  /* Una opción: nombre, qué hace, y el ✓ si está elegida (como `.opcion` de canon). */
  .options { display: flex; flex-direction: column; gap: 8px }
  .option { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; width: 100%; padding: 12px 16px;
    text-align: left; cursor: pointer; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--border);
    border-radius: calc(var(--radius) + 4px) }
  .option:hover { background: var(--hover) }
  .option:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px }
  .option[aria-checked="true"] { border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring) }
  .option-name { font-weight: 600 }
  .option-what { grid-column: 1; font-size: 12px; color: var(--fg-2) }
  .option .ui-icon { grid-row: 1 / 3; grid-column: 2; visibility: hidden; color: var(--ring) }
  .option[aria-checked="true"] .ui-icon { visibility: visible }
  /* Una caja con filas: cada app con su estado y lo que se hace con ella. */
  .settings-box { border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px); background: var(--card); overflow: hidden }
  .settings-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px }
  .settings-row + .settings-row { border-top: 1px solid var(--border) }
  .settings-row-text { flex: 1; min-width: 0 }
  .settings-row-name { display: block; font-weight: 600 }
  .settings-row-what { display: block; font-size: 12px; color: var(--fg-2) }
  .settings-row .state { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-2) }
  .settings-row .state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3) }
  .settings-row .state.up::before { background: var(--cockpit-ok) }
  .settings-box.padded { padding: 16px }
  /* LAS MUESTRAS de color (como `.paleta-muestra` de canon): cada círculo lleva dos colores FIJOS de su paleta —el
     acento y el lienzo, en claro o en oscuro según su fila—, no var(--primary): con una paleta puesta, un círculo que
     usara el token cambiaría con ella y dejaría de decir qué se elige. */
  .palette-rows { display: flex; flex-direction: column; gap: 12px }
  .palette-row { display: flex; align-items: center; gap: 12px }
  .palette-row-name { flex: none; width: 56px; font-size: 12px; color: var(--fg-2) }
  .palette-options { display: flex; flex-wrap: wrap; align-items: center; gap: 12px }
  .palette-swatch { width: 28px; height: 28px; padding: 0; flex: none; cursor: pointer; border-radius: 999px;
    border: 1px solid var(--border); background: var(--swatch, var(--muted)) }
  .palette-swatch[data-mode="dark"] { background: var(--swatch-dark, var(--muted)) }
  .palette-swatch:hover { border-color: var(--fg-3) }
  .palette-swatch[aria-checked="true"] { box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--foreground) }
  .palette-swatch:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px }
  .palette-swatch[data-palette-pick="default"] {
    --swatch: linear-gradient(135deg, oklch(0.6716 0.1368 48.5130) 50%, oklch(1 0 0) 50%);
    --swatch-dark: linear-gradient(135deg, oklch(0.7214 0.1337 49.9802) 50%, oklch(0.1797 0.0043 308.1928) 50%);
  }
  .palette-swatch[data-palette-pick="vintage"] {
    --swatch: linear-gradient(135deg, hsl(30 36% 38%) 50%, hsl(39 35% 92%) 50%);
    --swatch-dark: linear-gradient(135deg, hsl(30 33.7% 62.7%) 50%, hsl(25 15.4% 15.3%) 50%);
  }
  .palette-swatch[data-palette-pick="catppuccin"] {
    --swatch: linear-gradient(135deg, #8839ef 50%, #eff1f5 50%);
    --swatch-dark: linear-gradient(135deg, #cba6f7 50%, #1e1e2e 50%);
  }
  .palette-swatch[data-palette-pick="nord"] {
    --swatch: linear-gradient(135deg, #4a6a94 50%, #eceff4 50%);
    --swatch-dark: linear-gradient(135deg, #88c0d0 50%, #2e3440 50%);
  }
  .palette-swatch[data-palette-pick="monokaipro"] {
    --swatch: linear-gradient(135deg, #c6305f 50%, #faf4f2 50%);
    --swatch-dark: linear-gradient(135deg, #ff6188 50%, #2d2a2e 50%);
  }
  .palette-swatch[data-palette-pick="ristretto"] {
    --swatch: linear-gradient(135deg, #bd3a63 50%, #f8efe7 50%);
    --swatch-dark: linear-gradient(135deg, #fd6883 50%, #2c2525 50%);
  }
  .settings-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: var(--fg-2); line-height: 1.5 }
  /* EL PANEL «CLAUDE»: lo que hace Claude en vivo, como un panel más sobre el lienzo. */
  aside { flex: none; width: 340px; display: flex; flex-direction: column; min-height: 0; margin: calc(var(--panels-gap) / 2);
    margin-left: 0; border: 1px solid var(--panel-border); border-radius: var(--panels-radius); background: var(--panel-surface);
    color: var(--foreground); overflow: hidden }
  aside[hidden] { display: none }
  aside header { flex: none; display: flex; align-items: center; gap: var(--space-2); height: var(--region-head-h); padding: 0 var(--space-1) 0 var(--gutter);
    border-bottom: 1px solid var(--border); font-size: var(--text-sm); font-weight: 600; color: var(--fg-2) }
  aside header .grow { flex: 1 }
  aside header button { width: 24px; height: 24px; border: 0; border-radius: var(--radius-control); background: none; color: var(--fg-2); cursor: pointer; display: grid; place-items: center }
  aside header button:hover { background: var(--hover); color: var(--foreground) }
  aside header svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .feed { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-2) 0 }
  .feed .empty { padding: var(--space-3) var(--gutter); color: var(--fg-3); font-size: var(--text-sm); line-height: 1.5 }
  .act { display: flex; gap: var(--space-2); align-items: baseline; padding: 3px var(--gutter); font-size: var(--text-sm); line-height: 1.45 }
  .act time { flex: none; margin-left: auto; color: var(--fg-3); font-size: var(--text-xs); font-variant-numeric: tabular-nums }
  .act .sess { flex: none; color: var(--fg-3); font-size: var(--text-xs) }
  .act.say { padding-block: var(--space-2) }
  .act.say p { margin: 0; color: var(--foreground); white-space: pre-wrap; overflow-wrap: anywhere }
  .act.cmd code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono, ui-monospace, monospace); font-size: var(--text-xs); color: var(--fg-2) }
  .act.cmd .tool { flex: none; color: var(--fg-3); font-size: var(--text-xs) }
  .act .state { flex: none; width: 8px; height: 8px; border-radius: 50%; align-self: center; background: var(--fg-3) }
  .act .state.run { background: var(--primary); animation: blink 1s ease-in-out infinite }
  .act .state.ok { background: var(--cockpit-ok) }
  .act .state.fail { background: var(--cockpit-stop) }
  .act.open { color: var(--fg-2) }
  @keyframes blink { 50% { opacity: .35 } }
  /* Seguir a Claude: el punto naranja sigue, gris queda quieto (como en Jarvis). */
  aside header .follow { width: auto; gap: 6px; padding: 0 var(--space-2); font-size: var(--text-xs); font-weight: 400; display: inline-flex; align-items: center }
  aside header .follow i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3) }
  aside header .follow.on i { background: var(--primary) }
  /* Frenar: el botón se pinta en rojo mientras está frenado, y debajo de la cabecera queda el aviso (barra y tinte,
     como un callout de la guía) con «Reanudar». */
  aside header #stopToggle.on { background: var(--cockpit-stop); color: var(--background) }
  .stopbar { flex: none; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--gutter);
    border-left: 3px solid var(--cockpit-stop); background: color-mix(in oklab, var(--cockpit-stop) 14%, transparent);
    font-size: var(--text-sm); line-height: 1.4 }
  .stopbar[hidden] { display: none }
  .stopbar span { flex: 1 }
  .stopbar button { flex: none; height: 24px; padding: 0 var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-control);
    background: var(--panel-surface); color: var(--foreground); font: inherit; font-size: var(--text-xs); cursor: pointer }
  .stopbar button:hover { background: var(--hover) }
  .act.stop { color: var(--fg-2); font-weight: 600 }
</style>
</head>
<body>
<nav id="bar" aria-label="Aplicaciones"></nav>
<main id="panels"></main>
<dialog class="settings" id="settings" aria-label="Configuración de Cockpit">
  <div class="settings-frame">
    <!-- No es un <nav>: el estilo de la barra de Cockpit (nav, 48 px) lo aplastaba. -->
    <div class="settings-nav" role="navigation" aria-label="Secciones">
      <label class="settings-search">
        <span class="ui-icon" data-icon="search" aria-hidden="true"></span>
        <input id="settingsSearch" class="input" type="search" placeholder="Buscar" aria-label="Buscar en la configuración">
      </label>
      <p class="settings-group">Configuración</p>
      <div id="settingsSections" role="tablist" aria-orientation="vertical"></div>
    </div>
    <div class="settings-body" id="settingsBody">
      <button class="region-action settings-close" type="button" title="Cerrar" aria-label="Cerrar la configuración" id="settingsClose">
        <span class="ui-icon" data-icon="close" aria-hidden="true"></span>
      </button>
      <header class="settings-head"><h2 class="settings-title" id="settingsTitle"></h2><p class="settings-what" id="settingsWhat"></p></header>
      <div class="settings-blocks" id="settingsBlocks"></div>
    </div>
  </div>
</dialog>
<aside id="activity" aria-label="Lo que hace Claude" hidden>
  <header><span>Claude</span><span class="grow"></span>
    <button type="button" id="followToggle" class="follow"><i aria-hidden="true"></i><span></span></button>
    <button type="button" id="stopToggle" title="Frenar a Claude: no va a poder usar más herramientas" aria-label="Frenar a Claude"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    <button type="button" id="activityClear" title="Vaciar" aria-label="Vaciar el panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12.5a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5L18.5 7M9 7V4.5h6V7"/></svg></button>
    <button type="button" id="activityClose" title="Ocultar" aria-label="Ocultar el panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="stopbar" id="stopbar" role="status" hidden><span>Claude está frenado: no puede usar herramientas hasta que lo reanudes o le escribas.</span><button type="button" id="resume">Reanudar</button></div>
  <div class="feed" id="feed" aria-live="polite"><p class="empty">Cuando una sesión de Claude use herramientas o <code>bin/cockpit</code>, lo vas a ver acá, en vivo.</p></div>
</aside>
<script>
// Los íconos de cada app (trazos de 24×24, como los de la barra de VS Code).
const ICONS = {
  chat: '<path d="M4 5.5h16v10H9l-5 4v-14z"/><path d="M8 9.5h8M8 12.5h5"/>',
  tablero: '<rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M9.5 4.5v15M15 4.5v15"/><path d="M5.5 8h2M11.5 8h2M17 8h2M5.5 11h2M11.5 11h2"/>',
  harness: '<path d="M9.5 3.5h5M10.5 3.5v5.2L5.2 17.8A1.8 1.8 0 0 0 6.8 20.5h10.4a1.8 1.8 0 0 0 1.6-2.7L13.5 8.7V3.5"/><path d="M7.6 14h8.8"/>',
  jarvis: '<path d="M5 4.5l5.6 14.2 2-5.6 5.6-2z"/><path d="M12.6 13.1l5 5"/><path d="M18.5 3v3M17 4.5h3"/>',
  designer: '<path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.3 0 1.9-.8 1.9-1.7 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-.9.8-1.7 1.7-1.7h2a3.9 3.9 0 0 0 3.9-3.9C20.5 6.9 16.7 3.5 12 3.5z"/><circle cx="7.6" cy="11.2" r="1.1"/><circle cx="10.2" cy="7.4" r="1.1"/><circle cx="14.6" cy="7.6" r="1.1"/>',
  ecommerce: '<path d="M4 4.5h2l2.1 10.2a1.5 1.5 0 0 0 1.5 1.2h7.6a1.5 1.5 0 0 0 1.5-1.1L20 8.5H7"/><circle cx="10" cy="19.5" r="1.2"/><circle cx="17" cy="19.5" r="1.2"/>',
  sentinel: '<path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/>',
  goldfish: '<path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/><path d="M18 12v.5"/><path d="M16 17.93a9.77 9.77 0 0 1 0-11.86"/><path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33"/><path d="M10.46 7.26C10.2 5.88 9.17 4.24 8 3h5.8a2 2 0 0 1 1.98 1.67l.23 1.4"/><path d="m16.01 17.93-.23 1.4A2 2 0 0 1 13.8 21H9.5a5.96 5.96 0 0 0 1.49-3.98"/>',
  correo: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
}
const FALLBACK = '<rect x="4" y="4" width="16" height="16" rx="3"/>'

const tauri = window.__TAURI__
const invoke = tauri.core.invoke
const bar = document.getElementById('bar')
const panels = document.getElementById('panels')
const badges = {}       // id → número que mandó la app
const frames = {}       // id → su iframe, creado la primera vez que se abre
let apps = []
let current = ''
let pendingRoute = null // { id, hash }: un aviso que llegó antes de que la app cargara

const pick = (key, fallback) => { try { return localStorage.getItem(key) || fallback } catch { return fallback } }
const keep = (key, value) => { try { localStorage.setItem(key, value) } catch { /* no hace falta */ } }

function render() {
  bar.innerHTML = ''
  apps.forEach((app, i) => {
    const b = document.createElement('button')
    b.type = 'button'
    b.className = app.id === current ? 'on' : ''
    b.setAttribute('aria-label', app.name)
    b.setAttribute('aria-pressed', String(app.id === current))
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[app.id] || FALLBACK}</svg>`
    if (badges[app.id] > 0) b.insertAdjacentHTML('beforeend', `<span class="badge">${badges[app.id] > 99 ? '99+' : badges[app.id]}</span>`)
    b.addEventListener('click', () => { manualAt = Date.now(); select(app.id) })
    b.addEventListener('mouseenter', () => showTip(b, `${app.name}  ⌘${i + 1}`))
    b.addEventListener('mouseleave', hideTip)
    bar.append(b)
  })
  const spacer = document.createElement('div')
  spacer.className = 'spacer'
  const gear = document.createElement('button')
  gear.type = 'button'
  gear.className = 'settings-toggle' + (settingsOpen ? ' on' : '')
  gear.setAttribute('aria-label', 'Configuración')
  gear.setAttribute('aria-haspopup', 'dialog')
  gear.setAttribute('aria-expanded', String(settingsOpen))
  gear.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>'
  gear.addEventListener('click', () => { hideTip(); setSettingsOpen(!settingsOpen) })
  gear.addEventListener('mouseenter', () => { if (!settingsOpen) showTip(gear, 'Configuración') })
  gear.addEventListener('mouseleave', hideTip)
  bar.append(spacer, gear)
  tellClaude()
}

let tip = null
function showTip(el, text) {
  hideTip()
  tip = document.createElement('div')
  tip.className = 'tip'
  tip.textContent = text
  tip.style.top = `${el.getBoundingClientRect().top + 12}px`
  document.body.append(tip)
}
function hideTip() { tip?.remove(); tip = null }

// Mostrar una app; la primera vez, además, se carga (`load`).
function select(id) {
  if (!apps.some((a) => a.id === id)) return Promise.resolve()
  current = id
  keep('cockpit.app', id)
  invoke('set_current', { id }).catch(() => {})
  render()
  for (const [key, f] of Object.entries(frames)) f.hidden = key !== id
  for (const w of panels.querySelectorAll('.waiting')) w.hidden = w.dataset.app !== id
  if (frames[id]) frames[id].focus()
  tellVisibility()
  return load(id)
}

// EL TEMA ÚNICO: el de la carcasa (guardado, o el del sistema) manda; cada app lo recibe al cargar.
const THEME_KEY = 'ui.theme'
const shellTheme = () => (document.documentElement.classList.contains('dark') ? 'dark' : 'light')
function setShellTheme(theme) {
  document.documentElement.classList.toggle('dark', theme === 'dark')
  document.documentElement.style.colorScheme = theme
  keep(THEME_KEY, theme)
}
/* LA PALETA ÚNICA, como el tema: la de la carcasa manda y cada app la recibe al cargar (cada iframe tiene su origen y
   guardaría la suya). Sus colores están en theme.css (`data-palette`) y el renglón de arranque la aplica antes de pintar. */
const PALETTE_KEY = 'ui.palette'
const PALETTES = [
  { id: 'default', label: 'Por defecto' }, { id: 'vintage', label: 'Vintage Paper' }, { id: 'catppuccin', label: 'Catppuccin' },
  { id: 'nord', label: 'Nord' }, { id: 'monokaipro', label: 'Monokai Pro' }, { id: 'ristretto', label: 'Monokai Ristretto' },
]
const shellPalette = () => document.documentElement.getAttribute('data-palette') || 'default'
function setShellPalette(id) {
  if (!PALETTES.some((p) => p.id === id)) return
  if (id === 'default') document.documentElement.removeAttribute('data-palette')
  else document.documentElement.setAttribute('data-palette', id)
  keep(PALETTE_KEY, id)
}
function tellPalette(f) {
  f.contentWindow?.postMessage({ cockpit: true, type: 'palette', palette: shellPalette() }, new URL(f.src).origin)
}
function tellTheme(f) {
  f.contentWindow?.postMessage({ cockpit: true, type: 'theme', theme: shellTheme() }, new URL(f.src).origin)
}

// A cada app: si está a la vista (la elegida y con la ventana de Cockpit visible).
function tellVisibility() {
  for (const [key, f] of Object.entries(frames)) {
    const visible = key === current && document.visibilityState === 'visible'
    f.contentWindow?.postMessage({ cockpit: true, type: 'visible', visible }, new URL(f.src).origin)
  }
}
document.addEventListener('visibilitychange', tellVisibility)

// Cargar una app: se levanta su servidor (Rust, `ensure_app`), se espera a que conteste y se crea su iframe, visible
// sólo si es la que estás mirando. Una vez por app.
const loading = {}
function load(id) {
  if (!loading[id]) loading[id] = loadOnce(id)
  return loading[id]
}
async function loadOnce(id) {
  const app = apps.find((a) => a.id === id)
  // El aviso de un intento anterior que falló se REUSA: antes cada reintento apilaba otro encima (el viejo quedaba
  // debajo diciendo «no arrancó»). `:not(.over)`: el de «dejó de contestar» (el vigilante) es otro y no se toca.
  let wait = panels.querySelector(`.waiting:not(.over)[data-app="${id}"]`)
  if (!wait) {
    wait = document.createElement('div')
    wait.className = 'waiting'
    wait.dataset.app = id
    panels.append(wait)
  }
  wait.hidden = current !== id
  wait.textContent = `Arrancando ${app.name}…`
  const start = Date.now()
  while (!(await invoke('ensure_app', { id }).catch(() => false))) {
    if (Date.now() - start > 90_000) {
      delete loading[id]
      // Falló: el aviso queda, con un botón para volver a intentar sin tener que cambiar de app y volver.
      const retry = document.createElement('button')
      retry.type = 'button'
      retry.className = 'btn btn-outline btn-sm'
      retry.textContent = 'Reintentar'
      retry.addEventListener('click', () => load(id))
      const box = document.createElement('div')
      box.style.cssText = 'display: grid; gap: var(--space-3); justify-items: center; text-align: center'
      box.append(`${app.name} no arrancó: mirá ~/Library/Logs/cockpit-${id}.log`, retry)
      wait.replaceChildren(box)
      return
    }
    await new Promise((r) => setTimeout(r, 700))
  }
  wait.remove()
  const f = document.createElement('iframe')
  f.title = app.name
  // El micrófono, para dictar (el chat); sin esto un iframe de otro origen no puede pedirlo.
  f.allow = 'microphone'
  f.src = app.url
  f.hidden = current !== id
  f.addEventListener('load', () => { tellTheme(f); tellPalette(f); tellVisibility(); tellClaude(); deliverRoute(id) })
  frames[id] = f
  panels.append(f)
}

// Una ruta a una app ya cargada: `#…` cambia sólo el hash (no recarga: la app lo toma por hashchange/popstate) y
// `/…` es un camino de su mismo origen (el harness rutea por camino). Sirve para cualquier app, sin que la app sepa de
// Cockpit.
function deliverRoute(id) {
  if (!pendingRoute || pendingRoute.id !== id || !frames[id]) return
  const app = apps.find((a) => a.id === id)
  const route = pendingRoute.hash
  pendingRoute = null
  const target = new URL(app.url)
  if (route.startsWith('#')) target.hash = route
  else if (route.startsWith('/')) { const next = new URL(route, target.origin); target.pathname = next.pathname; target.hash = next.hash; for (const [k, v] of next.searchParams) target.searchParams.set(k, v) }
  else return
  frames[id].src = target.href
}

// Lo llama Rust con un enlace cockpit://<app>/#/… (tocar un aviso) o con `bin/cockpit open`: esa app al frente, en esa
// ruta.
window.cockpitOpen = async (id, hash) => {
  pendingRoute = hash ? { id, hash } : null
  await select(id)
  deliverRoute(id)
}

// Lo que cuentan las apps. Sólo se cree a la app de ese origen.
window.addEventListener('message', (e) => {
  const app = apps.find((a) => new URL(a.url).origin === e.origin)
  const d = e.data
  if (!app || !d || d.cockpit !== true) return
  if (d.type === 'palette' && PALETTES.some((p) => p.id === d.palette)) {
    setShellPalette(d.palette)
    for (const f of Object.values(frames)) if (f.contentWindow !== e.source) tellPalette(f)
    if (settingsOpen) paintSettings()
    return
  }
  if (d.type === 'theme' && (d.theme === 'light' || d.theme === 'dark')) {
    setShellTheme(d.theme)
    for (const f of Object.values(frames)) if (f.contentWindow !== e.source) tellTheme(f)
    return
  }
  // Una app pide abrir otra en una ruta. Sólo apps conocidas.
  if (d.type === 'open' && apps.some((x) => x.id === d.app)) {
    window.cockpitOpen(d.app, typeof d.route === 'string' ? d.route : '')
    return
  }
  // El asterisco del pie de una app: abre o cierra el panel «Claude» (workbench.js, `cockpitClaudeButton`).
  if (d.type === 'claude') {
    setActivityOpen(!activityOpen, true)
    return
  }
  if (d.type === 'badge') {
    badges[app.id] = Math.max(0, Number(d.count) || 0)
    render()
    const total = Object.values(badges).reduce((n, c) => n + c, 0)
    tauri.window.getCurrentWindow().setBadgeCount(total > 0 ? total : undefined).catch(() => {})
  }
})

/* EL PANEL «CLAUDE»: lo que manda el puerto de control de Cockpit (Rust, `cockpit-activity`): lo que Claude cuenta
   (`say`, con `bin/cockpit say`), cada herramienta que usa (`start`/`end`, del hook `cockpit` de Claude Code) y cada vez
   que lleva Cockpit a una app (`open`). Se abre solo con actividad, salvo que lo hayas cerrado vos. */
const ACTIVITY_KEY = 'cockpit.activity'
// A cada app, si el panel está abierto y si hubo actividad sin ver: lo pinta su asterisco del pie.
function tellClaude() {
  for (const f of Object.values(frames)) {
    try { f.contentWindow?.postMessage({ cockpit: true, type: 'claude', open: activityOpen, unseen }, new URL(f.src).origin) } catch { /* todavía cargando */ }
  }
}
const activity = document.getElementById('activity')
const feed = document.getElementById('feed')
let activityOpen = pick(ACTIVITY_KEY, 'auto') === 'open'
let unseen = false
const sessions = new Set()
const startedAt = {}
function setActivityOpen(open, byHand = false) {
  activityOpen = open
  activity.hidden = !open
  if (open) unseen = false
  if (byHand) keep(ACTIVITY_KEY, open ? 'open' : 'closed')
  render()
  if (settingsOpen) paintSettings()
}
document.getElementById('activityClose').addEventListener('click', () => setActivityOpen(false, true))
document.getElementById('activityClear').addEventListener('click', () => {
  feed.innerHTML = '<p class="empty">Vacío. Lo nuevo aparece acá.</p>'
})
const clock = () => new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false })
function line(className, html) {
  feed.querySelector('.empty')?.remove()
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40
  const el = document.createElement('div')
  el.className = `act ${className}`
  el.innerHTML = html
  feed.append(el)
  while (feed.children.length > 300) feed.firstElementChild.remove()
  if (atBottom) feed.scrollTop = feed.scrollHeight
  return el
}
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
// Con más de una sesión mandando, cada línea dice de cuál es (los primeros caracteres de su id).
const sess = (a) => (a.session ? sessions.add(a.session) : null, sessions.size > 1 && a.session ? `<span class="sess">${esc(a.session.slice(0, 4))}</span>` : '')
/* FRENAR (Rust `set_stopped`, el hook `cockpit` niega las herramientas): el botón de la cabecera frena y reanuda; el
   aviso de abajo dice que está frenado. Lo levanta también escribirle a Claude (el hook en UserPromptSubmit). */
let stopped = false
const stopToggle = document.getElementById('stopToggle')
const stopbar = document.getElementById('stopbar')
function paintStop() {
  stopToggle.classList.toggle('on', stopped)
  stopToggle.title = stopped ? 'Reanudar: Claude vuelve a poder usar herramientas' : 'Frenar a Claude: no va a poder usar más herramientas'
  stopToggle.setAttribute('aria-label', stopped ? 'Reanudar a Claude' : 'Frenar a Claude')
  stopToggle.setAttribute('aria-pressed', String(stopped))
  stopbar.hidden = !stopped
}
stopToggle.addEventListener('click', () => invoke('set_stopped', { stopped: !stopped }).catch(() => {}))
document.getElementById('resume').addEventListener('click', () => invoke('set_stopped', { stopped: false }).catch(() => {}))
paintStop()
function onActivity(a) {
  if (!a || !a.kind) return
  if (a.kind === 'stop') {
    stopped = !!a.stopped
    paintStop()
    line('stop', `<span>${stopped ? '■' : '▶'} ${esc(a.text)}</span><time>${clock()}</time>`)
    if (stopped && !activityOpen) setActivityOpen(true)
    return
  }
  if (a.kind === 'say') line('say', `${sess(a)}<p>${esc(a.text)}</p><time>${clock()}</time>`)
  else if (a.kind === 'open') line('open', `${sess(a)}<span>→ ${esc(apps.find((x) => x.id === a.app)?.name || a.app)} ${esc(a.text)}</span><time>${clock()}</time>`)
  else if (a.kind === 'start') {
    startedAt[a.id] = Date.now()
    const el = line('cmd', `${sess(a)}<span class="state run" aria-label="corriendo"></span><span class="tool">${esc(a.tool)}</span><code title="${esc(a.text)}">${esc(a.text)}</code><time>${clock()}</time>`)
    el.dataset.id = a.id || ''
  } else if (a.kind === 'end') {
    const el = a.id && [...feed.querySelectorAll('.act.cmd')].reverse().find((x) => x.dataset.id === a.id)
    if (!el) return
    const state = el.querySelector('.state')
    state.className = `state ${a.ok === false ? 'fail' : 'ok'}`
    state.setAttribute('aria-label', a.ok === false ? 'falló' : 'listo')
    if (startedAt[a.id]) {
      const ms = Date.now() - startedAt[a.id]
      el.querySelector('time').textContent = ms < 1000 ? `${ms} ms` : `${(ms / 1000).toFixed(1)} s`
      delete startedAt[a.id]
    }
    return
  }
  if (!activityOpen && pick(ACTIVITY_KEY, 'auto') !== 'closed') setActivityOpen(true)
  else if (!activityOpen) { unseen = true; render() }
}
activity.hidden = !activityOpen
/* SEGUIR A CLAUDE: cuando Claude usa una herramienta que es de una app (el hook dice cuál y en qué ruta: correr el
   harness, escribir en una tarea, manejar Jarvis), Cockpit salta ahí. Si elegiste una app a mano, se respeta 20 s. */
const FOLLOW_KEY = 'cockpit.follow'
let follow = pick(FOLLOW_KEY, 'on') !== 'off'
let manualAt = 0
let lastFollow = ''
const followToggle = document.getElementById('followToggle')
function paintFollow() {
  followToggle.classList.toggle('on', follow)
  followToggle.querySelector('span').textContent = follow ? 'siguiendo' : 'quieto'
  followToggle.title = follow
    ? 'Siguiendo a Claude: Cockpit salta a la app que está usando (si elegís una a mano, se respeta 20 s). Clic para quedarte quieto'
    : 'Quieto: Cockpit no cambia de app solo. Clic para seguir a Claude'
  followToggle.setAttribute('aria-pressed', String(follow))
}
followToggle.addEventListener('click', () => { follow = !follow; keep(FOLLOW_KEY, follow ? 'on' : 'off'); paintFollow() })
paintFollow()

/* LA CONFIGURACIÓN (el engranaje de la barra): un modal como el de canon, con secciones a la izquierda y la elegida a
   la derecha. No guarda nada nuevo: el tema es el de todas las apps, «seguir a Claude» es el mismo punto del panel, y
   «cuándo se abre» es lo que ya decide el panel cuando lo cerrás a mano (cockpit.activity: closed). Las apps se leen de
   Rust (`apps_state`) y se reinician con `restart_app`, lo mismo que `bin/cockpit restart`. */
const settings = document.getElementById('settings')
let settingsOpen = false
const SECTIONS = [
  { id: 'appearance', t: 'Apariencia', icon: 'theme', d: 'El color y el modo, claro u oscuro. Vale para todas las apps de Cockpit.', keys: 'tema claro oscuro color paleta nord catppuccin monokai vintage' },
  { id: 'claude', t: 'Claude', icon: 'claude', d: 'Lo que hace Claude, en vivo, en el panel que abre el asterisco del pie de cada app.', keys: 'seguir panel actividad frenar asterisco' },
  { id: 'apps', t: 'Apps', icon: 'apps', d: 'Las herramientas de la barra: si están arriba, y reiniciar una para que tome un cambio.', keys: 'servidor puerto reiniciar arriba apagada' },
  { id: 'help', t: 'Cómo se usa', icon: 'help', d: 'Lo que hay en cada lugar de Cockpit.', keys: 'ayuda guía atajos barra pie' },
]
let settingsSection = 'appearance'
let settingsFilter = ''
const option = (act, checked, name, what) => `<button type="button" class="option" role="radio" aria-checked="${checked}" data-act="${act}">
  <span class="option-name">${esc(name)}</span><span class="option-what">${esc(what)}</span><span class="ui-icon" data-icon="check" aria-hidden="true"></span></button>`
let appStates = []
async function loadAppStates() {
  appStates = await invoke('apps_state').catch(() => [])
  if (settingsOpen && settingsSection === 'apps') paintSettings()
}
function paintSections() {
  const q = settingsFilter.trim().toLowerCase()
  const visible = q ? SECTIONS.filter((x) => `${x.t} ${x.keys}`.toLowerCase().includes(q)) : SECTIONS
  if (visible.length && !visible.some((x) => x.id === settingsSection)) settingsSection = visible[0].id
  document.getElementById('settingsSections').innerHTML = visible.map((x) =>
    `<button type="button" class="section" role="tab" aria-selected="${x.id === settingsSection}" data-section="${x.id}"><span class="ui-icon" data-icon="${x.icon}" aria-hidden="true"></span><span>${esc(x.t)}</span></button>`).join('')
    || `<p class="settings-none">Nada coincide con «${esc(settingsFilter)}».</p>`
}
function paintSettings() {
  paintSections()
  const s = SECTIONS.find((x) => x.id === settingsSection)
  document.getElementById('settingsTitle').textContent = s.t
  document.getElementById('settingsWhat').textContent = s.d
  const blocks = document.getElementById('settingsBlocks')
  if (settingsSection === 'appearance') {
    const theme = shellTheme()
    const palette = shellPalette()
    // Dos filas, la misma paleta en claro y en oscuro: se ve cómo queda en cada modo antes de elegir (como en canon).
    const row = (mode, name) => `<div class="palette-row" data-mode="${mode}"><span class="palette-row-name">${name}</span>
      <div class="palette-options" role="radiogroup" aria-label="Paleta de color, ${name.toLowerCase()}">${PALETTES.map((p) =>
        `<button type="button" class="palette-swatch" role="radio" data-palette-pick="${p.id}" data-mode="${mode}"
          aria-checked="${palette === p.id && theme === mode}" title="${esc(p.label)}" aria-label="${esc(p.label)}"></button>`).join('')}</div></div>`
    const current = PALETTES.find((p) => p.id === palette)?.label || 'Por defecto'
    blocks.innerHTML = `<section><h3>Color</h3><div class="settings-box padded"><div class="palette-rows">
      ${row('light', 'Claro')}${row('dark', 'Oscuro')}</div></div>
      <p>${esc(current)}, en modo ${theme === 'dark' ? 'oscuro' : 'claro'}. Vale para todas las apps de Cockpit.</p></section>`
  } else if (settingsSection === 'claude') {
    const auto = pick(ACTIVITY_KEY, 'auto') !== 'closed'
    blocks.innerHTML = `<section><h3>Seguir a Claude</h3><div class="options" role="radiogroup" aria-label="Seguir a Claude">
      ${option('follow-on', follow, 'Siguiendo', 'Cockpit salta a la app que Claude está usando (si elegís una a mano, se respeta 20 s).')}
      ${option('follow-off', !follow, 'Quieto', 'Cockpit no cambia de app solo.')}</div></section>
      <section><h3>El panel de Claude</h3><div class="options" role="radiogroup" aria-label="Cuándo se abre el panel">
      ${option('auto-on', auto, 'Se abre solo con actividad', 'Cuando Claude usa una herramienta, el panel aparece.')}
      ${option('auto-off', !auto, 'Sólo cuando lo abro', 'Queda cerrado; el asterisco del pie marca con un punto lo que no viste.')}</div></section>`
  } else if (settingsSection === 'apps') {
    blocks.innerHTML = `<section><h3>Las apps de la barra</h3><div class="settings-box">${apps.map((a) => {
      const st = appStates.find((x) => x.id === a.id) || {}
      const what = `${(st.ports || []).map((p) => ':' + p.split(':').pop()).join(' · ')}${st.started ? ' · la levantó Cockpit' : st.ready ? ' · la levantó una terminal' : ''}`
      const canRestart = a.id !== 'chat' && st.ready
      return `<div class="settings-row"><span class="settings-row-text"><span class="settings-row-name">${esc(a.name)}</span><span class="settings-row-what">${esc(what)}</span></span>
        <span class="state ${st.ready ? 'up' : ''}">${st.ready ? 'arriba' : 'apagada'}</span>
        ${canRestart ? `<button type="button" class="btn btn-outline btn-sm" data-restart="${a.id}">Reiniciar</button>` : ''}</div>`
    }).join('')}</div><p>Reiniciar sirve para que una app tome un cambio en su servidor (Go no se recarga solo). El chat lo cuida Cockpit solo.</p></section>`
  } else {
    blocks.innerHTML = `<section><ol class="settings-steps">
      <li><b>La barra</b>: cada herramienta en su panel; ⌘1, ⌘2… cambian de app. Lo que estabas haciendo sigue ahí.</li>
      <li><b>El asterisco del pie</b>: abre o cierra el panel de Claude, con lo que hace en vivo. Ahí está «Frenar».</li>
      <li><b>Una app que se cae</b> vuelve sola: Cockpit la levanta de nuevo en unos segundos.</li>
      <li><b>Desde una sesión</b>: <code>bin/cockpit open &lt;app&gt; [ruta]</code>, <code>say</code>, <code>status</code> y <code>restart</code>.</li>
    </ol><p>Cerrar la ventana la esconde: Cockpit sigue juntando el chat y avisando.</p></section>`
  }
}
function setSettingsOpen(open) {
  settingsOpen = open
  render()
  if (open && !settings.open) {
    settingsFilter = ''
    document.getElementById('settingsSearch').value = ''
    paintSettings()
    settings.showModal()
    loadAppStates()
  } else if (!open && settings.open) settings.close()
}
settings.addEventListener('close', () => { if (settingsOpen) { settingsOpen = false; render() } })
// Un clic en el fondo (fuera del marco) cierra, como en canon.
settings.addEventListener('click', (e) => { if (e.target === settings) setSettingsOpen(false) })
document.getElementById('settingsClose').addEventListener('click', () => setSettingsOpen(false))
document.getElementById('settingsSearch').addEventListener('input', (e) => { settingsFilter = e.target.value; paintSettings() })
document.getElementById('settingsSections').addEventListener('click', (e) => {
  const id = e.target.closest('[data-section]')?.dataset.section
  if (id) { settingsSection = id; paintSettings() }
})
document.getElementById('settingsBlocks').addEventListener('click', async (e) => {
  const restartId = e.target.closest('[data-restart]')?.dataset.restart
  if (restartId) {
    const b = e.target.closest('button')
    b.disabled = true
    b.textContent = 'Reiniciando…'
    try { await invoke('restart_app', { id: restartId }) } catch (err) { b.textContent = String(err).slice(0, 60); return }
    setTimeout(loadAppStates, 1500)
    return
  }
  const pick = e.target.closest('[data-palette-pick]')
  if (pick) {
    setShellPalette(pick.dataset.palettePick)
    setShellTheme(pick.dataset.mode)
    for (const f of Object.values(frames)) { tellPalette(f); tellTheme(f) }
    paintSettings()
    document.querySelector(`#settingsBlocks [data-palette-pick="${pick.dataset.palettePick}"][data-mode="${pick.dataset.mode}"]`)?.focus()
    return
  }
  const act = e.target.closest('[data-act]')?.dataset.act
  if (!act) return
  if (act === 'light' || act === 'dark') {
    setShellTheme(act)
    for (const f of Object.values(frames)) tellTheme(f)
  } else if (act === 'follow-on' || act === 'follow-off') {
    follow = act === 'follow-on'
    keep(FOLLOW_KEY, follow ? 'on' : 'off')
    paintFollow()
  } else if (act === 'auto-on' || act === 'auto-off') {
    keep(ACTIVITY_KEY, act === 'auto-on' ? 'auto' : 'closed')
  }
  paintSettings()
  document.querySelector(`#settingsBlocks [data-act="${act}"]`)?.focus()
})

function followTo(app, route) {
  if (!follow || !apps.some((a) => a.id === app) || Date.now() - manualAt < 20_000) return
  const key = `${app}|${route || ''}`
  if (app === current && (!route || key === lastFollow)) return
  lastFollow = key
  pendingRoute = route ? { id: app, hash: route } : null
  select(app).then(() => deliverRoute(app))
}
// UNA APP SE CAYÓ (el vigilante de Rust, `cockpit-app`): un aviso la tapa mientras Cockpit la vuelve a levantar, y
// cuando contesta de nuevo se recarga (el iframe se había quedado con la página de error).
const DOWN_TEXT = {
  down: (name) => `${name} dejó de contestar. Si no vuelve sola en unos segundos, Cockpit la levanta de nuevo.`,
  restarting: (name) => `Levantando ${name} de nuevo…`,
}
tauri.event.listen('cockpit-app', (e) => {
  const { id, state } = e.payload || {}
  const app = apps.find((a) => a.id === id)
  if (!app || !frames[id]) return
  let cover = panels.querySelector(`.waiting.over[data-app="${id}"]`)
  if (state === 'up') {
    if (!cover) return
    cover.remove()
    frames[id].src = frames[id].src
    return
  }
  if (!DOWN_TEXT[state]) return
  if (!cover) {
    cover = document.createElement('div')
    cover.className = 'waiting over'
    cover.dataset.app = id
    cover.hidden = current !== id
    panels.append(cover)
  }
  cover.textContent = DOWN_TEXT[state](app.name)
})

tauri.event.listen('cockpit-activity', (e) => {
  onActivity(e.payload)
  if (e.payload?.kind === 'start' && e.payload.app) followTo(e.payload.app, e.payload.route)
})

// ⌘1, ⌘2…: cambiar de app (dentro de un iframe el atajo no llega acá; desde la barra, sí).
window.addEventListener('keydown', (e) => {
  if (!e.metaKey || e.altKey || e.ctrlKey) return
  const app = apps[Number(e.key) - 1]
  if (app) { e.preventDefault(); manualAt = Date.now(); select(app.id) }
})

invoke('apps').then((list) => {
  apps = list
  const first = apps.some((a) => a.id === pick('cockpit.app', '')) ? pick('cockpit.app', '') : apps[0]?.id
  if (first) select(first)
  // El chat se carga siempre, aunque mires otra app: su numerito tiene que estar.
  if (apps.some((a) => a.id === 'chat')) load('chat')
})
</script>
