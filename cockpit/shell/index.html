<!doctype html>
<!--
  COCKPIT: la carcasa. Una barra de aplicaciones a la izquierda (como la de VS Code) y, a la derecha, cada herramienta
  del playground en su panel. Cada app es la interfaz de siempre (su propio servidor en localhost), abierta en un iframe
  que queda vivo al cambiar de app: lo que estabas haciendo sigue ahí.

  Qué apps hay y cómo se levantan lo dice la app de Rust (`apps`, src-tauri/src/main.rs); acá sólo el ícono de cada una.
  Se hablan por postMessage (chat/src/desktop.js y tools/ui/workbench.js): la app manda `badge` (su numerito); la
  carcasa manda `route` (al tocar un aviso) y `visible` (si la app está a la vista: un iframe escondido no se entera
  solo, y el chat marcaría leído). Y `theme` va en los dos sentidos: Cockpit tiene UN tema para todas (cada iframe
  tiene su origen y guardaría el suyo); cambiarlo en una app lo cambia en la barra y en las demás. Los enlaces que abren ventana nueva los atrapa Rust y los abre en tu navegador.
-->
<html lang="es" data-style="panels">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit</title>
<!-- EL TEMA ANTES DE PINTAR: el renglón es `THEME_BOOT` de tools/ui/workbench.js, y lo rellena `make estilo-sync`. -->
<script>/* <theme-boot> */try{var t=localStorage.getItem('ui.theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.classList.toggle('dark',t==='dark');document.documentElement.style.colorScheme=t}catch(e){}/* </theme-boot> */</script>
<!-- El mismo tema y taller que las apps (copias de tools/ui, `make estilo-sync`): la barra se apoya en el MISMO lienzo
     que los paneles de cada app, y cambia con ellas de claro a oscuro. -->
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="workbench.css">
<style>
  /* Los colores de estado son de Cockpit (el tema no los trae, y su «destructivo» en oscuro es un gris verdoso): «terminó
     bien» y «falló o frenado», en claro y en oscuro, los mismos del chat (presencia y mensaje que no salió). */
  :root {
    --cockpit-ok: #15803d;
    --cockpit-stop: #dc2626;
  }
  :root.dark {
    --cockpit-ok: #4ade80;
    --cockpit-stop: #f87171;
  }
  * { box-sizing: border-box }
  html, body { margin: 0; height: 100%; overflow: hidden }
  body { display: flex; background: var(--canvas); font-family: var(--font-sans, system-ui), -apple-system, sans-serif; font-size: 13px }
  /* La barra va sobre el lienzo, sin fondo propio: es el borde de la ventana, como el pie de cada app. */
  nav { flex: none; width: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px;
    -webkit-user-select: none; user-select: none }
  nav button { position: relative; width: 48px; height: 44px; border: 0; background: none; color: var(--fg-3); cursor: pointer;
    display: grid; place-items: center }
  nav button:hover, nav button.on { color: var(--foreground) }
  nav button.on::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 1px; background: var(--foreground) }
  nav button:focus-visible { outline: 1px solid var(--ring); outline-offset: -2px }
  nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }
  .badge { position: absolute; right: 6px; bottom: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
    background: var(--primary); color: var(--primary-foreground); font-size: 10px; font-weight: 600; line-height: 16px; text-align: center }
  .tip { position: fixed; left: 52px; padding: 4px 8px; border-radius: 4px; background: var(--popover); color: var(--popover-foreground);
    border: 1px solid var(--border); font-size: 12px; white-space: nowrap; pointer-events: none; z-index: 10 }
  main { flex: 1; min-width: 0; position: relative }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--canvas) }
  iframe[hidden] { display: none }
  .waiting { position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg-2) }
  /* El botón del panel «Claude», al pie de la barra, con un punto cuando hubo actividad que no viste. */
  nav .spacer { flex: 1 }
  nav .activity-toggle { margin-bottom: 8px }
  nav .activity-toggle .dot { position: absolute; right: 10px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary) }
  /* EL PANEL «CLAUDE»: lo que hace Claude en vivo, como un panel más sobre el lienzo. */
  aside { flex: none; width: 340px; display: flex; flex-direction: column; min-height: 0; margin: calc(var(--panels-gap) / 2);
    margin-left: 0; border: 1px solid var(--panel-border); border-radius: var(--panels-radius); background: var(--panel-surface);
    color: var(--foreground); overflow: hidden }
  aside[hidden] { display: none }
  aside header { flex: none; display: flex; align-items: center; gap: var(--space-2); height: var(--region-head-h); padding: 0 var(--space-1) 0 var(--gutter);
    border-bottom: 1px solid var(--border); font-size: var(--text-sm); font-weight: 600; color: var(--fg-2) }
  aside header .grow { flex: 1 }
  aside header button { width: 24px; height: 24px; border: 0; border-radius: var(--radius-control); background: none; color: var(--fg-2); cursor: pointer; display: grid; place-items: center }
  aside header button:hover { background: var(--hover); color: var(--foreground) }
  aside header svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .feed { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-2) 0 }
  .feed .empty { padding: var(--space-3) var(--gutter); color: var(--fg-3); font-size: var(--text-sm); line-height: 1.5 }
  .act { display: flex; gap: var(--space-2); align-items: baseline; padding: 3px var(--gutter); font-size: var(--text-sm); line-height: 1.45 }
  .act time { flex: none; margin-left: auto; color: var(--fg-3); font-size: var(--text-xs); font-variant-numeric: tabular-nums }
  .act .sess { flex: none; color: var(--fg-3); font-size: var(--text-xs) }
  .act.say { padding-block: var(--space-2) }
  .act.say p { margin: 0; color: var(--foreground); white-space: pre-wrap; overflow-wrap: anywhere }
  .act.cmd code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono, ui-monospace, monospace); font-size: var(--text-xs); color: var(--fg-2) }
  .act.cmd .tool { flex: none; color: var(--fg-3); font-size: var(--text-xs) }
  .act .state { flex: none; width: 8px; height: 8px; border-radius: 50%; align-self: center; background: var(--fg-3) }
  .act .state.run { background: var(--primary); animation: blink 1s ease-in-out infinite }
  .act .state.ok { background: var(--cockpit-ok) }
  .act .state.fail { background: var(--cockpit-stop) }
  .act.open { color: var(--fg-2) }
  @keyframes blink { 50% { opacity: .35 } }
  /* Seguir a Claude: el punto naranja sigue, gris queda quieto (como en Jarvis). */
  aside header .follow { width: auto; gap: 6px; padding: 0 var(--space-2); font-size: var(--text-xs); font-weight: 400; display: inline-flex; align-items: center }
  aside header .follow i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3) }
  aside header .follow.on i { background: var(--primary) }
  /* Frenar: el botón se pinta en rojo mientras está frenado, y debajo de la cabecera queda el aviso (barra y tinte,
     como un callout de la guía) con «Reanudar». */
  aside header #stopToggle.on { background: var(--cockpit-stop); color: var(--background) }
  .stopbar { flex: none; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--gutter);
    border-left: 3px solid var(--cockpit-stop); background: color-mix(in oklab, var(--cockpit-stop) 14%, transparent);
    font-size: var(--text-sm); line-height: 1.4 }
  .stopbar[hidden] { display: none }
  .stopbar span { flex: 1 }
  .stopbar button { flex: none; height: 24px; padding: 0 var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-control);
    background: var(--panel-surface); color: var(--foreground); font: inherit; font-size: var(--text-xs); cursor: pointer }
  .stopbar button:hover { background: var(--hover) }
  .act.stop { color: var(--fg-2); font-weight: 600 }
</style>
</head>
<body>
<nav id="bar" aria-label="Aplicaciones"></nav>
<main id="panels"></main>
<aside id="activity" aria-label="Lo que hace Claude" hidden>
  <header><span>Claude</span><span class="grow"></span>
    <button type="button" id="followToggle" class="follow"><i aria-hidden="true"></i><span></span></button>
    <button type="button" id="stopToggle" title="Frenar a Claude: no va a poder usar más herramientas" aria-label="Frenar a Claude"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    <button type="button" id="activityClear" title="Vaciar" aria-label="Vaciar el panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12.5a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5L18.5 7M9 7V4.5h6V7"/></svg></button>
    <button type="button" id="activityClose" title="Ocultar" aria-label="Ocultar el panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="stopbar" id="stopbar" role="status" hidden><span>Claude está frenado: no puede usar herramientas hasta que lo reanudes o le escribas.</span><button type="button" id="resume">Reanudar</button></div>
  <div class="feed" id="feed" aria-live="polite"><p class="empty">Cuando una sesión de Claude use herramientas o <code>bin/cockpit</code>, lo vas a ver acá, en vivo.</p></div>
</aside>
<script>
// Los íconos de cada app (trazos de 24×24, como los de la barra de VS Code).
const ICONS = {
  chat: '<path d="M4 5.5h16v10H9l-5 4v-14z"/><path d="M8 9.5h8M8 12.5h5"/>',
  tablero: '<rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M9.5 4.5v15M15 4.5v15"/><path d="M5.5 8h2M11.5 8h2M17 8h2M5.5 11h2M11.5 11h2"/>',
  harness: '<path d="M9.5 3.5h5M10.5 3.5v5.2L5.2 17.8A1.8 1.8 0 0 0 6.8 20.5h10.4a1.8 1.8 0 0 0 1.6-2.7L13.5 8.7V3.5"/><path d="M7.6 14h8.8"/>',
  jarvis: '<path d="M5 4.5l5.6 14.2 2-5.6 5.6-2z"/><path d="M12.6 13.1l5 5"/><path d="M18.5 3v3M17 4.5h3"/>',
  designer: '<path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.3 0 1.9-.8 1.9-1.7 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-.9.8-1.7 1.7-1.7h2a3.9 3.9 0 0 0 3.9-3.9C20.5 6.9 16.7 3.5 12 3.5z"/><circle cx="7.6" cy="11.2" r="1.1"/><circle cx="10.2" cy="7.4" r="1.1"/><circle cx="14.6" cy="7.6" r="1.1"/>',
  ecommerce: '<path d="M4 4.5h2l2.1 10.2a1.5 1.5 0 0 0 1.5 1.2h7.6a1.5 1.5 0 0 0 1.5-1.1L20 8.5H7"/><circle cx="10" cy="19.5" r="1.2"/><circle cx="17" cy="19.5" r="1.2"/>',
  knowledge: '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15.5H5.5A1.5 1.5 0 0 0 4 21z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v15.5h5.5A1.5 1.5 0 0 1 20 21z"/><path d="M6.5 8h2.5M6.5 11h2.5M15 8h2.5M15 11h2.5"/>',
}
const FALLBACK = '<rect x="4" y="4" width="16" height="16" rx="3"/>'

const tauri = window.__TAURI__
const invoke = tauri.core.invoke
const bar = document.getElementById('bar')
const panels = document.getElementById('panels')
const badges = {}       // id → número que mandó la app
const frames = {}       // id → su iframe, creado la primera vez que se abre
let apps = []
let current = ''
let pendingRoute = null // { id, hash }: un aviso que llegó antes de que la app cargara

const pick = (key, fallback) => { try { return localStorage.getItem(key) || fallback } catch { return fallback } }
const keep = (key, value) => { try { localStorage.setItem(key, value) } catch { /* no hace falta */ } }

function render() {
  bar.innerHTML = ''
  apps.forEach((app, i) => {
    const b = document.createElement('button')
    b.type = 'button'
    b.className = app.id === current ? 'on' : ''
    b.setAttribute('aria-label', app.name)
    b.setAttribute('aria-pressed', String(app.id === current))
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[app.id] || FALLBACK}</svg>`
    if (badges[app.id] > 0) b.insertAdjacentHTML('beforeend', `<span class="badge">${badges[app.id] > 99 ? '99+' : badges[app.id]}</span>`)
    b.addEventListener('click', () => { manualAt = Date.now(); select(app.id) })
    b.addEventListener('mouseenter', () => showTip(b, `${app.name}  ⌘${i + 1}`))
    b.addEventListener('mouseleave', hideTip)
    bar.append(b)
  })
  const spacer = document.createElement('div')
  spacer.className = 'spacer'
  const toggle = document.createElement('button')
  toggle.type = 'button'
  toggle.className = 'activity-toggle' + (activityOpen ? ' on' : '')
  toggle.setAttribute('aria-label', 'Lo que hace Claude')
  toggle.setAttribute('aria-pressed', String(activityOpen))
  toggle.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>'
    + (unseen && !activityOpen ? '<span class="dot" aria-hidden="true"></span>' : '')
  toggle.addEventListener('click', () => setActivityOpen(!activityOpen, true))
  toggle.addEventListener('mouseenter', () => showTip(toggle, 'Lo que hace Claude'))
  toggle.addEventListener('mouseleave', hideTip)
  bar.append(spacer, toggle)
}

let tip = null
function showTip(el, text) {
  hideTip()
  tip = document.createElement('div')
  tip.className = 'tip'
  tip.textContent = text
  tip.style.top = `${el.getBoundingClientRect().top + 12}px`
  document.body.append(tip)
}
function hideTip() { tip?.remove(); tip = null }

// Mostrar una app; la primera vez, además, se carga (`load`).
function select(id) {
  if (!apps.some((a) => a.id === id)) return Promise.resolve()
  current = id
  keep('cockpit.app', id)
  invoke('set_current', { id }).catch(() => {})
  render()
  for (const [key, f] of Object.entries(frames)) f.hidden = key !== id
  for (const w of panels.querySelectorAll('.waiting')) w.hidden = w.dataset.app !== id
  if (frames[id]) frames[id].focus()
  tellVisibility()
  return load(id)
}

// EL TEMA ÚNICO: el de la carcasa (guardado, o el del sistema) manda; cada app lo recibe al cargar.
const THEME_KEY = 'ui.theme'
const shellTheme = () => (document.documentElement.classList.contains('dark') ? 'dark' : 'light')
function setShellTheme(theme) {
  document.documentElement.classList.toggle('dark', theme === 'dark')
  document.documentElement.style.colorScheme = theme
  keep(THEME_KEY, theme)
}
function tellTheme(f) {
  f.contentWindow?.postMessage({ cockpit: true, type: 'theme', theme: shellTheme() }, new URL(f.src).origin)
}

// A cada app: si está a la vista (la elegida y con la ventana de Cockpit visible).
function tellVisibility() {
  for (const [key, f] of Object.entries(frames)) {
    const visible = key === current && document.visibilityState === 'visible'
    f.contentWindow?.postMessage({ cockpit: true, type: 'visible', visible }, new URL(f.src).origin)
  }
}
document.addEventListener('visibilitychange', tellVisibility)

// Cargar una app: se levanta su servidor (Rust, `ensure_app`), se espera a que conteste y se crea su iframe, visible
// sólo si es la que estás mirando. Una vez por app.
const loading = {}
function load(id) {
  if (!loading[id]) loading[id] = loadOnce(id)
  return loading[id]
}
async function loadOnce(id) {
  const app = apps.find((a) => a.id === id)
  const wait = document.createElement('div')
  wait.className = 'waiting'
  wait.dataset.app = id
  wait.hidden = current !== id
  wait.textContent = `Arrancando ${app.name}…`
  panels.append(wait)
  const start = Date.now()
  while (!(await invoke('ensure_app', { id }).catch(() => false))) {
    if (Date.now() - start > 90_000) {
      wait.textContent = `${app.name} no arrancó: mirá ~/Library/Logs/cockpit-${id}.log`
      delete loading[id]
      return
    }
    await new Promise((r) => setTimeout(r, 700))
  }
  wait.remove()
  const f = document.createElement('iframe')
  f.title = app.name
  f.src = app.url
  f.hidden = current !== id
  f.addEventListener('load', () => { tellTheme(f); tellVisibility(); deliverRoute(id) })
  frames[id] = f
  panels.append(f)
}

// Una ruta a una app ya cargada: `#…` cambia sólo el hash (no recarga: la app lo toma por hashchange/popstate) y
// `/…` es un camino de su mismo origen (el harness rutea por camino). Sirve para cualquier app, sin que la app sepa de
// Cockpit.
function deliverRoute(id) {
  if (!pendingRoute || pendingRoute.id !== id || !frames[id]) return
  const app = apps.find((a) => a.id === id)
  const route = pendingRoute.hash
  pendingRoute = null
  const target = new URL(app.url)
  if (route.startsWith('#')) target.hash = route
  else if (route.startsWith('/')) { const next = new URL(route, target.origin); target.pathname = next.pathname; target.hash = next.hash; for (const [k, v] of next.searchParams) target.searchParams.set(k, v) }
  else return
  frames[id].src = target.href
}

// Lo llama Rust con un enlace cockpit://<app>/#/… (tocar un aviso) o con `bin/cockpit open`: esa app al frente, en esa
// ruta.
window.cockpitOpen = async (id, hash) => {
  pendingRoute = hash ? { id, hash } : null
  await select(id)
  deliverRoute(id)
}

// Lo que cuentan las apps. Sólo se cree a la app de ese origen.
window.addEventListener('message', (e) => {
  const app = apps.find((a) => new URL(a.url).origin === e.origin)
  const d = e.data
  if (!app || !d || d.cockpit !== true) return
  if (d.type === 'theme' && (d.theme === 'light' || d.theme === 'dark')) {
    setShellTheme(d.theme)
    for (const f of Object.values(frames)) if (f.contentWindow !== e.source) tellTheme(f)
    return
  }
  // Una app pide abrir otra (el «Citado en» de knowledge abre la tarea en el tablero). Sólo apps conocidas.
  if (d.type === 'open' && apps.some((x) => x.id === d.app)) {
    window.cockpitOpen(d.app, typeof d.route === 'string' ? d.route : '')
    return
  }
  if (d.type === 'badge') {
    badges[app.id] = Math.max(0, Number(d.count) || 0)
    render()
    const total = Object.values(badges).reduce((n, c) => n + c, 0)
    tauri.window.getCurrentWindow().setBadgeCount(total > 0 ? total : undefined).catch(() => {})
  }
})

/* EL PANEL «CLAUDE»: lo que manda el puerto de control de Cockpit (Rust, `cockpit-activity`): lo que Claude cuenta
   (`say`, con `bin/cockpit say`), cada herramienta que usa (`start`/`end`, del hook `cockpit` de Claude Code) y cada vez
   que lleva Cockpit a una app (`open`). Se abre solo con actividad, salvo que lo hayas cerrado vos. */
const ACTIVITY_KEY = 'cockpit.activity'
const activity = document.getElementById('activity')
const feed = document.getElementById('feed')
let activityOpen = pick(ACTIVITY_KEY, 'auto') === 'open'
let unseen = false
const sessions = new Set()
const startedAt = {}
function setActivityOpen(open, byHand = false) {
  activityOpen = open
  activity.hidden = !open
  if (open) unseen = false
  if (byHand) keep(ACTIVITY_KEY, open ? 'open' : 'closed')
  render()
}
document.getElementById('activityClose').addEventListener('click', () => setActivityOpen(false, true))
document.getElementById('activityClear').addEventListener('click', () => {
  feed.innerHTML = '<p class="empty">Vacío. Lo nuevo aparece acá.</p>'
})
const clock = () => new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false })
function line(className, html) {
  feed.querySelector('.empty')?.remove()
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40
  const el = document.createElement('div')
  el.className = `act ${className}`
  el.innerHTML = html
  feed.append(el)
  while (feed.children.length > 300) feed.firstElementChild.remove()
  if (atBottom) feed.scrollTop = feed.scrollHeight
  return el
}
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
// Con más de una sesión mandando, cada línea dice de cuál es (los primeros caracteres de su id).
const sess = (a) => (a.session ? sessions.add(a.session) : null, sessions.size > 1 && a.session ? `<span class="sess">${esc(a.session.slice(0, 4))}</span>` : '')
/* FRENAR (Rust `set_stopped`, el hook `cockpit` niega las herramientas): el botón de la cabecera frena y reanuda; el
   aviso de abajo dice que está frenado. Lo levanta también escribirle a Claude (el hook en UserPromptSubmit). */
let stopped = false
const stopToggle = document.getElementById('stopToggle')
const stopbar = document.getElementById('stopbar')
function paintStop() {
  stopToggle.classList.toggle('on', stopped)
  stopToggle.title = stopped ? 'Reanudar: Claude vuelve a poder usar herramientas' : 'Frenar a Claude: no va a poder usar más herramientas'
  stopToggle.setAttribute('aria-label', stopped ? 'Reanudar a Claude' : 'Frenar a Claude')
  stopToggle.setAttribute('aria-pressed', String(stopped))
  stopbar.hidden = !stopped
}
stopToggle.addEventListener('click', () => invoke('set_stopped', { stopped: !stopped }).catch(() => {}))
document.getElementById('resume').addEventListener('click', () => invoke('set_stopped', { stopped: false }).catch(() => {}))
paintStop()
function onActivity(a) {
  if (!a || !a.kind) return
  if (a.kind === 'stop') {
    stopped = !!a.stopped
    paintStop()
    line('stop', `<span>${stopped ? '■' : '▶'} ${esc(a.text)}</span><time>${clock()}</time>`)
    if (stopped && !activityOpen) setActivityOpen(true)
    return
  }
  if (a.kind === 'say') line('say', `${sess(a)}<p>${esc(a.text)}</p><time>${clock()}</time>`)
  else if (a.kind === 'open') line('open', `${sess(a)}<span>→ ${esc(apps.find((x) => x.id === a.app)?.name || a.app)} ${esc(a.text)}</span><time>${clock()}</time>`)
  else if (a.kind === 'start') {
    startedAt[a.id] = Date.now()
    const el = line('cmd', `${sess(a)}<span class="state run" aria-label="corriendo"></span><span class="tool">${esc(a.tool)}</span><code title="${esc(a.text)}">${esc(a.text)}</code><time>${clock()}</time>`)
    el.dataset.id = a.id || ''
  } else if (a.kind === 'end') {
    const el = a.id && [...feed.querySelectorAll('.act.cmd')].reverse().find((x) => x.dataset.id === a.id)
    if (!el) return
    const state = el.querySelector('.state')
    state.className = `state ${a.ok === false ? 'fail' : 'ok'}`
    state.setAttribute('aria-label', a.ok === false ? 'falló' : 'listo')
    if (startedAt[a.id]) {
      const ms = Date.now() - startedAt[a.id]
      el.querySelector('time').textContent = ms < 1000 ? `${ms} ms` : `${(ms / 1000).toFixed(1)} s`
      delete startedAt[a.id]
    }
    return
  }
  if (!activityOpen && pick(ACTIVITY_KEY, 'auto') !== 'closed') setActivityOpen(true)
  else if (!activityOpen) { unseen = true; render() }
}
activity.hidden = !activityOpen
/* SEGUIR A CLAUDE: cuando Claude usa una herramienta que es de una app (el hook dice cuál y en qué ruta: correr el
   harness, escribir en una tarea, manejar Jarvis), Cockpit salta ahí. Si elegiste una app a mano, se respeta 20 s. */
const FOLLOW_KEY = 'cockpit.follow'
let follow = pick(FOLLOW_KEY, 'on') !== 'off'
let manualAt = 0
let lastFollow = ''
const followToggle = document.getElementById('followToggle')
function paintFollow() {
  followToggle.classList.toggle('on', follow)
  followToggle.querySelector('span').textContent = follow ? 'siguiendo' : 'quieto'
  followToggle.title = follow
    ? 'Siguiendo a Claude: Cockpit salta a la app que está usando (si elegís una a mano, se respeta 20 s). Clic para quedarte quieto'
    : 'Quieto: Cockpit no cambia de app solo. Clic para seguir a Claude'
  followToggle.setAttribute('aria-pressed', String(follow))
}
followToggle.addEventListener('click', () => { follow = !follow; keep(FOLLOW_KEY, follow ? 'on' : 'off'); paintFollow() })
paintFollow()
function followTo(app, route) {
  if (!follow || !apps.some((a) => a.id === app) || Date.now() - manualAt < 20_000) return
  const key = `${app}|${route || ''}`
  if (app === current && (!route || key === lastFollow)) return
  lastFollow = key
  pendingRoute = route ? { id: app, hash: route } : null
  select(app).then(() => deliverRoute(app))
}
tauri.event.listen('cockpit-activity', (e) => {
  onActivity(e.payload)
  if (e.payload?.kind === 'start' && e.payload.app) followTo(e.payload.app, e.payload.route)
})

// ⌘1, ⌘2…: cambiar de app (dentro de un iframe el atajo no llega acá; desde la barra, sí).
window.addEventListener('keydown', (e) => {
  if (!e.metaKey || e.altKey || e.ctrlKey) return
  const app = apps[Number(e.key) - 1]
  if (app) { e.preventDefault(); manualAt = Date.now(); select(app.id) }
})

invoke('apps').then((list) => {
  apps = list
  const first = apps.some((a) => a.id === pick('cockpit.app', '')) ? pick('cockpit.app', '') : apps[0]?.id
  if (first) select(first)
  // El chat se carga siempre, aunque mires otra app: su numerito tiene que estar.
  if (apps.some((a) => a.id === 'chat')) load('chat')
})
</script>
