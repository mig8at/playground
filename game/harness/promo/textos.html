<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Los textos de un video, uno por vez (lo que recibe en la dirección, #<json>), sobre fondo transparente, con las letras del
     juego (Bungee para los títulos, Rubik para el resto). textos.mjs los captura a PNG de 1920×1080. -->
<style>
@font-face{font-family:Bungee;src:url('../../node_modules/@fontsource/bungee/files/bungee-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:Bungee;src:url('../../node_modules/@fontsource/bungee/files/bungee-latin-ext-400-normal.woff2') format('woff2');unicode-range:U+0100-024F,U+00C0-00FF;}
@font-face{font-family:Rubik;font-weight:300 900;src:url('../../node_modules/@fontsource-variable/rubik/files/rubik-latin-wght-normal.woff2') format('woff2');}
@font-face{font-family:Rubik;font-weight:300 900;font-style:italic;src:url('../../node_modules/@fontsource-variable/rubik/files/rubik-latin-wght-italic.woff2') format('woff2');}
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
.c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
/* la voz en off: abajo, con una franja oscura suave detrás (se lee también sobre las tomas de día) */
.vo{position:absolute;left:0;right:0;bottom:70px;padding:44px 180px;background:linear-gradient(transparent,rgba(5,8,14,.62) 28%,rgba(5,8,14,.62) 72%,transparent);
 text-align:center;font:italic 400 54px/1.25 Rubik;color:#f4f1ea;letter-spacing:.02em;text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.8)}
/* las palabras: enormes, en el centro; ámbar los ladrones (l), azul la policía (p) */
.palabra{font:96px/1 Bungee;color:#fff;letter-spacing:.06em;text-shadow:0 6px 40px rgba(0,0,0,.85)}
.palabra.p{color:#4f9bff}.palabra.l{color:#ffb238}
.titulo{font:132px/1.02 Bungee;letter-spacing:.04em;text-shadow:0 10px 60px rgba(0,0,0,.9)}
.titulo .p{color:#4f9bff}.titulo .y{color:#f4f1ea;font-size:84px;display:block;margin:10px 0}.titulo .l{color:#ffb238}
.pregunta{font:italic 400 66px/1.2 Rubik;color:#f4f1ea;letter-spacing:.02em}
.final{font:500 44px/1.2 Rubik;color:#cfd6dd;letter-spacing:.32em;text-transform:uppercase}
</style></head>
<body><div id="r"></div>
<script>
const q=JSON.parse(decodeURIComponent(location.hash.slice(1)||'{}')),r=document.getElementById('r');
if(q.vo)r.innerHTML=`<div class="vo">${q.vo}</div>`;
else if(q.palabra)r.innerHTML=`<div class="c"><div class="palabra ${q.color||''}">${q.palabra}</div></div>`;
// (el título en tres partes: la de la policía, el «y» y la de los ladrones)
else if(q.titulo){const [a,b,c]=q.titulo.split('|');r.innerHTML=`<div class="c"><div class="titulo"><span class="p">${a}</span><span class="y">${b||''}</span><span class="l">${c||''}</span></div></div>`;}
else if(q.pregunta)r.innerHTML=`<div class="c" style="top:640px"><div class="pregunta">${q.pregunta}</div></div>`;
else if(q.final)r.innerHTML=`<div class="c" style="top:780px"><div class="final">${q.final}</div></div>`;
document.fonts.ready.then(()=>{window.__listo=true;});
</script></body></html>
