[package]
name = "chat-desktop"
version = "0.1.0"
description = "El chat del playground como app de escritorio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"
tauri-plugin-autostart = "2.7"

[profile.release]
strip = true
lto = true
