<!doctype html>
<html lang="es" data-style="panels">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office</title>
<!--
  OFFICE — la llamada donde se VE cómo trabajan las personas y sus agentes: una grilla como la de una
  videollamada, ilustrada en papel cortado (capas de papel con sombra, texturizadas).
  Por ahora es sólo la parte visual: lo que dicen sale de un guion de ejemplo (SCRIPT), no del chat real.
  Una llamada = una conversación del chat del equipo; cada participante, un recuadro. Para cambiar quiénes
  están: CAST. Todo se dibuja con SVG en este archivo, sin imágenes: se abre directo o servido.
-->
<style>
  :root {
    /* la paleta del papel */
    --ink: #13323a; --teal-deep: #1d4a54; --teal: #2b6670; --teal-soft: #4f8b8a; --sage: #8db3a9;
    --cream: #f1e4c7; --cream-dim: #d9c9a6; --red: #c5381f; --red-deep: #962b19; --orange: #e5592a; --amber: #f08c3d;
    --text: #f6ecd6; --dim: #b9cdc6;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--teal-deep); color: var(--text); overflow: hidden;
    font: 14px/1.4 "Nunito", ui-rounded, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* La textura del papel, encima de todo: ruido suave que se multiplica con los colores. */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .22; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* El fondo de la página: olas de papel abajo y nubes arriba. */
  .backdrop { position: fixed; inset: 0; z-index: 0; }
  .backdrop svg { width: 100%; height: 100%; display: block; }

  .app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 320px;
    grid-template-rows: 56px minmax(0, 1fr) 84px; gap: 0 16px; padding: 0 16px; }
  .topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
  .topbar h1 { flex: none; white-space: nowrap; margin: 0; font-size: 16px; font-weight: 800; letter-spacing: .01em; }
  .topbar .meta { color: var(--dim); font-size: 13px; }
  .chip { flex: none; background: var(--cream); color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 800;
    box-shadow: 0 2px 0 var(--cream-dim), 0 4px 8px rgba(0, 0, 0, .25); }

  /* La grilla de la llamada. */
  .grid { min-height: 0; display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
  .tile { position: relative; border-radius: 22px; overflow: hidden; min-height: 0;
    box-shadow: 0 3px 0 rgba(0, 0, 0, .18), 0 10px 22px rgba(0, 0, 0, .35); transition: box-shadow .2s, transform .2s; }
  .tile svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tile.talking { box-shadow: 0 0 0 4px var(--cream), 0 0 0 8px var(--orange), 0 12px 26px rgba(0, 0, 0, .4); transform: translateY(-2px); }
  .cut { filter: drop-shadow(0 3px 2px rgba(10, 25, 30, .38)) drop-shadow(0 1px 0 rgba(10, 25, 30, .25)); }
  .cut-soft { filter: drop-shadow(0 2px 1.5px rgba(10, 25, 30, .3)); }

  /* El nombre, abajo a la izquierda, en una tira de papel; el estado arriba a la derecha. */
  .nameplate { position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 8px; z-index: 2;
    background: var(--cream); color: var(--ink); padding: 5px 12px 5px 8px; border-radius: 10px; font-weight: 800; font-size: 13px;
    box-shadow: 0 2px 0 var(--cream-dim), 0 4px 10px rgba(0, 0, 0, .3); }
  .nameplate small { font-weight: 700; color: var(--teal); }
  .mic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--teal); }
  .mic svg { position: static; width: 12px; height: 12px; }
  .tile.muted .mic { background: var(--red); }
  .state { position: absolute; right: 12px; top: 12px; z-index: 2; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px;
    background: rgba(19, 50, 58, .72); color: var(--text); }
  .state.talking { background: var(--orange); color: var(--cream); }
  /* las barras de audio del que habla */
  .bars { display: none; gap: 2px; align-items: flex-end; height: 12px; }
  .tile.talking .bars { display: inline-flex; }
  .bars i { width: 3px; background: var(--orange); border-radius: 2px; animation: bar .5s ease-in-out infinite alternate; }
  .bars i:nth-child(2) { animation-delay: .15s; } .bars i:nth-child(3) { animation-delay: .3s; }
  @keyframes bar { from { height: 3px; } to { height: 12px; } }

  /* el globo de «está pensando» */
  .think { position: absolute; top: 16%; right: 14%; z-index: 2; background: var(--cream); color: var(--ink); font-weight: 900;
    padding: 0 12px 6px; border-radius: 18px; font-size: 22px; letter-spacing: 2px; box-shadow: 0 3px 0 var(--cream-dim), 0 6px 12px rgba(0, 0, 0, .3);
    opacity: 0; transform: translateY(6px) scale(.9); transition: opacity .25s, transform .25s; }
  .tile.thinking .think { opacity: 1; transform: none; }

  /* LA ANIMACIÓN DE RECORTES: poco y suave. La cabeza y el cuerpo se balancean por separado desde el cuello; lo
     que cambia con el estado son las cejas, adónde miran las pupilas y cuál de las cuatro bocas se ve. */
  .avatar, .head, .body, .pupils, .brow-l, .brow-r, .eyes, .mouth, .hands { transform-box: view-box; }
  .body { transform-origin: 200px 300px; animation: sway 4.6s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
  .head { transform-origin: 200px 236px; animation: bob 3.4s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
  @keyframes sway { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }
  @keyframes bob { from { transform: rotate(-2deg) translateY(0); } to { transform: rotate(2deg) translateY(-2px); } }
  .tile.talking .head { animation: nod .7s ease-in-out infinite alternate; }
  @keyframes nod { from { transform: rotate(-3deg) translateY(0); } to { transform: rotate(2deg) translateY(-5px); } }
  .eyes { transform-origin: 200px 150px; animation: blink 5s infinite; animation-delay: var(--d, 0s); }
  @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.08); } }
  .pupils { transition: transform .25s steps(2); }
  .tile.idle .pupils { animation: look 7s steps(1) infinite; animation-delay: var(--d, 0s); }
  @keyframes look { 0%, 100% { transform: none; } 35% { transform: translate(-6px, 1px); } 65% { transform: translate(6px, 0); } }
  .tile.typing .pupils { transform: translate(0, 7px); }
  .tile.thinking .pupils { transform: translate(7px, -8px); }
  .brow-l, .brow-r { transition: transform .25s steps(2); }
  .brow-l { transform-origin: 160px 120px; } .brow-r { transform-origin: 240px 120px; }
  .tile.talking .brow-l, .tile.talking .brow-r { transform: translateY(-6px); }
  .tile.thinking .brow-r { transform: translateY(-10px) rotate(-12deg); }
  .tile.thinking .brow-l { transform: translateY(2px) rotate(6deg); }
  .tile.typing .brow-l { transform: translateY(3px) rotate(10deg); }
  .tile.typing .brow-r { transform: translateY(3px) rotate(-10deg); }
  .m-talk, .m-think, .m-flat { display: none; }
  .tile.talking .m-smile, .tile.thinking .m-smile, .tile.typing .m-smile { display: none; }
  .tile.talking .m-talk, .tile.thinking .m-think, .tile.typing .m-flat { display: inline; }
  .mouth { transform-origin: 200px 200px; animation: talk .24s steps(2) infinite alternate; }
  @keyframes talk { from { transform: scaleY(.45); } to { transform: scaleY(1.15); } }
  .hands { transform: translateY(30px); transition: transform .2s; }
  .tile.typing .hands { transform: translateY(0); animation: type .2s steps(2) infinite alternate; }
  @keyframes type { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  .glow { animation: glow 1.6s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .55; } to { opacity: 1; } }
  .paused * { animation-play-state: paused !important; }

  /* Los subtítulos: lo que dice el que habla, en una tira de papel sobre la grilla. */
  .captions { position: absolute; left: calc((100% - 336px) / 2); bottom: 96px; transform: translateX(-50%); z-index: 3; max-width: min(720px, 60%);
    background: var(--ink); color: var(--cream); padding: 10px 16px; border-radius: 14px; font-size: 16px; font-weight: 700;
    box-shadow: 0 3px 0 rgba(0, 0, 0, .3), 0 10px 20px rgba(0, 0, 0, .35); opacity: 0; transition: opacity .25s; pointer-events: none; }
  .captions.on { opacity: 1; }
  .captions b { color: var(--amber); margin-right: 6px; }

  /* El costado: la gente y la conversación, como el panel de chat de la llamada. */
  .side { min-height: 0; display: flex; flex-direction: column; background: var(--cream); color: var(--ink); border-radius: 22px; overflow: hidden;
    box-shadow: 0 3px 0 var(--cream-dim), 0 10px 22px rgba(0, 0, 0, .35); }
  .side header { padding: 14px 16px 10px; font-weight: 900; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; }
  .side header span { font-weight: 700; font-size: 12px; color: var(--teal); }
  .people { list-style: none; margin: 0; padding: 0 10px 10px; display: grid; gap: 2px; border-bottom: 2px dashed var(--cream-dim); }
  .people li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 10px; font-weight: 700; font-size: 13px; }
  .people li.talking { background: #f7d9b5; }
  .people .dot { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2); }
  .people small { color: var(--teal); font-weight: 700; }
  .people .st { font-size: 12px; color: var(--teal); }
  .people li.talking .st { color: var(--red-deep); }
  .log { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg b { font-weight: 900; font-size: 13px; }
  .msg time { color: var(--teal); font-size: 11px; margin-left: 6px; font-weight: 700; }
  .msg p { margin: 2px 0 0; font-size: 14px; }

  /* La barra de controles, abajo al centro: botones redondos de papel. */
  .controls { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 14px; position: relative; }
  .controls .clock { position: absolute; left: 0; font-weight: 800; color: var(--cream); }
  .btn { all: unset; cursor: pointer; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
    background: var(--teal); color: var(--cream); box-shadow: 0 3px 0 var(--ink), 0 6px 14px rgba(0, 0, 0, .35); transition: transform .1s; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink), 0 3px 8px rgba(0, 0, 0, .35); }
  .btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  .btn svg { width: 22px; height: 22px; }
  .btn.leave { width: 72px; border-radius: 24px; background: var(--red); box-shadow: 0 3px 0 var(--red-deep), 0 6px 14px rgba(0, 0, 0, .35); }
  .btn[aria-pressed="true"] { background: var(--amber); color: var(--ink); box-shadow: 0 3px 0 #b8632a, 0 6px 14px rgba(0, 0, 0, .35); }

  @media (max-width: 1000px) {
    body { overflow: auto; }
    .app { height: auto; grid-template-columns: 1fr; grid-template-rows: 56px auto 320px 84px; gap: 14px 0; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 200px; }
    .captions { left: 50%; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="backdrop" aria-hidden="true">
  <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
    <rect width="1600" height="1000" fill="#2b6670"/>
    <g class="cut"><circle cx="1290" cy="230" r="190" fill="#962b19"/><circle cx="1290" cy="230" r="150" fill="#c5381f"/><circle cx="1290" cy="230" r="110" fill="#e5592a"/><circle cx="1290" cy="230" r="70" fill="#f08c3d"/></g>
    <g class="cut"><path d="M-40 600 q60-90 150-60 q40-80 140-40 q80-40 120 40 q90 0 90 80 H-40Z" fill="#f1e4c7"/></g>
    <g class="cut"><path d="M980 420 q40-70 120-50 q50-70 130-20 q80-20 100 60 q70 10 60 70 H980Z" fill="#1d4a54"/></g>
    <g class="cut"><path d="M1180 470 q50-60 120-30 q50-50 110 0 q70 0 70 60 H1180Z" fill="#f1e4c7"/></g>
    <g class="cut"><path d="M0 760 C200 680 330 820 520 760 S860 640 1040 720 S1380 820 1600 700 V1000 H0Z" fill="#962b19"/></g>
    <g class="cut"><path d="M0 820 C220 760 380 880 600 820 S900 720 1120 800 S1420 880 1600 790 V1000 H0Z" fill="#c5381f"/></g>
    <g class="cut"><path d="M0 890 C260 840 420 940 680 890 S1000 820 1240 880 S1480 930 1600 870 V1000 H0Z" fill="#e5592a"/></g>
  </svg>
</div>

<div class="app" id="app">
  <header class="topbar">
    <h1 id="room-title">Sala</h1>
    <span class="chip" id="room-count"></span>
    <span class="meta">sólo visual: lo que dicen es un guion, no el chat real</span>
  </header>
  <main class="grid" id="grid" aria-label="Los participantes de la llamada"></main>
  <aside class="side" aria-label="Quiénes están y qué dicen">
    <header>Personas <span id="who-count"></span></header>
    <ul class="people" id="people"></ul>
    <header>Chat de la llamada <span>guion de ejemplo</span></header>
    <div class="log" id="log" aria-live="polite"></div>
  </aside>
  <footer class="controls">
    <span class="clock" id="clock"></span>
    <button type="button" class="btn" id="cc" aria-pressed="true" title="Subtítulos" aria-label="Subtítulos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10.5a2 2 0 1 0 0 3M16 10.5a2 2 0 1 0 0 3"/></svg>
    </button>
    <button type="button" class="btn" id="pause" aria-pressed="false" title="Pausar" aria-label="Pausar">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
    </button>
    <button type="button" class="btn leave" title="Salir (sólo visual)" aria-label="Salir (sólo visual)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13.5c5-4.5 13-4.5 18 0l-2.5 2.5-3-1.5v-2.5c-2.3-.7-4.7-.7-7 0V14.5l-3 1.5z"/></svg>
    </button>
  </footer>
  <div class="captions" id="captions" aria-live="off"></div>
</div>

<script>
// ── QUIÉNES ESTÁN ────────────────────────────────────────────────────────────────────────────────
// kind: 'human' | 'agent'. owner: de quién es el agente. scene: el paisaje de papel de su recuadro. Todos los
// personajes son originales. Ana, Leo y Sofi son invitados de ejemplo, para que se vea la variedad: no son del
// chat real. Los agentes de Duncan van con nombre genérico hasta saber cómo se llaman.
const ROOM = { title: 'Sala · chat de Duncan' }
const CAST = [
  { id: 'duncan', name: 'Duncan', kind: 'human', skin: '#c68a5e', hair: 'spiky', hairColor: '#5a3a22', shirt: '#2b6670', extras: ['beard', 'glasses'], face: 'wide', scene: 'sunset' },
  { id: 'd-bot1', name: 'agente 1', owner: 'Duncan', kind: 'agent', robot: 'tv', shell: '#f1e4c7', body: '#4f8b8a', light: '#f08c3d', scene: 'clouds' },
  { id: 'd-bot2', name: 'agente 2', owner: 'Duncan', kind: 'agent', robot: 'dome', shell: '#8db3a9', body: '#c5381f', light: '#f1e4c7', scene: 'hills' },
  { id: 'miguel', name: 'Miguel', kind: 'human', skin: '#e0ac7e', hair: 'swoop', hairColor: '#1f1712', shirt: '#e5592a', accent: '#13323a', scene: 'sun' },
  { id: 'luigi', name: 'Luigi', owner: 'Miguel', kind: 'agent', robot: 'can', shell: '#4f8b8a', body: '#1d4a54', light: '#f08c3d', scene: 'waves' },
  { id: 'wario', name: 'Wario', owner: 'Miguel', kind: 'agent', robot: 'blob', shell: '#f08c3d', body: '#c5381f', light: '#f1e4c7', scene: 'dusk' },
  { id: 'ana', name: 'Ana', guest: true, kind: 'human', skin: '#8a5a3c', hair: 'curly', hairColor: '#23171a', shirt: '#f08c3d', accent: '#13323a', extras: ['headphones'], gear: '#c5381f', face: 'round', scene: 'waves' },
  { id: 'leo', name: 'Leo', guest: true, kind: 'human', skin: '#f0c49b', hair: 'beanie', hairColor: '#c5381f', shirt: '#13323a', accent: '#f08c3d', extras: ['freckles'], face: 'tall', scene: 'hills' },
  { id: 'sofi', name: 'Sofi', guest: true, kind: 'human', skin: '#d99c74', hair: 'bun', hairColor: '#4a2f1c', shirt: '#8db3a9', accent: '#c5381f', extras: ['glasses'], face: 'round', scene: 'sunset' },
]

// ── EL GUION ─────────────────────────────────────────────────────────────────────────────────────
// Lo que se dicen, en orden; vuelve a empezar al terminar. Entre línea y línea, cada uno teclea o piensa.
const SCRIPT = [
  ['duncan', '¿Alguien mira el 500 de preaprobación en qa?'],
  ['miguel', 'Yo. Luigi, ¿me traés los logs de la última hora?'],
  ['luigi', 'Van 14 errores, todos del mismo endpoint.'],
  ['d-bot1', 'Ese endpoint cambió en el despliegue de ayer.'],
  ['wario', 'Corro el caso en local para ver si se repite…'],
  ['wario', 'Se repite: falta un campo en la respuesta.'],
  ['duncan', 'Ok, lo arreglo yo. agente 2, armá la rama.'],
  ['d-bot2', 'Rama lista. ¿Le paso el caso de prueba?'],
  ['miguel', 'Sí, el de Pullman. Lo dejo en el chat.'],
  ['luigi', 'Comprobado: con el arreglo pasa de punta a punta.'],
  ['duncan', '🚀 Listo, lo subo a qa.'],
]

// ── LOS PAISAJES DE PAPEL ────────────────────────────────────────────────────────────────────────
// Cada recuadro es una escena de capas recortadas (viewBox 400×300), con la paleta de papel: verde azulado,
// crema, rojo y naranja. Cada capa lleva su sombra (.cut), y eso es lo que la hace papel.
const P = { ink: '#13323a', deep: '#1d4a54', teal: '#2b6670', soft: '#4f8b8a', sage: '#8db3a9', cream: '#f1e4c7', red: '#c5381f', redDeep: '#962b19', orange: '#e5592a', amber: '#f08c3d' }
const cloud = (x, y, s, fill) => `<g class="cut"><path transform="translate(${x} ${y}) scale(${s})" d="M0 40 q4-26 30-22 q10-24 38-16 q22-14 40 8 q26-2 28 30 Z" fill="${fill}"/></g>`
const sun = (x, y, r, rings) => `<g class="cut">${rings.map((c, i) => `<circle cx="${x}" cy="${y}" r="${r * (1 - i * .22)}" fill="${c}"/>`).join('')}</g>`
const wave = (y, amp, fill, phase = 0) => `<g class="cut"><path d="M-10 ${y} C${60 + phase} ${y - amp} ${130 + phase} ${y + amp} 200 ${y} S${340 - phase} ${y - amp} 410 ${y + 4} V310 H-10Z" fill="${fill}"/></g>`
const SCENES = {
  sunset: () => `<rect width="400" height="300" fill="${P.teal}"/>${sun(320, 80, 70, [P.redDeep, P.red, P.orange, P.amber])}${cloud(10, 40, 1.1, P.cream)}${cloud(270, 130, .9, P.deep)}${wave(230, 26, P.redDeep)}${wave(255, 22, P.red, 30)}${wave(282, 16, P.orange, 10)}`,
  clouds: () => `<rect width="400" height="300" fill="${P.soft}"/>${cloud(-20, 10, 1.6, P.deep)}${cloud(260, 40, 1.2, P.cream)}${cloud(-30, 150, 1.4, P.teal)}${wave(250, 20, P.deep)}${wave(276, 14, P.ink, 40)}`,
  hills: () => `<rect width="400" height="300" fill="${P.cream}"/>${sun(70, 80, 48, [P.amber, P.orange])}${cloud(270, 30, 1, P.sage)}${wave(215, 30, P.sage)}${wave(245, 24, P.soft, 40)}${wave(275, 16, P.teal, 10)}`,
  sun: () => `<rect width="400" height="300" fill="${P.deep}"/>${sun(330, 70, 80, [P.redDeep, P.red, P.orange, P.amber])}${cloud(0, 60, 1.2, P.teal)}${cloud(270, 150, 1, P.cream)}${wave(240, 24, P.red)}${wave(270, 18, P.orange, 30)}`,
  waves: () => `<rect width="400" height="300" fill="${P.teal}"/>${cloud(260, 20, 1.3, P.cream)}${cloud(-10, 90, 1, P.soft)}${wave(200, 26, P.deep)}${wave(232, 22, P.soft, 30)}${wave(262, 18, P.sage, 10)}${wave(286, 12, P.cream, 40)}`,
  dusk: () => `<rect width="400" height="300" fill="${P.redDeep}"/>${sun(70, 90, 60, [P.red, P.orange, P.amber])}${cloud(250, 40, 1.2, P.deep)}${cloud(280, 130, .8, P.cream)}${wave(235, 26, P.ink)}${wave(265, 18, P.deep, 30)}`,
}

// ── LOS PERSONAJES, EN PAPEL ─────────────────────────────────────────────────────────────────────
// Caricaturas originales del torso para arriba: cabeza grande, hombros chicos. Cada pieza es una capa con sombra.
// La cara es la misma maquinaria para personas y agentes: ojos con pupila (.pupils), cejas (.brow-l / .brow-r) y
// cuatro bocas (.m-smile, .m-talk, .m-think, .m-flat); el CSS elige cuál se ve y adónde miran según el estado
// del recuadro. La cabeza (.head) y el cuerpo (.body) se balancean por separado, poquito, como un títere de
// recortes: nada de mover la cámara.
const shade = (hex, f) => {
  const n = parseInt(hex.slice(1), 16)
  const ch = (v) => Math.max(0, Math.min(255, Math.round(v * f)))
  return `rgb(${ch(n >> 16)},${ch((n >> 8) & 255)},${ch(n & 255)})`
}
const cut = (inner) => `<g class="cut">${inner}</g>`
const soft = (inner) => `<g class="cut-soft">${inner}</g>`

// La cara: f trae los colores de ojos, pupila, cejas y boca, y dónde van (cx, eyeY, gap, eye = tamaño).
function face(f) {
  const { cx = 200, eyeY = 150, gap = 36, eye = 22, white, pupil, brow, mouth, mouthY = 196, tongue } = f
  const L = cx - gap, R = cx + gap
  return `
    <g class="eyes">${soft(`<ellipse cx="${L}" cy="${eyeY}" rx="${eye * .9}" ry="${eye}" fill="${white}"/><ellipse cx="${R}" cy="${eyeY}" rx="${eye * .9}" ry="${eye}" fill="${white}"/>`)}
      <g class="pupils"><circle cx="${L + 2}" cy="${eyeY + 3}" r="${eye * .45}" fill="${pupil}"/><circle cx="${R - 2}" cy="${eyeY + 3}" r="${eye * .45}" fill="${pupil}"/>
        <circle cx="${L + 5}" cy="${eyeY - 1}" r="${eye * .14}" fill="#f6ecd6"/><circle cx="${R + 1}" cy="${eyeY - 1}" r="${eye * .14}" fill="#f6ecd6"/></g></g>
    <g class="brow-l">${soft(`<path d="M${L - 20} ${eyeY - eye - 8} q20 -14 38 -2 l-3 7 q-16 -9 -32 2Z" fill="${brow}"/>`)}</g>
    <g class="brow-r">${soft(`<path d="M${R + 20} ${eyeY - eye - 8} q-20 -14 -38 -2 l3 7 q16 -9 32 2Z" fill="${brow}"/>`)}</g>
    <g class="m-smile">${soft(`<path d="M${cx - 24} ${mouthY - 4} q24 26 48 0 q-24 12 -48 0Z" fill="${mouth}"/>`)}</g>
    <g class="m-talk"><g class="mouth">${soft(`<ellipse cx="${cx}" cy="${mouthY + 2}" rx="17" ry="14" fill="${mouth}"/><ellipse cx="${cx}" cy="${mouthY + 9}" rx="10" ry="5" fill="${tongue || '#e5592a'}"/>`)}</g></g>
    <g class="m-think">${soft(`<path d="M${cx - 14} ${mouthY + 2} q8 -8 16 0 q8 8 16 -2 l2 5 q-10 10 -19 1 q-7 -6 -13 1Z" fill="${mouth}"/>`)}</g>
    <g class="m-flat">${soft(`<rect x="${cx - 13}" y="${mouthY}" width="26" height="6" rx="3" fill="${mouth}"/>`)}</g>`
}

// El pelo: lo de atrás (va antes que la cabeza) y lo de adelante (va encima).
const HAIR = {
  spiky: { front: (c) => `<path d="M104 140 q-6-64 40-84 l-6 -22 l28 16 l10 -26 l20 22 l20 -28 l12 30 l30 -18 l-6 30 q42 22 44 80 q-30-40-96-44 q-66 4-96 44Z" fill="${c}"/>` },
  swoop: { front: (c) => `<path d="M104 146 q-10-92 96-94 q96 2 96 86 q-14-30-40-40 q-60 26-130 2 q-14 20-22 46Z" fill="${c}"/>` },
  bob: { back: (c) => `<path d="M90 160 q-8-112 110-112 q118 0 110 112 l0 70 q-20 10-40 0 l0-80 h-140 l0 80 q-20 10-40 0Z" fill="${c}"/>`,
    front: (c) => `<path d="M106 128 q0-70 94-72 q94 2 94 72 q-40-10-60-28 q-20 20-68 22 q-40 0-60 6Z" fill="${c}"/>` },
  curly: { back: (c) => [[120, 92, 34], [160, 66, 36], [208, 58, 38], [254, 72, 36], [290, 108, 32], [104, 136, 28], [300, 150, 28]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`).join(''),
    front: (c) => `<path d="M118 120 q20-40 82-42 q62 2 82 42 q-30-14-52-6 q-30-16-60 0 q-26-8-52 6Z" fill="${c}"/>` },
  bun: { back: (c) => `<circle cx="200" cy="42" r="30" fill="${c}"/>`,
    front: (c) => `<path d="M108 136 q-2-82 92-84 q94 2 92 84 q-30-46-92-48 q-62 2-92 48Z" fill="${c}"/>` },
  beanie: { front: (c) => `<path d="M100 128 q4-86 100-88 q96 2 100 88Z" fill="${c}"/><rect x="94" y="114" width="212" height="28" rx="14" fill="${shade(c, .78)}"/><circle cx="200" cy="38" r="16" fill="${shade(c, 1.25)}"/>` },
}

// Lo que se pone encima: lentes, audífonos, barba, pecas.
const EXTRAS = {
  glasses: () => `<g class="cut-soft" fill="none" stroke="#13323a" stroke-width="7"><rect x="136" y="124" width="56" height="50" rx="18"/><rect x="208" y="124" width="56" height="50" rx="18"/><path d="M192 146 h16"/></g>`,
  headphones: (c) => `<g class="cut"><path d="M92 156 q0-118 108-118 q108 0 108 118" fill="none" stroke="${c}" stroke-width="14" stroke-linecap="round"/><rect x="74" y="140" width="34" height="58" rx="14" fill="${c}"/><rect x="292" y="140" width="34" height="58" rx="14" fill="${c}"/></g>`,
  beard: (c) => `<g class="cut-soft"><path d="M118 168 q6 82 82 84 q76-2 82-84 q-10 30-34 34 q-48 14-96 0 q-24-4-34-34Z" fill="${c}"/></g>`,
  freckles: () => [[146, 186], [156, 194], [166, 186], [234, 186], [244, 194], [254, 186]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3" fill="#962b19" opacity=".55"/>`).join(''),
}

function torso(shirt, accent) {
  return `<g class="body">
    ${cut(`<path d="M74 304 q8-78 126-80 q118 2 126 80Z" fill="${shirt}"/>`)}
    ${soft(`<path d="M160 228 q40 30 80 0 q-6 22-40 26 q-34-4-40-26Z" fill="${accent}"/>`)}
  </g>`
}
// las manos aparecen abajo, tecleando, sólo mientras teclea
const handsAt = (c) => `<g class="hands">${soft(`<ellipse cx="146" cy="300" rx="26" ry="16" fill="${c}"/><ellipse cx="254" cy="300" rx="26" ry="16" fill="${c}"/>`)}</g>`

function human(p) {
  const s = p.skin, sh = shade(s, .86)
  const hair = HAIR[p.hair]
  const head = { round: [96, 88], wide: [104, 84], tall: [90, 96] }[p.face || 'round']
  return `${torso(p.shirt, p.accent || '#f1e4c7')}
  <g class="head">
    ${cut(`<rect x="182" y="196" width="36" height="40" rx="12" fill="${sh}"/>`)}
    ${hair.back ? cut(hair.back(p.hairColor)) : ''}
    ${cut(`<circle cx="${200 - head[0] - 2}" cy="160" r="18" fill="${sh}"/><circle cx="${200 + head[0] + 2}" cy="160" r="18" fill="${sh}"/>`)}
    ${cut(`<ellipse cx="200" cy="146" rx="${head[0]}" ry="${head[1]}" fill="${s}"/>`)}
    <ellipse cx="140" cy="182" rx="15" ry="9" fill="#e5592a" opacity=".35"/><ellipse cx="260" cy="182" rx="15" ry="9" fill="#e5592a" opacity=".35"/>
    ${p.extras?.includes('freckles') ? EXTRAS.freckles() : ''}
    ${p.extras?.includes('beard') ? EXTRAS.beard(p.hairColor) : ''}
    ${soft(`<path d="M196 160 q-10 16 2 20 q10 2 10-6" fill="${sh}"/>`)}
    ${face({ white: '#fbf4e4', pupil: '#13323a', brow: shade(p.hairColor, .9), mouth: p.extras?.includes('beard') ? '#f1e4c7' : '#962b19', mouthY: 206, tongue: '#e5592a' })}
    ${cut(hair.front(p.hairColor))}
    ${p.extras?.includes('glasses') ? EXTRAS.glasses() : ''}
    ${p.extras?.includes('headphones') ? EXTRAS.headphones(p.gear || '#13323a') : ''}
  </g>${handsAt(s)}`
}

// Los agentes: cuatro formas de robot, con la misma cara en colores de pantalla.
const BOTS = {
  tv: (p) => `${cut(`<rect x="196" y="22" width="8" height="34" rx="4" fill="#13323a"/><circle cx="200" cy="22" r="12" fill="${p.light}" class="glow"/>`)}
    ${cut(`<rect x="96" y="54" width="208" height="176" rx="44" fill="${p.shell}"/>`)}${soft(`<rect x="116" y="76" width="168" height="136" rx="34" fill="#13323a"/>`)}`,
  dome: (p) => `${cut(`<path d="M92 196 q0-152 108-152 q108 0 108 152Z" fill="${p.shell}"/>`)}${soft(`<path d="M112 192 q0-128 88-128 q88 0 88 128Z" fill="#13323a"/>`)}
    ${cut(`<rect x="84" y="186" width="232" height="34" rx="17" fill="${shade(p.shell, .8)}"/>`)}`,
  can: (p) => `${cut(`<path d="M104 60 l-24 -30 M296 60 l24 -30" stroke="#13323a" stroke-width="8" stroke-linecap="round"/><circle cx="78" cy="28" r="11" fill="${p.light}" class="glow"/><circle cx="322" cy="28" r="11" fill="${p.light}" class="glow"/>`)}
    ${cut(`<rect x="100" y="50" width="200" height="182" rx="30" fill="${p.shell}"/><rect x="100" y="50" width="200" height="26" rx="13" fill="${shade(p.shell, .8)}"/>`)}${soft(`<rect x="120" y="94" width="160" height="122" rx="26" fill="#13323a"/>`)}`,
  blob: (p) => `${cut(`<path d="M96 230 q-10-190 104-190 q114 0 104 190 q-18-14-34 0 q-18-14-36 0 q-18-14-34 0 q-18-14-36 0 q-18-14-34 0Z" fill="${p.shell}"/>`)}`,
}
function agent(p) {
  const onScreen = p.robot !== 'blob'
  return `${torso(p.body, p.light)}
  <g class="head">
    ${cut(`<rect x="180" y="200" width="40" height="40" rx="10" fill="${shade(p.body, .7)}"/>`)}
    ${BOTS[p.robot](p)}
    ${face(onScreen
    ? { white: p.light, pupil: '#13323a', brow: p.light, mouth: p.light, eyeY: 146, eye: 20, mouthY: 184, tongue: '#13323a' }
    : { white: '#fbf4e4', pupil: '#13323a', brow: shade(p.shell, .6), mouth: '#13323a', eyeY: 140, eye: 24, mouthY: 186, tongue: '#e5592a' })}
  </g>${handsAt(p.shell)}`
}

// ── LA GRILLA ────────────────────────────────────────────────────────────────────────────────────
const grid = document.getElementById('grid')
const people = CAST.map((c) => ({ ...c, state: 'typing', until: 0 }))
const STATE_LABEL = { typing: 'teclea', thinking: 'piensa', talking: 'habla', idle: 'escucha' }
const MIC = '<svg viewBox="0 0 24 24" fill="#f1e4c7"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0" stroke="#f1e4c7" stroke-width="2" fill="none"/><rect x="11" y="17" width="2" height="4"/></svg>'
for (const [i, p] of people.entries()) {
  const el = document.createElement('section')
  el.className = 'tile'
  el.setAttribute('aria-label', p.owner ? `${p.name}, agente de ${p.owner}` : p.guest ? `${p.name}, invitado de ejemplo` : p.name)
  el.innerHTML = `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${SCENES[p.scene]()}
      <g transform="translate(46 70) scale(.77)"><g class="avatar">${p.kind === 'human' ? human(p) : agent(p)}</g></g></svg>
    <div class="think" aria-hidden="true">···</div>
    <span class="state"></span>
    <div class="nameplate"><span class="mic">${MIC}</span>${p.name}${p.owner ? ` <small>· ${p.owner}</small>` : p.guest ? ' <small>· invitado</small>' : ''}<span class="bars"><i></i><i></i><i></i></span></div>`
  // que no parpadeen todos a la vez
  el.style.setProperty('--d', `${-i * 1.7}s`)
  p.el = el
  grid.appendChild(el)
}

// ── QUIÉN HACE QUÉ ───────────────────────────────────────────────────────────────────────────────
let line = 0, nextLineAt = 1000, paused = false, t = 0
function setState(p, st) {
  p.state = st
  p.el.classList.toggle('talking', st === 'talking')
  p.el.classList.toggle('thinking', st === 'thinking')
  p.el.classList.toggle('typing', st === 'typing')
  p.el.classList.toggle('muted', st !== 'talking')
  const badge = p.el.querySelector('.state')
  badge.textContent = STATE_LABEL[st]; badge.className = `state ${st}`
}
function idleStates() {
  const nextWho = SCRIPT[line % SCRIPT.length][0]
  for (const p of people) {
    if (t < p.until) continue
    // el que va a hablar después se queda pensando antes
    if (p.id === nextWho) { setState(p, 'thinking'); p.until = nextLineAt; continue }
    const r = Math.random()
    setState(p, r < .55 ? 'typing' : r < .75 ? 'thinking' : 'idle')
    p.until = t + 1500 + Math.random() * 3500
  }
}
const captions = document.getElementById('captions'), log = document.getElementById('log')
const hhmm = (d) => d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })
let captionsOn = true, captionUntil = 0
function say() {
  const [who, text] = SCRIPT[line % SCRIPT.length]
  line++
  const p = people.find((x) => x.id === who)
  setState(p, 'talking'); p.until = t + 2600 + text.length * 40
  captions.innerHTML = '<b></b><span></span>'
  captions.querySelector('b').textContent = p.name
  captions.querySelector('span').textContent = text
  captions.classList.toggle('on', captionsOn); captionUntil = p.until
  const el = document.createElement('div')
  el.className = 'msg'
  el.innerHTML = `<b style="color:${p.kind === 'human' ? shade(p.shirt, .8) : shade(p.body, .75)}"></b><time>${hhmm(new Date())}</time><p></p>`
  el.querySelector('b').textContent = p.owner ? `${p.name} (de ${p.owner})` : p.name
  el.querySelector('p').textContent = text
  log.appendChild(el)
  while (log.children.length > 60) log.firstChild.remove()
  log.scrollTop = log.scrollHeight
  nextLineAt = t + 3600 + Math.random() * 2200
}

const listEl = document.getElementById('people')
function drawPeople() {
  listEl.innerHTML = people.map((p) => `<li class="${p.state}"><span class="dot" style="background:${p.kind === 'human' ? p.shirt : p.body}"></span>
    <span>${p.name}${p.owner ? ` <small>agente de ${p.owner}</small>` : p.guest ? ' <small>invitado de ejemplo</small>' : ''}</span><span class="st">${STATE_LABEL[p.state]}</span></li>`).join('')
}

// El reloj de la llamada: pasos de 100 ms, pausable. Con la pestaña oculta el navegador lo frena, y está bien.
setInterval(() => {
  if (!paused) {
    t += 100
    if (t > nextLineAt) say()
    idleStates()
    if (t > captionUntil) captions.classList.remove('on')
  }
  drawPeople()
  document.getElementById('clock').textContent = hhmm(new Date())
}, 100)

document.getElementById('room-title').textContent = ROOM.title
document.getElementById('room-count').textContent = `${CAST.filter((c) => c.kind === 'human').length} personas · ${CAST.filter((c) => c.kind === 'agent').length} agentes`
document.getElementById('who-count').textContent = CAST.length
document.getElementById('pause').addEventListener('click', (e) => {
  paused = !paused
  const b = e.currentTarget
  b.setAttribute('aria-pressed', String(paused)); b.title = paused ? 'Seguir' : 'Pausar'; b.setAttribute('aria-label', b.title)
  document.getElementById('app').classList.toggle('paused', paused)
})
document.getElementById('cc').addEventListener('click', (e) => {
  captionsOn = !captionsOn
  e.currentTarget.setAttribute('aria-pressed', String(captionsOn))
  if (!captionsOn) captions.classList.remove('on')
})
people.forEach((p) => setState(p, 'typing'))
</script>
</body>
