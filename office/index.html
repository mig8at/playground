<!doctype html>
<html lang="es" data-style="panels">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office</title>
<!--
  OFFICE — la llamada donde se VE cómo trabajan las personas y sus agentes: una grilla como la de una
  videollamada, ilustrada en papel cortado (capas de papel con sombra, texturizadas).
  Por ahora es sólo la parte visual: lo que dicen sale de un guion de ejemplo (SCRIPT), no del chat real.
  Una llamada = una conversación del chat del equipo; cada participante, un recuadro. Para cambiar quiénes
  están: CAST. Todo se dibuja con SVG en este archivo, sin imágenes: se abre directo o servido.
-->
<style>
  :root {
    /* la paleta del papel */
    --ink: #13323a; --teal-deep: #1d4a54; --teal: #2b6670; --teal-soft: #4f8b8a; --sage: #8db3a9;
    --cream: #f1e4c7; --cream-dim: #d9c9a6; --red: #c5381f; --red-deep: #962b19; --orange: #e5592a; --amber: #f08c3d;
    --text: #f6ecd6; --dim: #9aa3a6;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #0b0c0e; color: var(--text); overflow: hidden;
    font: 14px/1.4 "Nunito", ui-rounded, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* La textura del papel, encima de todo: ruido suave que se multiplica con los colores. */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .22; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }


  .app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 320px;
    grid-template-rows: 56px minmax(0, 1fr) 84px; gap: 0 16px; padding: 0 16px; }
  .topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
  .topbar h1 { flex: none; white-space: nowrap; margin: 0; font-size: 16px; font-weight: 800; letter-spacing: .01em; }
  .topbar .meta { color: var(--dim); font-size: 13px; }
  .chip { flex: none; background: var(--cream); color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 800;
    box-shadow: 0 2px 0 var(--cream-dim), 0 4px 8px rgba(0, 0, 0, .25); }

  /* La grilla de la llamada. */
  .grid { min-height: 0; display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
  .tile { position: relative; border-radius: 22px; overflow: hidden; min-height: 0;
    box-shadow: 0 3px 0 rgba(0, 0, 0, .18), 0 10px 22px rgba(0, 0, 0, .35); transition: box-shadow .2s, transform .2s; }
  .tile svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tile.talking { box-shadow: 0 0 0 4px var(--cream), 0 0 0 8px var(--orange), 0 12px 26px rgba(0, 0, 0, .4); transform: translateY(-2px); }
  .cut { filter: drop-shadow(0 3px 2px rgba(10, 25, 30, .38)) drop-shadow(0 1px 0 rgba(10, 25, 30, .25)); }
  .cut-soft { filter: drop-shadow(0 2px 1.5px rgba(10, 25, 30, .3)); }

  /* El nombre, abajo a la izquierda, en una tira de papel; el estado arriba a la derecha. */
  .nameplate { position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 8px; z-index: 2;
    background: var(--cream); color: var(--ink); padding: 5px 12px 5px 8px; border-radius: 10px; font-weight: 800; font-size: 13px;
    box-shadow: 0 2px 0 var(--cream-dim), 0 4px 10px rgba(0, 0, 0, .3); }
  .nameplate small { font-weight: 700; color: var(--teal); }
  .mic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--teal); }
  .mic svg { position: static; width: 12px; height: 12px; }
  .tile.muted .mic { background: var(--red); }
  .state { position: absolute; right: 12px; top: 12px; z-index: 2; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px;
    background: rgba(19, 50, 58, .72); color: var(--text); }
  .state.talking { background: var(--orange); color: var(--cream); }
  /* las barras de audio del que habla */
  .bars { display: none; gap: 2px; align-items: flex-end; height: 12px; }
  .tile.talking .bars { display: inline-flex; }
  .bars i { width: 3px; background: var(--orange); border-radius: 2px; animation: bar .5s ease-in-out infinite alternate; }
  .bars i:nth-child(2) { animation-delay: .15s; } .bars i:nth-child(3) { animation-delay: .3s; }
  @keyframes bar { from { height: 3px; } to { height: 12px; } }

  /* el globo de «está pensando» */
  .think { position: absolute; top: 16%; right: 14%; z-index: 2; background: var(--cream); color: var(--ink); font-weight: 900;
    padding: 0 12px 6px; border-radius: 18px; font-size: 22px; letter-spacing: 2px; box-shadow: 0 3px 0 var(--cream-dim), 0 6px 12px rgba(0, 0, 0, .3);
    opacity: 0; transform: translateY(6px) scale(.9); transition: opacity .25s, transform .25s; }
  .tile.thinking .think { opacity: 1; transform: none; }

  /* LA ANIMACIÓN DE RECORTES: poco y suave. La cabeza y el cuerpo se balancean por separado desde el cuello; lo
     que cambia con el estado son las cejas, adónde miran las pupilas y cuál de las cuatro bocas se ve. */
  .avatar, .head, .body, .pupils, .brow-l, .brow-r, .eyes, .mouth, .hands { transform-box: view-box; }
  .body { transform-origin: 200px 300px; animation: sway 4.6s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
  .head { transform-origin: 200px 236px; animation: bob 3.4s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
  @keyframes sway { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }
  @keyframes bob { from { transform: rotate(-2deg) translateY(0); } to { transform: rotate(2deg) translateY(-2px); } }
  .tile.talking .head { animation: nod .7s ease-in-out infinite alternate; }
  @keyframes nod { from { transform: rotate(-3deg) translateY(0); } to { transform: rotate(2deg) translateY(-5px); } }
  .eyes { transform-origin: 200px 150px; animation: blink 5s infinite; animation-delay: var(--d, 0s); }
  @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.08); } }
  .pupils { transition: transform .25s steps(2); }
  .tile.idle .pupils { animation: look 7s steps(1) infinite; animation-delay: var(--d, 0s); }
  @keyframes look { 0%, 100% { transform: none; } 35% { transform: translate(-6px, 1px); } 65% { transform: translate(6px, 0); } }
  .tile.typing .pupils { transform: translate(0, 7px); }
  .tile.thinking .pupils { transform: translate(7px, -8px); }
  .brow-l, .brow-r { transition: transform .25s steps(2); }
  .brow-l { transform-origin: 160px 120px; } .brow-r { transform-origin: 240px 120px; }
  .tile.talking .brow-l, .tile.talking .brow-r { transform: translateY(-6px); }
  .tile.thinking .brow-r { transform: translateY(-10px) rotate(-12deg); }
  .tile.thinking .brow-l { transform: translateY(2px) rotate(6deg); }
  .tile.typing .brow-l { transform: translateY(3px) rotate(10deg); }
  .tile.typing .brow-r { transform: translateY(3px) rotate(-10deg); }
  .m-talk, .m-think, .m-flat { display: none; }
  .tile.talking .m-smile, .tile.thinking .m-smile, .tile.typing .m-smile { display: none; }
  .tile.talking .m-talk, .tile.thinking .m-think, .tile.typing .m-flat { display: inline; }
  .mouth { transform-origin: 200px 200px; animation: talk .24s steps(2) infinite alternate; }
  @keyframes talk { from { transform: scaleY(.45); } to { transform: scaleY(1.15); } }
  .hands { transform: translateY(30px); transition: transform .2s; }
  .tile.typing .hands { transform: translateY(0); animation: type .2s steps(2) infinite alternate; }
  @keyframes type { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  .glow { animation: glow 1.6s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .55; } to { opacity: 1; } }
  .paused * { animation-play-state: paused !important; }

  /* Los subtítulos: lo que dice el que habla, en una tira de papel sobre la grilla. */
  .captions { position: absolute; left: calc((100% - 336px) / 2); bottom: 96px; transform: translateX(-50%); z-index: 3; max-width: min(720px, 60%);
    background: var(--ink); color: var(--cream); padding: 10px 16px; border-radius: 14px; font-size: 16px; font-weight: 700;
    box-shadow: 0 3px 0 rgba(0, 0, 0, .3), 0 10px 20px rgba(0, 0, 0, .35); opacity: 0; transition: opacity .25s; pointer-events: none; }
  .captions.on { opacity: 1; }
  .captions b { color: var(--amber); margin-right: 6px; }

  /* El costado: la gente y la conversación, como el panel de chat de la llamada. */
  .side { min-height: 0; display: flex; flex-direction: column; background: var(--cream); color: var(--ink); border-radius: 22px; overflow: hidden;
    box-shadow: 0 3px 0 var(--cream-dim), 0 10px 22px rgba(0, 0, 0, .35); }
  .side header { padding: 14px 16px 10px; font-weight: 900; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; }
  .side header span { font-weight: 700; font-size: 12px; color: var(--teal); }
  .people { list-style: none; margin: 0; padding: 0 10px 10px; display: grid; gap: 2px; border-bottom: 2px dashed var(--cream-dim); }
  .people li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 10px; font-weight: 700; font-size: 13px; }
  .people li.talking { background: #f7d9b5; }
  .people .dot { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2); }
  .people small { color: var(--teal); font-weight: 700; }
  .people .st { font-size: 12px; color: var(--teal); }
  .people li.talking .st { color: var(--red-deep); }
  .log { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg b { font-weight: 900; font-size: 13px; }
  .msg time { color: var(--teal); font-size: 11px; margin-left: 6px; font-weight: 700; }
  .msg p { margin: 2px 0 0; font-size: 14px; }

  /* La barra de controles, abajo al centro: botones redondos de papel. */
  .controls { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 14px; position: relative; }
  .controls .clock { position: absolute; left: 0; font-weight: 800; color: var(--cream); }
  .btn { all: unset; cursor: pointer; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
    background: var(--teal); color: var(--cream); box-shadow: 0 3px 0 var(--ink), 0 6px 14px rgba(0, 0, 0, .35); transition: transform .1s; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink), 0 3px 8px rgba(0, 0, 0, .35); }
  .btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  .btn svg { width: 22px; height: 22px; }
  .btn.leave { width: 72px; border-radius: 24px; background: var(--red); box-shadow: 0 3px 0 var(--red-deep), 0 6px 14px rgba(0, 0, 0, .35); }
  .btn[aria-pressed="true"] { background: var(--amber); color: var(--ink); box-shadow: 0 3px 0 #b8632a, 0 6px 14px rgba(0, 0, 0, .35); }

  @media (max-width: 1000px) {
    body { overflow: auto; }
    .app { height: auto; grid-template-columns: 1fr; grid-template-rows: 56px auto 320px 84px; gap: 14px 0; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 200px; }
    .captions { left: 50%; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>


<div class="app" id="app">
  <header class="topbar">
    <h1 id="room-title">Sala</h1>
    <span class="chip" id="room-count"></span>
    <span class="meta">sólo visual: lo que dicen es un guion, no el chat real</span>
  </header>
  <main class="grid" id="grid" aria-label="Los participantes de la llamada"></main>
  <aside class="side" aria-label="Quiénes están y qué dicen">
    <header>Personas <span id="who-count"></span></header>
    <ul class="people" id="people"></ul>
    <header>Chat de la llamada <span>guion de ejemplo</span></header>
    <div class="log" id="log" aria-live="polite"></div>
  </aside>
  <footer class="controls">
    <span class="clock" id="clock"></span>
    <button type="button" class="btn" id="cc" aria-pressed="true" title="Subtítulos" aria-label="Subtítulos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10.5a2 2 0 1 0 0 3M16 10.5a2 2 0 1 0 0 3"/></svg>
    </button>
    <button type="button" class="btn" id="pause" aria-pressed="false" title="Pausar" aria-label="Pausar">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
    </button>
    <button type="button" class="btn leave" title="Salir (sólo visual)" aria-label="Salir (sólo visual)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13.5c5-4.5 13-4.5 18 0l-2.5 2.5-3-1.5v-2.5c-2.3-.7-4.7-.7-7 0V14.5l-3 1.5z"/></svg>
    </button>
  </footer>
  <div class="captions" id="captions" aria-live="off"></div>
</div>

<script>
// ── QUIÉNES ESTÁN ────────────────────────────────────────────────────────────────────────────────
// Todos son personas, dibujadas a mano y originales. kind: 'human' | 'agent' (el agente lleva su prendedor de
// chispa y owner, de quién es). hair: el peinado (HAIR), face: la forma de la cara, neck: el cuello de la prenda,
// extras: lentes, audífonos, aretes, barba, pecas. scene: el paisaje de su recuadro. Ana, Leo y Sofi son invitados
// de ejemplo, para que se vea la variedad: no son del chat real. Los agentes de Duncan van con nombre genérico hasta
// saber cómo se llaman.
const ROOM = { title: 'Sala · chat de Duncan' }
const CAST = [
  { id: 'duncan', nose: 'bulb', eye: 22, teeth: 'grin', name: 'Duncan', kind: 'human', skin: '#c68a5e', hair: 'crop', hairColor: '#5a3a22', shirt: '#2b6670', accent: '#f1e4c7', neck: 'collar', extras: ['beard', 'glasses'], face: 'wide', scene: 'sunset' },
  { id: 'd-bot1', nose: 'button', eye: 28, name: 'agente 1', owner: 'Duncan', kind: 'agent', skin: '#e9b98f', hair: 'bob', hairColor: '#1f1712', shirt: '#f08c3d', neck: 'turtle', extras: ['earrings'], gear: '#c5381f', lashes: true, face: 'soft', scene: 'clouds' },
  { id: 'd-bot2', nose: 'long', eye: 24, teeth: 'buck', name: 'agente 2', owner: 'Duncan', kind: 'agent', skin: '#f2c9a3', hair: 'curly', hairColor: '#8a4b2a', shirt: '#c5381f', accent: '#f1e4c7', neck: 'hoodie', extras: ['headphones'], gear: '#13323a', face: 'round', scene: 'hills' },
  { id: 'miguel', nose: 'hook', eye: 26, teeth: 'grin', name: 'Miguel', kind: 'human', skin: '#e0ac7e', hair: 'side', hairColor: '#1f1712', shirt: '#e5592a', accent: '#13323a', neck: 'crew', face: 'round', scene: 'sun' },
  { id: 'luigi', nose: 'button', eye: 30, name: 'Luigi', owner: 'Miguel', kind: 'agent', skin: '#f0c49b', hair: 'long', hairColor: '#962b19', shirt: '#8db3a9', accent: '#f1e4c7', neck: 'cardigan', extras: ['freckles'], lashes: true, face: 'soft', scene: 'waves' },
  { id: 'wario', nose: 'bulb', eye: 20, lids: true, teeth: 'buck', name: 'Wario', owner: 'Miguel', kind: 'agent', skin: '#a8703f', hair: 'buzz', hairColor: '#23171a', shirt: '#1d4a54', accent: '#f08c3d', neck: 'crew', extras: ['glasses'], glassesRound: true, face: 'tall', scene: 'dusk' },
  { id: 'ana', nose: 'button', eye: 27, teeth: 'grin', name: 'Ana', guest: true, kind: 'human', skin: '#8a5a3c', hair: 'curly', hairColor: '#23171a', shirt: '#f08c3d', accent: '#13323a', neck: 'crew', extras: ['earrings'], gear: '#f1e4c7', lashes: true, face: 'round', scene: 'garden' },
  { id: 'leo', nose: 'long', eye: 25, teeth: 'buck', name: 'Leo', guest: true, kind: 'human', skin: '#f0c49b', hair: 'beanie', hairColor: '#c5381f', shirt: '#13323a', accent: '#f08c3d', neck: 'hoodie', extras: ['freckles'], face: 'tall', scene: 'ocean' },
  { id: 'sofi', nose: 'hook', eye: 24, name: 'Sofi', guest: true, kind: 'human', skin: '#d99c74', hair: 'bun', hairColor: '#4a2f1c', shirt: '#8db3a9', accent: '#c5381f', neck: 'collar', extras: ['glasses'], lashes: true, face: 'round', scene: 'candy' },
].map((c) => ({ ...c, agent: c.kind === 'agent' }))

// ── EL GUION ─────────────────────────────────────────────────────────────────────────────────────
// Lo que se dicen, en orden; vuelve a empezar al terminar. Entre línea y línea, cada uno teclea o piensa.
const SCRIPT = [
  ['duncan', '¿Alguien mira el 500 de preaprobación en qa?'],
  ['miguel', 'Yo. Luigi, ¿me traés los logs de la última hora?'],
  ['luigi', 'Van 14 errores, todos del mismo endpoint.'],
  ['d-bot1', 'Ese endpoint cambió en el despliegue de ayer.'],
  ['wario', 'Corro el caso en local para ver si se repite…'],
  ['wario', 'Se repite: falta un campo en la respuesta.'],
  ['duncan', 'Ok, lo arreglo yo. agente 2, armá la rama.'],
  ['d-bot2', 'Rama lista. ¿Le paso el caso de prueba?'],
  ['miguel', 'Sí, el de Pullman. Lo dejo en el chat.'],
  ['luigi', 'Comprobado: con el arreglo pasa de punta a punta.'],
  ['duncan', '🚀 Listo, lo subo a qa.'],
]

// ── LOS PAISAJES DE PAPEL ────────────────────────────────────────────────────────────────────────
// Cada recuadro es una escena de capas recortadas (viewBox 400×300), con la paleta de papel: verde azulado,
// crema, rojo y naranja. Cada capa lleva su sombra (.cut), y eso es lo que la hace papel.
const P = { ink: '#13323a', deep: '#1d4a54', teal: '#2b6670', soft: '#4f8b8a', sage: '#8db3a9', cream: '#f1e4c7', red: '#c5381f', redDeep: '#962b19', orange: '#e5592a', amber: '#f08c3d',
  yellow: '#f2c14e', pink: '#ee8f8f', rose: '#d9667a', lilac: '#9b8ec7', plum: '#5e3b6b', sky: '#78b4d0', navy: '#24406b', grass: '#7fae6a', forest: '#3f6f4a' }
const cloud = (x, y, s, fill) => `<g class="cut"><path transform="translate(${x} ${y}) scale(${s})" d="M0 40 q4-26 30-22 q10-24 38-16 q22-14 40 8 q26-2 28 30 Z" fill="${fill}"/></g>`
const sun = (x, y, r, rings) => `<g class="cut">${rings.map((c, i) => `<circle cx="${x}" cy="${y}" r="${r * (1 - i * .22)}" fill="${c}"/>`).join('')}</g>`
const wave = (y, amp, fill, phase = 0) => `<g class="cut"><path d="M-10 ${y} C${60 + phase} ${y - amp} ${130 + phase} ${y + amp} 200 ${y} S${340 - phase} ${y - amp} 410 ${y + 4} V310 H-10Z" fill="${fill}"/></g>`
// rayos de sol: cuñas alternadas desde un centro
const rays = (x, y, n, c1, c2) => `<g>${Array.from({ length: n }, (_, i) => { const a0 = (i / n) * Math.PI * 2, a1 = ((i + .5) / n) * Math.PI * 2; return `<path d="M${x} ${y} L${x + 600 * Math.cos(a0)} ${y + 600 * Math.sin(a0)} L${x + 600 * Math.cos(a1)} ${y + 600 * Math.sin(a1)}Z" fill="${i % 2 ? c1 : c2}"/>` }).join('')}</g>`
const stars = (fill, pts) => `<g class="cut-soft">${pts.map(([x, y, r]) => `<path d="M${x} ${y - r} l${r * .3} ${r * .7} l${r * .7} ${r * .3} l${-r * .7} ${r * .3} l${-r * .3} ${r * .7} l${-r * .3} ${-r * .7} l${-r * .7} ${-r * .3} l${r * .7} ${-r * .3}Z" fill="${fill}"/>`).join('')}</g>`
const confetti = (cols, n, seed) => { let s = '', k = seed; for (let i = 0; i < n; i++) { k = (k * 9301 + 49297) % 233280; const x = (k / 233280) * 400; k = (k * 9301 + 49297) % 233280; const y = (k / 233280) * 170; s += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${3 + (i % 3) * 2}" fill="${cols[i % cols.length]}"/>` } return `<g class="cut-soft">${s}</g>` }
const SCENES = {
  sunset: () => `<rect width="400" height="300" fill="${P.amber}"/>${rays(320, 70, 16, P.yellow, P.amber)}${sun(320, 70, 66, [P.redDeep, P.red, P.orange, P.yellow])}${cloud(10, 40, 1.1, P.cream)}${cloud(250, 140, .9, P.pink)}${wave(228, 26, P.plum)}${wave(254, 22, P.rose, 30)}${wave(282, 16, P.red, 10)}`,
  clouds: () => `<rect width="400" height="300" fill="${P.sky}"/>${cloud(-20, 10, 1.6, P.cream)}${cloud(260, 40, 1.2, P.pink)}${cloud(-30, 140, 1.4, P.lilac)}${stars(P.yellow, [[330, 150, 12], [70, 120, 9], [290, 30, 8]])}${wave(248, 22, P.navy)}${wave(276, 14, P.deep, 40)}`,
  hills: () => `<rect width="400" height="300" fill="${P.yellow}"/>${rays(70, 80, 14, P.cream, P.yellow)}${sun(70, 80, 46, [P.orange, P.amber])}${cloud(270, 30, 1, P.cream)}${wave(212, 30, P.grass)}${wave(242, 24, P.forest, 40)}${wave(274, 16, P.teal, 10)}`,
  sun: () => `<rect width="400" height="300" fill="${P.lilac}"/>${confetti([P.yellow, P.pink, P.cream, P.sky], 16, 7)}${sun(330, 70, 76, [P.plum, P.rose, P.pink, P.yellow])}${cloud(0, 60, 1.2, P.cream)}${wave(238, 24, P.navy)}${wave(268, 18, P.rose, 30)}`,
  waves: () => `<rect width="400" height="300" fill="${P.teal}"/>${stars(P.cream, [[60, 40, 10], [340, 120, 8], [180, 24, 7]])}${cloud(260, 20, 1.3, P.pink)}${cloud(-10, 90, 1, P.sky)}${wave(198, 26, P.navy)}${wave(230, 22, P.sky, 30)}${wave(260, 18, P.sage, 10)}${wave(286, 12, P.yellow, 40)}`,
  dusk: () => `<rect width="400" height="300" fill="${P.plum}"/>${stars(P.yellow, [[300, 40, 11], [360, 110, 7], [210, 70, 6], [150, 30, 8]])}${sun(70, 90, 56, [P.rose, P.pink, P.cream])}${cloud(250, 120, .9, P.lilac)}${wave(232, 26, P.navy)}${wave(262, 18, P.rose, 30)}${wave(288, 12, P.amber, 10)}`,
  garden: () => `<rect width="400" height="300" fill="${P.pink}"/>${confetti([P.cream, P.yellow, P.rose], 14, 3)}${sun(320, 80, 52, [P.amber, P.yellow])}${cloud(20, 30, 1.1, P.cream)}${wave(220, 28, P.grass)}${wave(252, 20, P.forest, 30)}${wave(280, 14, P.yellow, 10)}`,
  ocean: () => `<rect width="400" height="300" fill="${P.navy}"/>${rays(200, 320, 18, P.navy, P.deep)}${sun(90, 70, 44, [P.cream, P.yellow])}${stars(P.cream, [[300, 50, 9], [350, 140, 6], [240, 110, 7]])}${wave(226, 24, P.sky)}${wave(254, 20, P.teal, 30)}${wave(280, 14, P.sage, 10)}`,
  candy: () => `<rect width="400" height="300" fill="${P.sage}"/>${rays(200, 100, 20, P.sage, P.cream)}${cloud(10, 100, 1.2, P.pink)}${cloud(270, 40, 1.1, P.lilac)}${wave(232, 24, P.rose)}${wave(262, 18, P.orange, 30)}${wave(286, 12, P.plum, 10)}`,
}

// ── LOS PERSONAJES, EN PAPEL ─────────────────────────────────────────────────────────────────────
// Caricaturas originales del torso para arriba: cabeza grande, hombros chicos. Todos son personas; los agentes
// llevan un prendedor de chispa en el pecho. Cada pieza es una capa con sombra.
// La cara es la misma maquinaria para todos: ojos con pupila (.pupils), cejas (.brow-l / .brow-r) y cuatro bocas
// (.m-smile, .m-talk, .m-think, .m-flat); el CSS elige cuál se ve y adónde miran según el estado del recuadro. La
// cabeza (.head) y el cuerpo (.body) se balancean por separado, poquito, como un títere de recortes.
const shade = (hex, f) => {
  const n = parseInt(hex.slice(1), 16)
  const ch = (v) => Math.max(0, Math.min(255, Math.round(v * f)))
  return `rgb(${ch(n >> 16)},${ch((n >> 8) & 255)},${ch(n & 255)})`
}
const cut = (inner) => `<g class="cut">${inner}</g>`
const soft = (inner) => `<g class="cut-soft">${inner}</g>`
const r1 = (n) => Math.round(n * 10) / 10

// LA GEOMETRÍA DE LA CABEZA. El pelo se arma sobre la misma elipse de la cara (agrandada un poco), así abraza el
// contorno en vez de flotar encima: pt() da un punto de la elipse por ángulo (270° es arriba, 180° la izquierda).
const HEAD = { cx: 200, cy: 146 }
const pt = (h, deg, pad = 0) => { const a = (deg * Math.PI) / 180; return [r1(h.cx + (h.rx + pad) * Math.cos(a)), r1(h.cy + (h.ry + pad) * Math.sin(a))] }
// un arco sobre la elipse, de a0 a a1 grados (sentido horario en pantalla), como «L x y L x y…»
const arc = (h, a0, a1, pad = 0, step = 6) => { const out = []; for (let a = a0; a1 > a0 ? a <= a1 : a >= a1; a += a1 > a0 ? step : -step) out.push(pt(h, a, pad)); out.push(pt(h, a1, pad)); return out.map(([x, y]) => `L${x} ${y}`).join(' ') }
const M = ([x, y]) => `M${x} ${y}`

// LOS PEINADOS. back va detrás de la cabeza (la melena que cae a los costados), front encima de la frente.
// Cada front es un casquete que sigue la elipse por arriba y termina en un flequillo con su propia forma.
const HAIR = {
  // corto con raya: casquete y un mechón que cruza la frente en diagonal
  side: (h, c) => ({
    front: `<path d="${M(pt(h, 172, 8))} ${arc(h, 172, 368, 8)} Q${h.cx + h.rx * .55} ${h.cy - h.ry * .2} ${h.cx + h.rx * .1} ${h.cy - h.ry * .52} Q${h.cx - h.rx * .45} ${h.cy - h.ry * .62} ${pt(h, 186, 2).join(' ')}Z" fill="${c}"/>
      <path d="M${h.cx + h.rx * .08} ${h.cy - h.ry - 6} q-10 22 -2 40" stroke="${shade(c, 1.35)}" stroke-width="5" fill="none" stroke-linecap="round"/>`,
  }),
  // corto texturado: casquete con puntas suaves en el borde
  crop: (h, c) => {
    const tips = [200, 218, 236, 254, 272, 290, 308, 326, 344].map((a, i) => { const o = pt(h, a, 26 + (i % 2) * 8), m = pt(h, a + 9, 6); return `L${o.join(' ')} L${m.join(' ')}` }).join(' ')
    return { front: `<path d="${M(pt(h, 180, 6))} ${tips} ${arc(h, 352, 360, 6)} Q${h.cx + h.rx * .5} ${h.cy - h.ry * .45} ${h.cx} ${h.cy - h.ry * .5} Q${h.cx - h.rx * .5} ${h.cy - h.ry * .45} ${pt(h, 180, 4).join(' ')}Z" fill="${c}"/>` }
  },
  // melena recta con flequillo hasta las cejas
  bob: (h, c) => ({
    back: `<path d="${M(pt(h, 160, 16))} ${arc(h, 160, 380, 16)} L${h.cx + h.rx + 14} ${h.cy + h.ry * .75} Q${h.cx + h.rx} ${h.cy + h.ry * .95} ${h.cx + h.rx * .62} ${h.cy + h.ry * .8} L${h.cx - h.rx * .62} ${h.cy + h.ry * .8} Q${h.cx - h.rx} ${h.cy + h.ry * .95} ${h.cx - h.rx - 14} ${h.cy + h.ry * .75}Z" fill="${c}"/>`,
    front: `<path d="${M(pt(h, 178, 10))} ${arc(h, 178, 362, 10)} L${h.cx + h.rx * .92} ${h.cy - h.ry * .3} Q${h.cx} ${h.cy - h.ry * .42} ${h.cx - h.rx * .92} ${h.cy - h.ry * .3}Z" fill="${c}"/>`,
  }),
  // largo ondulado, con raya al medio
  long: (h, c) => ({
    back: `<path d="${M(pt(h, 150, 18))} ${arc(h, 150, 390, 18)} C${h.cx + h.rx + 40} ${h.cy + h.ry * .8} ${h.cx + h.rx - 10} ${h.cy + h.ry * 1.2} ${h.cx + h.rx + 20} ${h.cy + h.ry * 1.8} L${h.cx - h.rx - 20} ${h.cy + h.ry * 1.8} C${h.cx - h.rx + 10} ${h.cy + h.ry * 1.2} ${h.cx - h.rx - 40} ${h.cy + h.ry * .8} ${pt(h, 150, 18).join(' ')}Z" fill="${c}"/>`,
    front: `<path d="${M(pt(h, 176, 9))} ${arc(h, 176, 364, 9)} Q${h.cx + h.rx * .7} ${h.cy - h.ry * .7} ${h.cx + 4} ${h.cy - h.ry * .9} Q${h.cx - h.rx * .7} ${h.cy - h.ry * .7} ${pt(h, 176, 4).join(' ')}Z" fill="${c}"/>`,
  }),
  // rizos: bolitas sobre la línea del cráneo
  curly: (h, c) => {
    const puffs = (pad, r, from, to, step) => { let s = ''; for (let a = from; a <= to; a += step) { const [x, y] = pt(h, a, pad); s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>` } return s }
    return { back: puffs(14, 26, 160, 380, 20), front: puffs(4, 20, 200, 340, 20) + `<path d="${M(pt(h, 196, 4))} ${arc(h, 196, 344, 4)} Q${h.cx} ${h.cy - h.ry * .5} ${pt(h, 196, 4).join(' ')}Z" fill="${c}"/>` }
  },
  // moño alto y peinado tirante
  bun: (h, c) => ({
    back: `<circle cx="${h.cx}" cy="${h.cy - h.ry - 22}" r="30" fill="${c}"/>`,
    front: `<path d="${M(pt(h, 182, 7))} ${arc(h, 182, 358, 7)} Q${h.cx + h.rx * .6} ${h.cy - h.ry * .62} ${h.cx} ${h.cy - h.ry * .72} Q${h.cx - h.rx * .6} ${h.cy - h.ry * .62} ${pt(h, 182, 4).join(' ')}Z" fill="${c}"/>
      <path d="M${h.cx - 30} ${h.cy - h.ry - 30} q30 -14 60 0" stroke="${shade(c, 1.35)}" stroke-width="5" fill="none" stroke-linecap="round"/>`,
  }),
  // rapado: casquete fino y oscuro
  buzz: (h, c) => ({ front: `<path d="${M(pt(h, 188, 4))} ${arc(h, 188, 352, 4)} Q${h.cx} ${h.cy - h.ry * .62} ${pt(h, 188, 2).join(' ')}Z" fill="${c}"/>` }),
  // gorro de lana sobre la cabeza
  beanie: (h, c) => ({
    front: `<path d="${M(pt(h, 186, 12))} ${arc(h, 186, 354, 12)}Z" fill="${c}"/><circle cx="${h.cx}" cy="${h.cy - h.ry - 14}" r="16" fill="${shade(c, 1.25)}"/>
      <path d="${M(pt(h, 186, 14))} ${arc(h, 186, 354, 14)} L${pt(h, 354, 14)[0]} ${pt(h, 354, 14)[1] + 26} ${arc(h, 354, 186, 12).replace(/L([\d.]+) ([\d.]+)/g, (m, x, y) => `L${x} ${r1(+y + 26)}`)}Z" fill="${shade(c, .8)}"/>`,
  }),
}

// Lo que se pone encima: lentes, audífonos, aretes, barba, pecas.
const EXTRAS = {
  glasses: (p, h) => `<g class="cut-soft" fill="none" stroke="#13323a" stroke-width="6"><rect x="${h.cx - 64}" y="${h.cy - 22}" width="54" height="46" rx="${p.glassesRound ? 23 : 14}"/><rect x="${h.cx + 10}" y="${h.cy - 22}" width="54" height="46" rx="${p.glassesRound ? 23 : 14}"/><path d="M${h.cx - 10} ${h.cy - 2} h20"/></g>`,
  headphones: (p, h) => `<g class="cut"><path d="${M(pt(h, 180, 20))} ${arc(h, 180, 360, 20)}" fill="none" stroke="${p.gear}" stroke-width="13" stroke-linecap="round"/><rect x="${h.cx - h.rx - 22}" y="${h.cy - 14}" width="30" height="54" rx="13" fill="${p.gear}"/><rect x="${h.cx + h.rx - 8}" y="${h.cy - 14}" width="30" height="54" rx="13" fill="${p.gear}"/></g>`,
  earrings: (p, h) => `<g class="cut-soft"><circle cx="${h.cx - h.rx - 2}" cy="${h.cy + 34}" r="9" fill="none" stroke="${p.gear}" stroke-width="5"/><circle cx="${h.cx + h.rx + 2}" cy="${h.cy + 34}" r="9" fill="none" stroke="${p.gear}" stroke-width="5"/></g>`,
  beard: (p, h) => `<g class="cut-soft"><path d="${M(pt(h, 170, 2))} ${arc(h, 170, 10, 2)} Q${h.cx + h.rx * .55} ${h.cy + h.ry * .35} ${h.cx + 22} ${h.cy + h.ry * .42} Q${h.cx} ${h.cy + h.ry * .34} ${h.cx - 22} ${h.cy + h.ry * .42} Q${h.cx - h.rx * .55} ${h.cy + h.ry * .35} ${pt(h, 170, 2).join(' ')}Z" fill="${p.hairColor}"/></g>`,
  freckles: (p, h) => [[-52, 36], [-42, 44], [-32, 36], [32, 36], [42, 44], [52, 36]].map(([x, y]) => `<circle cx="${h.cx + x}" cy="${h.cy + y}" r="3" fill="#962b19" opacity=".5"/>`).join(''),
}

// La cara: ojos, cejas, nariz y las cuatro bocas. Es una caricatura: ojos grandes con pupila chica (más cómicos),
// cejas gruesas, narices de varias formas y, a quien le toca, dientes salidos.
//   f.eye: tamaño de ojo · f.nose: 'bulb' | 'long' | 'button' | 'hook' · f.teeth: 'buck' | 'grin' · f.lids: párpado caído
const NOSES = {
  bulb: (cx, cy, c) => `<ellipse cx="${cx}" cy="${cy + 22}" rx="20" ry="17" fill="${c}"/><ellipse cx="${cx - 6}" cy="${cy + 17}" rx="5" ry="4" fill="#fbf4e4" opacity=".55"/>`,
  long: (cx, cy, c) => `<path d="M${cx - 6} ${cy - 4} q-6 30 -14 40 q14 10 30 0 q-6 -16 -10 -40Z" fill="${c}"/>`,
  button: (cx, cy, c) => `<circle cx="${cx}" cy="${cy + 22}" r="11" fill="${c}"/>`,
  hook: (cx, cy, c) => `<path d="M${cx - 4} ${cy - 6} q30 18 18 42 q-10 8 -24 2 q10 -6 6 -12 q-12 -20 0 -32Z" fill="${c}"/>`,
}
function face(h, f) {
  const { cx, cy } = h, eyeY = cy - 2, gap = h.rx * .42, eye = f.eye || 25, mouthY = cy + h.ry * .56
  const L = cx - gap, R = cx + gap, pr = eye * .36
  const lash = f.lashes ? `<path d="M${L - eye * .8} ${eyeY - eye * .6} l-10 -8 M${L - eye * .5} ${eyeY - eye * .85} l-6 -10 M${R + eye * .8} ${eyeY - eye * .6} l10 -8 M${R + eye * .5} ${eyeY - eye * .85} l6 -10" stroke="#13323a" stroke-width="4" stroke-linecap="round"/>` : ''
  const lids = f.lids ? `<path d="M${L - eye} ${eyeY - 2} a${eye} ${eye} 0 0 1 ${eye * 2} 0Z M${R - eye} ${eyeY - 2} a${eye} ${eye} 0 0 1 ${eye * 2} 0Z" fill="${f.nose}"/>` : ''
  const teethTop = f.teeth === 'buck'
    ? `<rect x="${cx - 12}" y="${mouthY - 6}" width="11" height="15" rx="3" fill="#fbf4e4"/><rect x="${cx + 1}" y="${mouthY - 6}" width="11" height="15" rx="3" fill="#fbf4e4"/>`
    : f.teeth === 'grin' ? `<path d="M${cx - 26} ${mouthY - 5} h52 q-2 9 -8 13 h-36 q-6 -4 -8 -13Z" fill="#fbf4e4"/>` : ''
  return `
    <g class="eyes">${soft(`<ellipse cx="${L}" cy="${eyeY}" rx="${eye * .9}" ry="${eye}" fill="#fbf4e4"/><ellipse cx="${R}" cy="${eyeY}" rx="${eye * .9}" ry="${eye * 1.06}" fill="#fbf4e4"/>`)}
      <g class="pupils"><circle cx="${L + 3}" cy="${eyeY + 4}" r="${pr}" fill="#13323a"/><circle cx="${R - 3}" cy="${eyeY + 4}" r="${pr}" fill="#13323a"/>
        <circle cx="${L + 3 + pr * .4}" cy="${eyeY + 4 - pr * .4}" r="${pr * .32}" fill="#f6ecd6"/><circle cx="${R - 3 + pr * .4}" cy="${eyeY + 4 - pr * .4}" r="${pr * .32}" fill="#f6ecd6"/></g>
      ${lids}${lash}</g>
    <g class="brow-l">${soft(`<path d="M${L - 24} ${eyeY - eye - 6} q22 -18 44 -4 l-4 9 q-18 -10 -36 3Z" fill="${f.brow}"/>`)}</g>
    <g class="brow-r">${soft(`<path d="M${R + 24} ${eyeY - eye - 6} q-22 -18 -44 -4 l4 9 q18 -10 36 3Z" fill="${f.brow}"/>`)}</g>
    <g class="m-smile">${soft(`<path d="M${cx - 30} ${mouthY - 6} q30 34 60 0 q-30 14 -60 0Z" fill="#962b19"/>`)}${teethTop}</g>
    <g class="m-talk"><g class="mouth">${soft(`<ellipse cx="${cx}" cy="${mouthY + 4}" rx="20" ry="17" fill="#6e1f12"/><ellipse cx="${cx}" cy="${mouthY + 13}" rx="12" ry="6" fill="#e5592a"/>`)}${teethTop}</g></g>
    <g class="m-think">${soft(`<path d="M${cx - 16} ${mouthY + 4} q9 -9 18 0 q9 9 18 -3 l2 6 q-11 11 -21 1 q-8 -6 -15 2Z" fill="${f.mouth}"/>`)}</g>
    <g class="m-flat">${soft(`<path d="M${cx - 16} ${mouthY + 2} q16 -6 32 2 l-1 6 q-15 -6 -30 0Z" fill="${f.mouth}"/>`)}${f.teeth === 'buck' ? `<rect x="${cx - 7}" y="${mouthY + 4}" width="7" height="9" rx="2" fill="#fbf4e4"/><rect x="${cx + 1}" y="${mouthY + 4}" width="7" height="9" rx="2" fill="#fbf4e4"/>` : ''}</g>
    ${soft(NOSES[f.noseShape || 'button'](cx, cy, f.noseColor))}`
}

// El torso: hombros, cuello de la prenda y, en los agentes, el prendedor de chispa.
const NECKS = {
  crew: (p) => soft(`<path d="M162 236 q38 26 76 0 q-4 18 -38 22 q-34 -4 -38 -22Z" fill="${p.accent}"/>`),
  collar: (p) => soft(`<path d="M158 232 l42 30 l-26 14Z M242 232 l-42 30 l26 14Z" fill="${p.accent}"/>`),
  hoodie: (p) => soft(`<path d="M150 232 q50 40 100 0 q4 16 -8 22 q-42 24 -84 0 q-12 -6 -8 -22Z" fill="${shade(p.shirt, .8)}"/><path d="M186 254 v26 M214 254 v26" stroke="${p.accent}" stroke-width="5" stroke-linecap="round"/>`),
  turtle: (p) => soft(`<rect x="172" y="226" width="56" height="26" rx="10" fill="${shade(p.shirt, .85)}"/>`),
  cardigan: (p) => soft(`<path d="M168 234 l32 70 l32 -70 q-32 22 -64 0Z" fill="${p.accent}"/><circle cx="200" cy="282" r="4" fill="${shade(p.shirt, .7)}"/>`),
}
function torso(p) {
  return `<g class="body">
    ${cut(`<path d="M72 306 q6-74 128-78 q122 4 128 78Z" fill="${p.shirt}"/>`)}
    ${NECKS[p.neck || 'crew'](p)}
    ${p.agent ? soft(`<circle cx="268" cy="270" r="15" fill="#f1e4c7"/><path d="M268 258 l3.5 8.5 l8.5 3.5 l-8.5 3.5 l-3.5 8.5 l-3.5 -8.5 l-8.5 -3.5 l8.5 -3.5Z" fill="#e5592a"/>`) : ''}
  </g>`
}
// las manos aparecen abajo, tecleando, sólo mientras teclea
const handsAt = (c) => `<g class="hands">${soft(`<ellipse cx="146" cy="302" rx="26" ry="16" fill="${c}"/><ellipse cx="254" cy="302" rx="26" ry="16" fill="${c}"/>`)}</g>`

function person(p) {
  const s = p.skin, sh = shade(s, .86)
  const [rx, ry] = { round: [92, 88], wide: [100, 84], tall: [86, 94], soft: [94, 90] }[p.face || 'round']
  const h = { ...HEAD, rx, ry }
  const hair = HAIR[p.hair](h, p.hairColor)
  const has = (x) => p.extras?.includes(x)
  return `${torso(p)}
  <g class="head">
    ${cut(`<rect x="180" y="${h.cy + ry - 30}" width="40" height="46" rx="14" fill="${sh}"/>`)}
    ${hair.back ? cut(hair.back) : ''}
    ${cut(`<ellipse cx="${h.cx - rx + 2}" cy="${h.cy + 10}" rx="15" ry="19" fill="${sh}"/><ellipse cx="${h.cx + rx - 2}" cy="${h.cy + 10}" rx="15" ry="19" fill="${sh}"/>`)}
    ${has('earrings') ? EXTRAS.earrings(p, h) : ''}
    ${cut(`<ellipse cx="${h.cx}" cy="${h.cy}" rx="${rx}" ry="${ry}" fill="${s}"/>`)}
    <ellipse cx="${h.cx - rx * .6}" cy="${h.cy + 34}" rx="14" ry="8" fill="#e5592a" opacity=".32"/><ellipse cx="${h.cx + rx * .6}" cy="${h.cy + 34}" rx="14" ry="8" fill="#e5592a" opacity=".32"/>
    ${has('freckles') ? EXTRAS.freckles(p, h) : ''}
    ${has('beard') ? EXTRAS.beard(p, h) : ''}
    ${face(h, { brow: shade(p.hairColor, .8), nose: s, noseColor: shade(s, .8), noseShape: p.nose, eye: p.eye, teeth: p.teeth, lids: p.lids, mouth: has('beard') ? '#f1e4c7' : '#962b19', lashes: p.lashes })}
    ${cut(hair.front)}
    ${has('glasses') ? EXTRAS.glasses(p, h) : ''}
    ${has('headphones') ? EXTRAS.headphones(p, h) : ''}
  </g>${handsAt(s)}`
}

// ── LA GRILLA ────────────────────────────────────────────────────────────────────────────────────
const grid = document.getElementById('grid')
const people = CAST.map((c) => ({ ...c, state: 'typing', until: 0 }))
const STATE_LABEL = { typing: 'teclea', thinking: 'piensa', talking: 'habla', idle: 'escucha' }
const MIC = '<svg viewBox="0 0 24 24" fill="#f1e4c7"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0" stroke="#f1e4c7" stroke-width="2" fill="none"/><rect x="11" y="17" width="2" height="4"/></svg>'
for (const [i, p] of people.entries()) {
  const el = document.createElement('section')
  el.className = 'tile'
  el.setAttribute('aria-label', p.owner ? `${p.name}, agente de ${p.owner}` : p.guest ? `${p.name}, invitado de ejemplo` : p.name)
  el.innerHTML = `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${SCENES[p.scene]()}
      <g transform="translate(46 70) scale(.77)"><g class="avatar">${person(p)}</g></g></svg>
    <div class="think" aria-hidden="true">···</div>
    <span class="state"></span>
    <div class="nameplate"><span class="mic">${MIC}</span>${p.name}${p.owner ? ` <small>· ${p.owner}</small>` : p.guest ? ' <small>· invitado</small>' : ''}<span class="bars"><i></i><i></i><i></i></span></div>`
  // que no parpadeen todos a la vez
  el.style.setProperty('--d', `${-i * 1.7}s`)
  p.el = el
  grid.appendChild(el)
}

// ── QUIÉN HACE QUÉ ───────────────────────────────────────────────────────────────────────────────
let line = 0, nextLineAt = 1000, paused = false, t = 0
function setState(p, st) {
  p.state = st
  p.el.classList.toggle('talking', st === 'talking')
  p.el.classList.toggle('thinking', st === 'thinking')
  p.el.classList.toggle('typing', st === 'typing')
  p.el.classList.toggle('muted', st !== 'talking')
  const badge = p.el.querySelector('.state')
  badge.textContent = STATE_LABEL[st]; badge.className = `state ${st}`
}
function idleStates() {
  const nextWho = SCRIPT[line % SCRIPT.length][0]
  for (const p of people) {
    if (t < p.until) continue
    // el que va a hablar después se queda pensando antes
    if (p.id === nextWho) { setState(p, 'thinking'); p.until = nextLineAt; continue }
    const r = Math.random()
    setState(p, r < .55 ? 'typing' : r < .75 ? 'thinking' : 'idle')
    p.until = t + 1500 + Math.random() * 3500
  }
}
const captions = document.getElementById('captions'), log = document.getElementById('log')
const hhmm = (d) => d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })
let captionsOn = true, captionUntil = 0
function say() {
  const [who, text] = SCRIPT[line % SCRIPT.length]
  line++
  const p = people.find((x) => x.id === who)
  setState(p, 'talking'); p.until = t + 2600 + text.length * 40
  captions.innerHTML = '<b></b><span></span>'
  captions.querySelector('b').textContent = p.name
  captions.querySelector('span').textContent = text
  captions.classList.toggle('on', captionsOn); captionUntil = p.until
  const el = document.createElement('div')
  el.className = 'msg'
  el.innerHTML = `<b style="color:${shade(p.shirt, .8)}"></b><time>${hhmm(new Date())}</time><p></p>`
  el.querySelector('b').textContent = p.owner ? `${p.name} (de ${p.owner})` : p.name
  el.querySelector('p').textContent = text
  log.appendChild(el)
  while (log.children.length > 60) log.firstChild.remove()
  log.scrollTop = log.scrollHeight
  nextLineAt = t + 3600 + Math.random() * 2200
}

const listEl = document.getElementById('people')
function drawPeople() {
  listEl.innerHTML = people.map((p) => `<li class="${p.state}"><span class="dot" style="background:${p.shirt}"></span>
    <span>${p.name}${p.owner ? ` <small>agente de ${p.owner}</small>` : p.guest ? ' <small>invitado de ejemplo</small>' : ''}</span><span class="st">${STATE_LABEL[p.state]}</span></li>`).join('')
}

// El reloj de la llamada: pasos de 100 ms, pausable. Con la pestaña oculta el navegador lo frena, y está bien.
setInterval(() => {
  if (!paused) {
    t += 100
    if (t > nextLineAt) say()
    idleStates()
    if (t > captionUntil) captions.classList.remove('on')
  }
  drawPeople()
  document.getElementById('clock').textContent = hhmm(new Date())
}, 100)

document.getElementById('room-title').textContent = ROOM.title
document.getElementById('room-count').textContent = `${CAST.filter((c) => c.kind === 'human').length} personas · ${CAST.filter((c) => c.kind === 'agent').length} agentes`
document.getElementById('who-count').textContent = CAST.length
document.getElementById('pause').addEventListener('click', (e) => {
  paused = !paused
  const b = e.currentTarget
  b.setAttribute('aria-pressed', String(paused)); b.title = paused ? 'Seguir' : 'Pausar'; b.setAttribute('aria-label', b.title)
  document.getElementById('app').classList.toggle('paused', paused)
})
document.getElementById('cc').addEventListener('click', (e) => {
  captionsOn = !captionsOn
  e.currentTarget.setAttribute('aria-pressed', String(captionsOn))
  if (!captionsOn) captions.classList.remove('on')
})
people.forEach((p) => setState(p, 'typing'))
</script>
</body>
</html>
