<!doctype html>
<html lang="es" data-style="panels">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office</title>
<!--
  OFFICE — la sala donde se VE cómo trabajan las personas y sus agentes, en pixel art.
  Por ahora es sólo la parte visual: lo que dicen sale de un guion de ejemplo (SCRIPT), no del chat real.
  Una sala = una conversación del chat del equipo; cada participante, un muñeco en su escritorio.
  Para cambiar quiénes están: CAST. La sala es isométrica: pisos, paredes y muebles son de PtDesigns
  (CC0, assets/tiles y assets/props, con su LICENSE); los muñecos los dibuja este archivo. El lienzo va a
  la escala de los muebles (256 px por baldosa, las baldosas de 128 al doble) y se achica para entrar;
  los nombres, globos y la conversación van en HTML encima, para que el texto se lea nítido.
-->
<style>
  :root {
    --canvas: #0e0f13; --card: #17181d; --line: #262833; --text: #e7e7ea; --dim: #8b8d98;
    --accent: #f5a524; --ok: #3fb950;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--canvas); color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; height: 100%; padding: 8px; }
  .region { background: var(--card); border: 1px solid var(--line); border-radius: 10px; min-height: 0;
    display: flex; flex-direction: column; overflow: hidden; }
  .region > header { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    border-bottom: 1px solid var(--line); font-size: 12px; }
  .region > header .count { color: var(--dim); }
  .stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
  .scene { position: relative; }
  .scene canvas { display: block; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .tag, .bubble { position: absolute; transform: translateX(-50%); white-space: nowrap;
    font-family: "Silkscreen", ui-monospace, Menlo, monospace; }
  .tag { transform: translate(-50%, -100%); font-size: 11px; padding: 1px 6px; border-radius: 3px; background: rgba(10, 11, 15, .78); color: var(--text); }
  .tag .who { opacity: .65; }
  .bubble { bottom: auto; max-width: 220px; white-space: normal; text-align: left; font-size: 12px; line-height: 1.25;
    background: #f4f1e8; color: #1b1b1f; padding: 5px 8px; border: 2px solid #1b1b1f; border-radius: 2px;
    transform: translate(-50%, -100%); box-shadow: 3px 3px 0 rgba(0, 0, 0, .35); animation: pop .18s steps(3); }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -4px; border: 4px solid transparent;
    border-top-color: #1b1b1f; }
  .bubble.think { background: #dfe7f5; font-style: italic; }
  @keyframes pop { from { transform: translate(-50%, -100%) scale(.6); } to { transform: translate(-50%, -100%) scale(1); } }

  .roster { list-style: none; margin: 0; padding: 8px; display: grid; gap: 2px; border-bottom: 1px solid var(--line); }
  .roster li { display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; }
  .roster .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .roster .name small { color: var(--dim); margin-left: 4px; }
  .roster .state { color: var(--dim); font-size: 12px; }
  .roster .state.talking { color: var(--accent); }
  .roster .state.typing { color: var(--ok); }
  .log { flex: 1; min-height: 0; overflow: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; }
  .log .msg { display: grid; gap: 1px; }
  .log .msg b { font-weight: 600; font-size: 12px; }
  .log .msg time { color: var(--dim); font-size: 11px; margin-left: 6px; font-weight: 400; }
  .log .msg span { color: var(--text); }
  .statusbar { grid-column: 1 / -1; height: 30px; display: flex; align-items: center; gap: 16px; padding: 0 12px;
    color: var(--dim); font-size: 12px; }
  .statusbar button { all: unset; cursor: pointer; color: var(--text); }
  .statusbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: minmax(260px, 1fr) minmax(200px, 40%) auto; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <section class="region" aria-label="La sala">
    <header><span id="room-title">Sala</span><span class="count" id="room-count"></span></header>
    <div class="stage" id="stage">
      <div class="scene" id="scene">
        <canvas id="cv" width="1576" height="1118" aria-label="La oficina en pixel art: cada persona y sus agentes en su escritorio"></canvas>
        <div class="overlay" id="overlay"></div>
      </div>
    </div>
  </section>
  <aside class="region" aria-label="Quiénes están y qué dicen">
    <header><span>En la sala</span><span class="count" id="who-count"></span></header>
    <ul class="roster" id="roster"></ul>
    <header><span>Conversación</span><span class="count">guion de ejemplo</span></header>
    <div class="log" id="log" aria-live="polite"></div>
  </aside>
  <footer class="statusbar">
    <span id="clock"></span>
    <span>sólo visual: lo que dicen es un guion, no el chat real</span>
    <span style="flex:1"></span>
    <button type="button" id="pause" aria-pressed="false">pausar</button>
  </footer>
</div>

<script>
// ── QUIÉNES ESTÁN ────────────────────────────────────────────────────────────────────────────────
// kind: 'human' | 'agent'. owner: de quién es el agente. desk: la celda (u, v) de su escritorio. Los agentes
// de Duncan van con nombre genérico hasta saber cómo se llaman.
const ROOM = { title: 'Sala · chat de Duncan' }
const CAST = [
  { id: 'd-bot1', name: 'agente 1', owner: 'Duncan', kind: 'agent', desk: [1, 1], body: '#5b7fd1', light: '#9ff0ff' },
  { id: 'duncan', name: 'Duncan', kind: 'human', desk: [3, 1], hair: '#2b1d14', skin: '#c68a5e', shirt: '#3a6ea5' },
  { id: 'd-bot2', name: 'agente 2', owner: 'Duncan', kind: 'agent', desk: [5, 1], body: '#7d68c9', light: '#ffe29a' },
  { id: 'luigi', name: 'Luigi', owner: 'Miguel', kind: 'agent', desk: [1, 3], body: '#3ca66b', light: '#c6ffb0' },
  { id: 'miguel', name: 'Miguel', kind: 'human', desk: [3, 3], hair: '#1a1410', skin: '#e0ac7e', shirt: '#2f8f5b' },
  { id: 'wario', name: 'Wario', owner: 'Miguel', kind: 'agent', desk: [5, 3], body: '#d9a227', light: '#fff1a8' },
]

// ── EL GUION ─────────────────────────────────────────────────────────────────────────────────────
// Lo que se dicen, en orden; vuelve a empezar al terminar. Entre línea y línea, cada uno teclea o piensa.
const SCRIPT = [
  ['duncan', '¿Alguien mira el 500 de preaprobación en qa?'],
  ['miguel', 'Yo. Luigi, ¿me traés los logs de la última hora?'],
  ['luigi', 'Van 14 errores, todos del mismo endpoint.'],
  ['d-bot1', 'Ese endpoint cambió en el despliegue de ayer.'],
  ['wario', 'Corro el caso en local para ver si se repite…'],
  ['wario', 'Se repite: falta un campo en la respuesta.'],
  ['duncan', 'Ok, lo arreglo yo. agente 2, armá la rama.'],
  ['d-bot2', 'Rama lista. ¿Le paso el caso de prueba?'],
  ['miguel', 'Sí, el de Pullman. Lo dejo en el chat.'],
  ['luigi', 'Comprobado: con el arreglo pasa de punta a punta.'],
  ['duncan', '🚀 Listo, lo subo a qa.'],
]

// ── LA GEOMETRÍA ISOMÉTRICA ──────────────────────────────────────────────────────────────────────
// La fórmula es la del README de Cozy Shops Foundations, al doble: la esquina de arriba de la celda (u, v)
// cae en (OX + 128(u − v), OY + 64(u + v)); una baldosa ocupa 264×392 y su origen está en (132, 260).
const U = 7, V = 5
const W = 1576, H = 1118, OX = 128 * V + 20, OY = 290
const cv = document.getElementById('cv'), g = cv.getContext('2d')
const iso = (u, v) => ({ x: OX + 128 * (u - v), y: OY + 64 * (u + v) })

const TILES = ['floor_timber_clean', 'floor_timber_aged', 'floor_timber_stained', 'wall_primary_u', 'wall_primary_v', 'wall_window_u',
  'wall_doorway_v', 'door_closed_v', 'corner_pilaster', 'foundation_edge_u', 'foundation_edge_v']
// Los muebles: su archivo y el pivote (el punto que apoya en el piso), de su manifest.json.
const PROPS = {
  desk: ['01_computer_desk', 86, 142], chair: ['02_swivel_office_chair', 62, 165], keyboard: ['06_keyboard_mouse_set', 30, 36],
  tv: ['07_widescreen_television', 63, 113], router: ['10_wireless_router', 23, 41], fan: ['12_tabletop_fan', 30, 61],
  floorLamp: ['13_brass_floor_lamp', 42, 208], deskLamp: ['14_adjustable_desk_lamp', 27, 65], clock: ['15_round_wall_clock', 26, 49],
  alarm: ['16_twin_bell_alarm_clock', 17, 35], plant: ['18_potted_monstera', 62, 123], headphones: ['21_headphones_on_stand', 23, 46],
  phone: ['22_smartphone_charging_dock', 17, 35], radio: ['24_portable_radio', 23, 45],
}
const img = {}
const load = (key, src) => new Promise((ok) => { const i = new Image(); i.onload = () => { img[key] = i; ok() }; i.onerror = () => ok(); i.src = src })

function tile(name, u, v) {
  const i = img[name]; if (!i) return
  const p = iso(u, v)
  g.drawImage(i, p.x - 132, p.y - 260, 264, 392)
}
// Un mueble apoyado en el punto (u, v) del piso (no hace falta que sea entero); lift lo sube (colgado de la pared o
// encima de una mesa).
function prop(name, u, v, lift = 0) {
  const [file, cx, cy] = PROPS[name]; const i = img[file]; if (!i) return
  const p = iso(u, v)
  g.drawImage(i, Math.round(p.x - cx), Math.round(p.y - cy - lift))
}

// ── LOS MUÑECOS ──────────────────────────────────────────────────────────────────────────────────
// Un sprite es una lista de filas; cada letra es un color de la paleta, '.' es transparente. Van a 4 px por pixel.
const PX = 4
function sprite(rows, pal, x, y) {
  rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const c = pal[row[i]]; if (c) { g.fillStyle = c; g.fillRect(x + i * PX, y + j * PX, PX, PX) } } })
}
const HUMAN = [
  '...hhhhhh...',
  '..hhhhhhhh..',
  '.hhhhhhhhhh.',
  '.hhssssssh..',
  '.hssssssssh.',
  '..sseessees.',
  '..ssssssss..',
  '..sssmmsss..',
  '...ssssss...',
  '....ssss....',
  '..cccccccc..',
  '.cccccccccc.',
  'cccccwwccccc',
  'cccccccccccc',
  'cccccccccccc',
]
const AGENT = [
  '.....a......',
  '.....A......',
  '..gggggggg..',
  '.gddddddddg.',
  '.gddddddddg.',
  '.gdLLddLLdg.',
  '.gddddddddg.',
  '.gdddmmdddg.',
  '..gggggggg..',
  '....gggg....',
  '..bbbbbbbb..',
  '.bbbbbbbbbb.',
  'bbbbbkkbbbbb',
  'bbbbbbbbbbbb',
  'bbbbbbbbbbbb',
]
const shade = (hex, f) => {
  const n = parseInt(hex.slice(1), 16)
  const ch = (v) => Math.max(0, Math.min(255, Math.round(v * f)))
  return `rgb(${ch(n >> 16)},${ch((n >> 8) & 255)},${ch(n & 255)})`
}

// Dónde va cada cosa de un puesto: el escritorio en el centro de su celda, la silla y la persona detrás
// (hacia arriba en la pantalla), mirando hacia acá.
const DESK_TOP = 72 // a qué altura del piso queda la tabla del escritorio, en pixeles de la escena
const seat = (p) => { const [u, v] = p.desk; return { du: u + .5, dv: v + .5, su: u + .2, sv: v + .1 } }
function head(p) { const s = seat(p); const q = iso(s.su, s.sv); return { x: q.x, y: q.y - 150 } }

function person(p, t) {
  const s = seat(p)
  const q = iso(s.su, s.sv)
  const st = p.state
  const bob = st === 'talking' && Math.floor(t / 160) % 2 ? -PX : 0
  const x = q.x - 6 * PX, y = q.y - 150 + bob
  if (p.kind === 'human') {
    const blink = Math.floor((t + p.phase) / 120) % 33 === 0
    sprite(HUMAN, { h: p.hair, s: p.skin, e: blink ? p.skin : '#1b1b1f', m: st === 'talking' && Math.floor(t / 120) % 2 ? '#7a2e2e' : shade(p.skin, .8), c: p.shirt, w: shade(p.shirt, 1.3) }, x, y)
  } else {
    const eye = st === 'thinking' ? (Math.floor(t / 200) % 2 ? p.light : '#1b1b1f') : p.light
    const blink = Math.floor((t + p.phase) / 110) % 29 === 0
    sprite(AGENT, { a: shade(p.body, .7), A: Math.floor(t / 300) % 2 ? p.light : shade(p.body, .7), g: shade(p.body, .7), d: '#1d2230', L: blink ? '#1d2230' : eye,
      m: st === 'talking' && Math.floor(t / 120) % 2 ? p.light : '#3a4256', b: p.body, k: shade(p.body, 1.25) }, x, y)
  }
}

// Las manos van encima de la tabla: teclean (se alternan) o descansan.
function hands(p, t) {
  const s = seat(p)
  const q = iso(s.du - .12, s.dv - .12)
  const skin = p.kind === 'human' ? p.skin : shade(p.body, .7)
  const typing = p.state === 'typing'
  const alt = Math.floor((t + p.phase) / 90) % 2
  const y = q.y - DESK_TOP - 6
  g.fillStyle = skin
  g.fillRect(q.x - 22, y - (typing && alt ? 4 : 0), 10, 7)
  g.fillRect(q.x + 12, y - (typing && !alt ? 4 : 0), 10, 7)
}

// Lo que tiene cada uno en su escritorio, para que no sean seis iguales.
const DESK_ITEMS = {
  duncan: [['deskLamp', -.25, .15], ['alarm', .3, -.05]], miguel: [['deskLamp', -.25, .15], ['phone', .3, -.05]],
  'd-bot1': [['router', .3, -.05]], 'd-bot2': [['headphones', .3, -.05]], luigi: [['radio', .3, -.05]], wario: [['fan', .3, -.08]],
}
function station(p, t) {
  const s = seat(p)
  prop('chair', s.su + .02, s.sv + .02)
  person(p, t)
  prop('desk', s.du, s.dv)
  prop('keyboard', s.du - .08, s.dv - .08, DESK_TOP)
  for (const [name, du, dv] of DESK_ITEMS[p.id] || []) prop(name, s.du + du, s.dv + dv, DESK_TOP)
  hands(p, t)
}

// ── LA SALA ──────────────────────────────────────────────────────────────────────────────────────
const FLOOR_VARIANT = (u, v) => ['floor_timber_clean', 'floor_timber_aged', 'floor_timber_clean', 'floor_timber_stained'][(u * 7 + v * 3) % 4]
function roomBack() {
  for (let d = 0; d < U + V; d++) for (let u = 0; u < U; u++) { const v = d - u; if (v >= 0 && v < V) tile(FLOOR_VARIANT(u, v), u, v) }
  for (let k = 0; k < U; k++) tile(k === 1 || k === 5 ? 'wall_window_u' : 'wall_primary_u', k, 0)
  for (let k = 0; k < V; k++) tile(k === 2 ? 'wall_doorway_v' : 'wall_primary_v', 0, k)
  tile('door_closed_v', 0, 2)
  tile('corner_pilaster', 0, 0)
  // la tele de la sala, colgada de la pared de atrás, y el reloj
  prop('tv', 3.1, 0.08, 120)
  prop('clock', 4.3, 0.06, 175)
}
function roomFront() {
  for (let k = 0; k < U; k++) tile('foundation_edge_u', k, V)
  for (let k = 0; k < V; k++) tile('foundation_edge_v', U, k)
}
// Lo que se para en el piso, además de los puestos: plantas y lámparas.
const DECOR = [['plant', .6, .6], ['plant', 6.4, .6], ['floorLamp', .5, 4.4], ['plant', 6.4, 4.3]]

// La conversación en la pantalla de la tele: rayitas de colores sobre el plano inclinado de la pared.
function tvLines() {
  const p = iso(3.1, 0.08)
  const x0 = p.x - 44, y0 = p.y - 120 - 92
  shownLines.slice(-4).forEach((m, i, list) => {
    const who = CAST.find((c) => c.id === m.who)
    const len = Math.min(64, 14 + m.text.length * 1.1)
    g.fillStyle = who.kind === 'human' ? who.shirt : who.body
    for (let k = 0; k < 6; k += 2) g.fillRect(x0 + k, y0 + i * 12 + k / 2, 2, 4)
    g.fillStyle = i === list.length - 1 ? 'rgba(235, 248, 255, .95)' : 'rgba(210, 230, 255, .55)'
    for (let k = 10; k < len; k += 2) g.fillRect(x0 + k, y0 + i * 12 + k / 2, 2, 3)
  })
}

// ── QUIÉN HACE QUÉ ───────────────────────────────────────────────────────────────────────────────
const people = CAST.map((c, i) => ({ ...c, state: 'typing', until: 0, phase: i * 37 }))
const shownLines = []
const STATE_LABEL = { typing: 'teclea', thinking: 'piensa', talking: 'habla', idle: 'lee' }
let line = 0, nextLineAt = 1200, paused = false

function idleStates(t) {
  for (const p of people) {
    if (t < p.until) continue // incluido el que habla: termina cuando vence su turno
    const r = Math.random()
    p.state = r < .55 ? 'typing' : r < .8 ? 'thinking' : 'idle'
    p.until = t + 1500 + Math.random() * 3500
  }
}

function say(t) {
  const [who, text] = SCRIPT[line % SCRIPT.length]
  line++
  const p = people.find((x) => x.id === who)
  p.state = 'talking'; p.until = t + 2600 + text.length * 35
  shownLines.push({ who, text, at: new Date() })
  if (shownLines.length > 40) shownLines.shift()
  bubble(p, text)
  logLine(p, text)
  nextLineAt = t + 3400 + Math.random() * 2200
  // el que va a hablar después se queda pensando un rato antes
  const next = people.find((x) => x.id === SCRIPT[line % SCRIPT.length][0])
  if (next !== p) { next.state = 'thinking'; next.until = nextLineAt }
}

// ── HTML ENCIMA DEL LIENZO ──────────────────────────────────────────────────────────────────────
let scale = 1
const overlay = document.getElementById('overlay')
const tags = new Map(), bubbles = new Map()
function place(el, x, y) { el.style.left = `${x * scale}px`; el.style.top = `${y * scale}px` }
function buildTags() {
  for (const p of people) {
    const el = document.createElement('div')
    el.className = 'tag'
    el.innerHTML = p.owner ? `${p.name} <span class="who">· ${p.owner}</span>` : p.name
    overlay.appendChild(el); tags.set(p.id, el)
  }
}
function bubble(p, text) {
  bubbles.get(p.id)?.remove()
  const el = document.createElement('div')
  el.className = 'bubble'
  el.textContent = text
  overlay.appendChild(el); bubbles.set(p.id, el)
  el._until = performance.now() + 2600 + text.length * 35
}
function thinkBubble(p) {
  if (bubbles.get(p.id)) return
  const el = document.createElement('div')
  el.className = 'bubble think'; el.textContent = '…'
  overlay.appendChild(el); bubbles.set(p.id, el)
  el._think = true
}
function layoutOverlay(now) {
  for (const p of people) {
    const h = head(p)
    place(tags.get(p.id), h.x, h.y - 6)
    const b = bubbles.get(p.id)
    if (b) {
      const done = b._think ? p.state !== 'thinking' : now > b._until
      if (done) { b.remove(); bubbles.delete(p.id); continue }
      place(b, h.x, h.y - 6 - 30 / scale)
      // que no se salga de la sala por los costados
      const half = b.offsetWidth / 2, left = h.x * scale
      b.style.left = `${Math.max(half + 4, Math.min(W * scale - half - 4, left))}px`
    } else if (p.state === 'thinking' && p.id === SCRIPT[line % SCRIPT.length][0]) thinkBubble(p)
  }
}

const roster = document.getElementById('roster'), log = document.getElementById('log')
function drawRoster() {
  roster.innerHTML = people.map((p) => `<li><span class="swatch" style="background:${p.kind === 'human' ? p.shirt : p.body}"></span>
    <span class="name">${p.name}${p.owner ? `<small>agente de ${p.owner}</small>` : ''}</span>
    <span class="state ${p.state}">${STATE_LABEL[p.state]}</span></li>`).join('')
}
const hhmm = (d) => d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })
function logLine(p, text) {
  const el = document.createElement('div')
  el.className = 'msg'
  el.innerHTML = `<b style="color:${p.kind === 'human' ? shade(p.shirt, 1.6) : shade(p.body, 1.35)}"></b><span></span>`
  el.querySelector('b').textContent = p.owner ? `${p.name} (de ${p.owner})` : p.name
  el.querySelector('b').insertAdjacentHTML('beforeend', `<time>${hhmm(new Date())}</time>`)
  el.querySelector('span').textContent = text
  log.appendChild(el)
  while (log.children.length > 60) log.firstChild.remove()
  log.scrollTop = log.scrollHeight
}

// ── TAMAÑO: la escena entera, achicada para entrar ─────────────────────────────────────────────
const stage = document.getElementById('stage'), scene = document.getElementById('scene')
function fit() {
  const r = stage.getBoundingClientRect()
  scale = Math.min((r.width - 16) / W, (r.height - 16) / H)
  cv.style.width = `${W * scale}px`; cv.style.height = `${H * scale}px`
  scene.style.width = `${W * scale}px`; scene.style.height = `${H * scale}px`
}
new ResizeObserver(fit).observe(stage)

// ── EL BUCLE ─────────────────────────────────────────────────────────────────────────────────────
let last = performance.now(), t = 0, rosterAt = 0
function frame(now) {
  const dt = now - last; last = now
  if (!paused) {
    t += dt
    if (t > nextLineAt) say(t)
    idleStates(t)
  }
  g.clearRect(0, 0, W, H)
  roomBack()
  tvLines()
  // todo lo que se para en el piso, de atrás hacia adelante (por u + v)
  const things = [...DECOR.map(([name, u, v]) => ({ depth: u + v, draw: () => prop(name, u, v) })),
    ...people.map((p) => ({ depth: p.desk[0] + p.desk[1] + 1, draw: () => station(p, t) }))]
  things.sort((a, b) => a.depth - b.depth).forEach((x) => x.draw())
  roomFront()
  layoutOverlay(now)
  if (now - rosterAt > 250) { drawRoster(); rosterAt = now; document.getElementById('clock').textContent = hhmm(new Date()) }
  requestAnimationFrame(frame)
}

document.getElementById('room-title').textContent = ROOM.title
document.getElementById('room-count').textContent = `${CAST.filter((c) => c.kind === 'human').length} personas · ${CAST.filter((c) => c.kind === 'agent').length} agentes`
document.getElementById('who-count').textContent = CAST.length
document.getElementById('pause').addEventListener('click', (e) => {
  paused = !paused
  e.target.textContent = paused ? 'seguir' : 'pausar'
  e.target.setAttribute('aria-pressed', String(paused))
})
Promise.all([...TILES.map((n) => load(n, `assets/tiles/${n}.png`)), ...Object.values(PROPS).map(([f]) => load(f, `assets/props/${f}.png`))])
  .then(() => { buildTags(); fit(); requestAnimationFrame(frame) })
</script>
</body>
</html>
