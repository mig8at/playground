<!doctype html>
<html lang="es" data-style="panels">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office</title>
<!--
  OFFICE — la sala donde se VE cómo trabajan las personas y sus agentes, en pixel art.
  Por ahora es sólo la parte visual: lo que dicen sale de un guion de ejemplo (SCRIPT), no del chat real.
  Una sala = una conversación del chat del equipo; cada participante, un muñeco en su escritorio.
  Para cambiar quiénes están y dónde se sientan: CAST. La oficina es isométrica: pisos, paredes y muebles son
  de PtDesigns (CC0; cada carpeta de assets/ lleva el LICENSE de su pack); los personajes los dibuja este
  archivo, en el estilo de los muebles. Tiene la mesa redonda donde trabajan, la cocina con su comedor, el
  rincón del café y una sala de estar. El lienzo va a la escala de los muebles (256 px por baldosa, las
  baldosas de 128 al doble) y se achica para entrar; la rueda acerca y arrastrar mueve. Los nombres, globos
  y la conversación van en HTML encima, para que el texto se lea nítido.
-->
<style>
  :root {
    --canvas: #0e0f13; --card: #17181d; --line: #262833; --text: #e7e7ea; --dim: #8b8d98;
    --accent: #f5a524; --ok: #3fb950;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--canvas); color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; height: 100%; padding: 8px; }
  .region { background: var(--card); border: 1px solid var(--line); border-radius: 10px; min-height: 0;
    display: flex; flex-direction: column; overflow: hidden; }
  .region > header { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    border-bottom: 1px solid var(--line); font-size: 12px; }
  .region > header .count { color: var(--dim); }
  .stage { flex: 1; min-height: 0; position: relative; overflow: hidden; cursor: grab; touch-action: none; }
  .stage.dragging { cursor: grabbing; }
  .scene { position: absolute; }
  .scene canvas { display: block; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .tag, .bubble { position: absolute; transform: translateX(-50%); white-space: nowrap;
    font-family: "Silkscreen", ui-monospace, Menlo, monospace; }
  .tag { transform: translate(-50%, -100%); font-size: 11px; padding: 1px 6px; border-radius: 3px; background: rgba(10, 11, 15, .78); color: var(--text); }
  .tag .who { opacity: .65; }
  .bubble { bottom: auto; max-width: 220px; white-space: normal; text-align: left; font-size: 12px; line-height: 1.25;
    background: #f4f1e8; color: #1b1b1f; padding: 5px 8px; border: 2px solid #1b1b1f; border-radius: 2px;
    transform: translate(-50%, -100%); box-shadow: 3px 3px 0 rgba(0, 0, 0, .35); animation: pop .18s steps(3); }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -4px; border: 4px solid transparent;
    border-top-color: #1b1b1f; }
  .bubble.think { background: #dfe7f5; font-style: italic; }
  @keyframes pop { from { transform: translate(-50%, -100%) scale(.6); } to { transform: translate(-50%, -100%) scale(1); } }

  .roster { list-style: none; margin: 0; padding: 8px; display: grid; gap: 2px; border-bottom: 1px solid var(--line); }
  .roster li { display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; }
  .roster .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .roster .name small { color: var(--dim); margin-left: 4px; }
  .roster .state { color: var(--dim); font-size: 12px; }
  .roster .state.talking { color: var(--accent); }
  .roster .state.typing { color: var(--ok); }
  .log { flex: 1; min-height: 0; overflow: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; }
  .log .msg { display: grid; gap: 1px; }
  .log .msg b { font-weight: 600; font-size: 12px; }
  .log .msg time { color: var(--dim); font-size: 11px; margin-left: 6px; font-weight: 400; }
  .log .msg span { color: var(--text); }
  .statusbar { grid-column: 1 / -1; height: 30px; display: flex; align-items: center; gap: 16px; padding: 0 12px;
    color: var(--dim); font-size: 12px; }
  .statusbar button { all: unset; cursor: pointer; color: var(--text); }
  .statusbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: minmax(260px, 1fr) minmax(200px, 40%) auto; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <section class="region" aria-label="La sala">
    <header><span id="room-title">Sala</span><span class="count" id="room-count"></span></header>
    <div class="stage" id="stage">
      <div class="scene" id="scene">
        <canvas id="cv" aria-label="La oficina en pixel art: las personas y sus agentes alrededor de una mesa redonda"></canvas>
        <div class="overlay" id="overlay"></div>
      </div>
    </div>
  </section>
  <aside class="region" aria-label="Quiénes están y qué dicen">
    <header><span>En la sala</span><span class="count" id="who-count"></span></header>
    <ul class="roster" id="roster"></ul>
    <header><span>Conversación</span><span class="count">guion de ejemplo</span></header>
    <div class="log" id="log" aria-live="polite"></div>
  </aside>
  <footer class="statusbar">
    <span id="clock"></span>
    <span>sólo visual: lo que dicen es un guion, no el chat real</span>
    <span style="flex:1"></span>
    <button type="button" id="zoom-out" aria-label="Alejar">−</button>
    <span id="zoom-level">100 %</span>
    <button type="button" id="zoom-in" aria-label="Acercar">+</button>
    <button type="button" id="zoom-fit">ver todo</button>
    <button type="button" id="pause" aria-pressed="false">pausar</button>
  </footer>
</div>

<script>
// ── QUIÉNES ESTÁN ────────────────────────────────────────────────────────────────────────────────
// kind: 'human' | 'agent'. owner: de quién es el agente. seat: el ángulo (grados, en el plano del piso) de su
// silla alrededor de la mesa redonda; 225 es el fondo, 135 la izquierda y 315 la derecha. Los agentes de Duncan
// van con nombre genérico hasta saber cómo se llaman.
const ROOM = { title: 'Sala · chat de Duncan' }
const CAST = [
  { id: 'd-bot1', name: 'agente 1', owner: 'Duncan', kind: 'agent', seat: 135, body: '#4f74c9', light: '#9ff0ff' },
  { id: 'duncan', name: 'Duncan', kind: 'human', seat: 171, hair: '#5a3a22', hairLight: '#7a5434', skin: '#c68a5e', shirt: '#3a6ea5', beard: '#4a2f1c' },
  { id: 'd-bot2', name: 'agente 2', owner: 'Duncan', kind: 'agent', seat: 207, body: '#7d68c9', light: '#ffe29a' },
  { id: 'luigi', name: 'Luigi', owner: 'Miguel', kind: 'agent', seat: 243, body: '#3ca66b', light: '#c6ffb0' },
  { id: 'miguel', name: 'Miguel', kind: 'human', seat: 279, hair: '#1f1712', hairLight: '#3a2c22', skin: '#e0ac7e', shirt: '#2f8f5b' },
  { id: 'wario', name: 'Wario', owner: 'Miguel', kind: 'agent', seat: 315, body: '#d9a227', light: '#fff1a8' },
]

// ── EL GUION ─────────────────────────────────────────────────────────────────────────────────────
// Lo que se dicen, en orden; vuelve a empezar al terminar. Entre línea y línea, cada uno teclea o piensa.
const SCRIPT = [
  ['duncan', '¿Alguien mira el 500 de preaprobación en qa?'],
  ['miguel', 'Yo. Luigi, ¿me traés los logs de la última hora?'],
  ['luigi', 'Van 14 errores, todos del mismo endpoint.'],
  ['d-bot1', 'Ese endpoint cambió en el despliegue de ayer.'],
  ['wario', 'Corro el caso en local para ver si se repite…'],
  ['wario', 'Se repite: falta un campo en la respuesta.'],
  ['duncan', 'Ok, lo arreglo yo. agente 2, armá la rama.'],
  ['d-bot2', 'Rama lista. ¿Le paso el caso de prueba?'],
  ['miguel', 'Sí, el de Pullman. Lo dejo en el chat.'],
  ['luigi', 'Comprobado: con el arreglo pasa de punta a punta.'],
  ['duncan', '🚀 Listo, lo subo a qa. ¿Café?'],
]

// ── LA GEOMETRÍA ISOMÉTRICA ──────────────────────────────────────────────────────────────────────
// La fórmula es la del README de Cozy Shops Foundations, al doble: la esquina de arriba de la celda (u, v)
// cae en (OX + 128(u − v), OY + 64(u + v)); una baldosa ocupa 264×392 y su origen está en (132, 260).
// Los muebles de Household van a su escala (256 px por baldosa, 100 px por metro de alto); los de Cozy Shops no
// están calibrados entre sí y cada uno lleva su factor.
const U = 10, V = 8
const W = 128 * (U + V) + 40, H = 290 + 64 * (U + V) + 60, OX = 128 * V + 20, OY = 290
const cv = document.getElementById('cv'), g = cv.getContext('2d')
cv.width = W; cv.height = H
const iso = (u, v) => ({ x: OX + 128 * (u - v), y: OY + 64 * (u + v) })

const TILES = ['floor_timber_clean', 'floor_timber_aged', 'floor_timber_stained', 'floor_tile_clean', 'floor_tile_aged', 'wall_primary_u', 'wall_primary_v',
  'wall_window_u', 'wall_doorway_v', 'door_closed_v', 'corner_pilaster', 'foundation_edge_u', 'foundation_edge_v']
// Los muebles: carpeta/archivo, el pivote (el punto que apoya en el piso, de su manifest.json) y su escala.
const PROPS = {
  tv: ['props/07_widescreen_television', 63, 113], clock: ['props/15_round_wall_clock', 26, 49], floorLamp: ['props/13_brass_floor_lamp', 42, 208],
  plant: ['props/18_potted_monstera', 62, 123], deskLamp: ['props/14_adjustable_desk_lamp', 27, 65], radio: ['props/24_portable_radio', 23, 45],
  fridge: ['kitchen/01_refrigerator_top_freezer', 86, 258], oven: ['kitchen/02_electric_oven_cooktop', 56, 118], microwave: ['kitchen/03_countertop_microwave', 44, 71],
  sink: ['kitchen/05_sink_base_cabinet', 81, 169], drawers: ['kitchen/06_drawer_base_cabinet', 56, 117], cupboard: ['kitchen/08_wall_cupboard', 59, 105],
  diningTable: ['kitchen/11_dining_table', 106, 175], chair: ['kitchen/12_dining_chair', 47, 125], jug: ['kitchen/23_water_jug', 21, 41],
  fruit: ['kitchen/24_fruit_bowl', 35, 53], plates: ['kitchen/21_dinner_plate_stack', 27, 39],
  sofa: ['living/01_three_seat_sofa', 132, 193], coffeeTable: ['living/05_low_coffee_table', 88, 123], bookcase: ['living/08_low_bookcase', 70, 143],
  coatRack: ['living/24_freestanding_coat_rack', 47, 233], endTable: ['living/06_square_end_table', 42, 104],
  counter: ['cafe/01_cafe_counter', 109, 208, .62], espresso: ['cafe/02_espresso_machine', 101, 211, .3], roundTable: ['cafe/04_round_cafe_table', 90, 191],
  tree: ['cafe/24_small_potted_tree', 86, 233, .7], mug: ['cafe/09_ceramic_mug', 83, 153, .11], cake: ['cafe/12_cake_stand', 99, 210, .22],
}
const img = {}
const load = (key, src) => new Promise((ok) => { const i = new Image(); i.onload = () => { img[key] = i; ok() }; i.onerror = () => ok(); i.src = src })

function tile(name, u, v) {
  const i = img[name]; if (!i) return
  const p = iso(u, v)
  g.drawImage(i, p.x - 132, p.y - 260, 264, 392)
}
// Un mueble apoyado en el punto (u, v) del piso (no hace falta que sea entero); lift lo sube (colgado de la pared o
// encima de una mesa) y flip lo da vuelta (mira hacia la derecha en vez de hacia la izquierda).
function prop(name, u, v, lift = 0, flip = false) {
  const [file, cx, cy, k = 1] = PROPS[name]; const i = img[file]; if (!i) return
  const p = iso(u, v)
  const x = Math.round(p.x - cx * k), y = Math.round(p.y - cy * k - lift)
  if (!flip) { g.drawImage(i, x, y, i.width * k, i.height * k); return }
  g.save(); g.translate(Math.round(p.x), 0); g.scale(-1, 1); g.drawImage(i, -cx * k, y, i.width * k, i.height * k); g.restore()
}

// ── LA MESA REDONDA ──────────────────────────────────────────────────────────────────────────────
// La mesita de café de Cozy Shops, agrandada para seis: la tabla (filas 0–123 del sprite, con el florero) va
// entera a TK; el pie (123–190) se aplasta, porque a la escala de una mesa grande quedaría de metro y medio.
// La tabla está a TABLE_TOP del piso: un punto (u, v) de su superficie se ve en iso(u, v) subido TABLE_TOP.
const TABLE = { u: 3.6, v: 3.7, r: .93 }
const TK = 2.1, TABLE_TOP = 70
function roundTable() {
  const i = img['cafe/04_round_cafe_table']; if (!i) return
  const c = iso(TABLE.u, TABLE.v)
  // el pie, asomando debajo del borde
  g.drawImage(i, 50, 123, 80, 68, c.x - 80 * 1.6 / 2, c.y + 4, 80 * 1.6, 68 * .62)
  // la tabla: el centro de la elipse (89.5, 81) del sprite cae en el centro de la mesa, a la altura de la tabla. Se
  // dibuja desde la fila 40 (sin las flores, que a este tamaño serían de un metro) y el pie del florero se tapa
  // con madera de más abajo de la misma tabla.
  const at = (sx, sy, sw, sh) => g.drawImage(i, sx, sy, sw, sh, c.x + (sx - 89.5) * TK, c.y - TABLE_TOP + (sy - 81) * TK, sw * TK, sh * TK)
  at(0, 40, 180, 84)
  g.drawImage(i, 62, 78, 58, 20, c.x + (62 - 89.5) * TK, c.y - TABLE_TOP + (46 - 81) * TK, 58 * TK, 20 * TK)
}
// Lo que hay sobre la mesa: tazas delante de algunos.
const TABLE_ITEMS = [['mug', 'duncan'], ['mug', 'miguel'], ['mug', 'd-bot2'], ['cake', null], ['fruit', 'center']]

// ── LOS PERSONAJES ───────────────────────────────────────────────────────────────────────────────
// Dibujados para que encajen con los muebles: contorno oscuro, luz desde la izquierda y sombra a la derecha,
// tres tonos por material. Un sprite es una lista de filas; cada letra es un color, '.' es transparente.
// Miran hacia abajo a la izquierda; los de la izquierda de la mesa se dan vuelta para mirarla.
const PX = 3.4
const HUMAN = [
  '......oooooooo......',
  '....ooHHHHHHHHoo....',
  '...oHHhhhHHHHHHHo...',
  '..oHHhhHHHHHHHHHHo..',
  '..oHHHHHHHHHHHHHHo..',
  '..oHHSSSSSSSSHHHHo..',
  '..oHSSSSSSSSSSsHHo..',
  '.oSHSSESSSSESSsHso..',
  '.osSSSESSSSESSssso..',
  '..oSSSSSSSSSSSsso...',
  '..oSSSSSmmmSSSsso...',
  '...oSSSSSSSSSsso....',
  '....oossssssoo......',
  '......oSSSso........',
  '...oooKSSSSKooo.....',
  '..oCCCKKKKKKCCCCo...',
  '.olCCCCCCCCCCCCcco..',
  '.olCCCCCCCCCCCCcco..',
  'olCCCCCCCCCCCCCccco.',
  'olCCCCCCCCCCCCCccco.',
  'olCCCCCCCCCCCCCccco.',
  'olCCCCCCCCCCCCCccco.',
]
const AGENT = [
  '.........oo.........',
  '........oAAo........',
  '.........oo.........',
  '.....oooooooooo.....',
  '....oGGGGGGGGGGo....',
  '...oGlGGGGGGGGGgo...',
  '...oGDDDDDDDDDDgo...',
  '...oGDLLDDDDLLDgo...',
  '...oGDLLDDDDLLDgo...',
  '...oGDDDDmmDDDDgo...',
  '...oGGGGGGGGGGggo...',
  '....oggggggggggo....',
  '.....oooooooooo.....',
  '........oNNo........',
  '...oooooNNNNooooo...',
  '..oBBBBBBBBBBBBbbo..',
  '.olBBBBBBkkBBBBbbbo.',
  '.olBBBBBkkkkBBBbbbo.',
  'olBBBBBBBkkBBBBbbbbo',
  'olBBBBBBBBBBBBBbbbbo',
  'olBBBBBBBBBBBBBbbbbo',
  'olBBBBBBBBBBBBBbbbbo',
]
const SPRITE_W = 20, SPRITE_H = 22
const shade = (hex, f) => {
  const n = parseInt(hex.slice(1), 16)
  const ch = (v) => Math.max(0, Math.min(255, Math.round(v * f)))
  return `rgb(${ch(n >> 16)},${ch((n >> 8) & 255)},${ch(n & 255)})`
}
function sprite(rows, pal, x, y, flip) {
  rows.forEach((row, j) => {
    for (let i = 0; i < SPRITE_W; i++) {
      const c = pal[row[i]]; if (!c) continue
      const col = flip ? SPRITE_W - 1 - i : i
      g.fillStyle = typeof c === 'function' ? c(j) : c
      g.fillRect(Math.round(x + col * PX), Math.round(y + j * PX), Math.ceil(PX), Math.ceil(PX))
    }
  })
}

// La silla de cada uno, en su ángulo alrededor de la mesa.
const SEAT_R = 1.4
function seatOf(p) {
  const a = (p.seat * Math.PI) / 180
  const du = Math.cos(a), dv = Math.sin(a)
  const s = { u: TABLE.u + du * SEAT_R, v: TABLE.v + dv * SEAT_R, du, dv }
  s.flip = iso(s.u, s.v).x < iso(TABLE.u, TABLE.v).x - 4 // a la izquierda de la mesa: mira a la derecha
  return s
}
const SIT = 52 // a qué altura del piso queda la base del sprite (la cintura, que tapa la mesa)
function head(p) { const s = seatOf(p), q = iso(s.u, s.v); return { x: q.x, y: q.y - SIT - SPRITE_H * PX } }

function person(p, t) {
  const s = seatOf(p), q = iso(s.u, s.v)
  const st = p.state
  const bob = st === 'talking' && Math.floor(t / 160) % 2 ? -PX : 0
  const x = q.x - (SPRITE_W * PX) / 2, y = q.y - SIT - SPRITE_H * PX + bob
  const out = '#2a1d1a'
  if (p.kind === 'human') {
    const blink = Math.floor((t + p.phase) / 120) % 33 === 0
    const beardRow = (j) => (p.beard && j >= 9 && j <= 11 ? p.beard : null)
    sprite(HUMAN, {
      o: out, H: p.hair, h: p.hairLight,
      S: (j) => beardRow(j) || p.skin, s: (j) => beardRow(j) || shade(p.skin, .82),
      E: blink ? p.skin : '#1b1b1f', m: st === 'talking' && Math.floor(t / 120) % 2 ? '#7a2e2e' : shade(p.skin, .7),
      C: p.shirt, c: shade(p.shirt, .72), l: shade(p.shirt, 1.25), K: '#f1ede4',
    }, x, y, s.flip)
  } else {
    const eye = st === 'thinking' ? (Math.floor(t / 200) % 2 ? p.light : '#1d2230') : p.light
    const blink = Math.floor((t + p.phase) / 110) % 29 === 0
    sprite(AGENT, {
      o: out, A: Math.floor(t / 300) % 2 ? p.light : shade(p.body, .7),
      G: '#c9ced8', g: '#8d94a3', l: '#f2f4f8', D: '#1d2230', L: blink ? '#1d2230' : eye,
      m: st === 'talking' && Math.floor(t / 120) % 2 ? p.light : '#3a4256', N: '#6d7380',
      B: p.body, b: shade(p.body, .72), k: shade(p.body, 1.3),
    }, x, y, s.flip)
  }
}

// Las manos, sobre la tabla y hacia el centro: teclean (se alternan) o descansan.
function hands(p, t) {
  const s = seatOf(p)
  const hu = s.u - s.du * .42, hv = s.v - s.dv * .42
  const q = iso(hu, hv)
  const skin = p.kind === 'human' ? p.skin : '#c9ced8'
  const alt = Math.floor((t + p.phase) / 90) % 2
  const typing = p.state === 'typing'
  for (const side of [-1, 1]) {
    const up = typing && (side < 0) === !!alt ? 4 : 0
    const x = q.x + side * 13 - 6, y = q.y - TABLE_TOP - 5 - up
    g.fillStyle = '#2a1d1a'; g.fillRect(x - 1, y - 1, 13, 9)
    g.fillStyle = skin; g.fillRect(x, y, 11, 7)
  }
  // el portátil de cada uno, abierto hacia él: se ve la tapa de atrás, con su logo que se prende al usarlo
  const l = iso(s.u - s.du * .6, s.v - s.dv * .6)
  const lx = l.x - 17, ly = l.y - TABLE_TOP - 26
  g.fillStyle = '#2a1d1a'; g.fillRect(lx - 2, ly - 2, 38, 30)
  g.fillStyle = '#b9bfcb'; g.fillRect(lx, ly, 34, 22)
  g.fillStyle = '#d7dce5'; g.fillRect(lx, ly, 34, 4)
  g.fillStyle = '#8d94a3'; g.fillRect(lx, ly + 22, 34, 4)
  const on = p.state === 'typing' || p.state === 'talking'
  g.fillStyle = on ? (p.light || '#e9f1ff') : '#8d94a3'; g.fillRect(lx + 14, ly + 8, 6, 6)
  // y su pantalla le ilumina la cara
  if (on) { const h = head(p); g.fillStyle = 'rgba(190, 225, 255, .10)'; g.fillRect(h.x - 30, h.y + 6, 60, 52) }
}

// ── LA OFICINA ───────────────────────────────────────────────────────────────────────────────────
// La cocina y el comedor van sobre baldosas; el resto, madera.
const KITCHEN = (u, v) => u >= 6 && v <= 3
const FLOOR = (u, v) => KITCHEN(u, v) ? ((u + v) % 3 ? 'floor_tile_clean' : 'floor_tile_aged')
  : ['floor_timber_clean', 'floor_timber_aged', 'floor_timber_clean', 'floor_timber_stained'][(u * 7 + v * 3) % 4]
function roomBack() {
  for (let d = 0; d < U + V; d++) for (let u = 0; u < U; u++) { const v = d - u; if (v >= 0 && v < V) tile(FLOOR(u, v), u, v) }
  for (let k = 0; k < U; k++) tile(k === 1 || k === 4 || k === 8 ? 'wall_window_u' : 'wall_primary_u', k, 0)
  for (let k = 0; k < V; k++) tile(k === 5 ? 'wall_doorway_v' : 'wall_primary_v', 0, k)
  tile('door_closed_v', 0, 5)
  tile('corner_pilaster', 0, 0)
  // colgado de la pared de atrás: la tele de la sala, el reloj y las alacenas de la cocina
  prop('tv', 3.05, 0.08, 120)
  prop('clock', 5.7, 0.06, 175)
  prop('cupboard', 7.55, 0.12, 150)
  prop('cupboard', 8.45, 0.12, 150)
}
function roomFront() {
  for (let k = 0; k < U; k++) tile('foundation_edge_u', k, V)
  for (let k = 0; k < V; k++) tile('foundation_edge_v', U, k)
}
// Lo que se para en el piso, de atrás hacia adelante se ordena solo: [mueble, u, v, lift, flip, encima…].
const DECOR = [
  ['plant', .6, .6], ['bookcase', 1.6, .45], ['bookcase', 2.5, .45], ['plant', 5.5, .55], ['deskLamp', 2.3, .3, 120], ['radio', 1.55, .3, 120],
  // la cocina, contra la pared de atrás
  ['fridge', 6.55, .5], ['sink', 7.55, .5], ['drawers', 8.45, .5], ['microwave', 8.45, .4, 88], ['oven', 9.35, .5],
  // el comedor
  ['chair', 7.6, 1.55], ['chair', 8.5, 1.55], ['diningTable', 8.1, 2.3], ['chair', 7.15, 2.45, 0, true],
  ['fruit', 7.95, 2.15, 74], ['jug', 8.4, 2.05, 74], ['plates', 8.55, 2.45, 74],
  // el rincón del café
  ['counter', 9.2, 4.3], ['espresso', 9.25, 4.15, 92], ['mug', 9.05, 4.55, 92],
  // la sala de estar, junto a la puerta
  ['coatRack', .45, 4.45], ['sofa', .8, 6.5, 0, true], ['coffeeTable', 1.75, 6.55], ['endTable', .6, 7.45], ['floorLamp', .55, 5.6],
  ['tree', 9.4, 7.2], ['plant', 5.6, 7.3],
]

// ── QUIÉN HACE QUÉ ───────────────────────────────────────────────────────────────────────────────
const people = CAST.map((c, i) => ({ ...c, state: 'typing', until: 0, phase: i * 37 }))
const shownLines = []
const STATE_LABEL = { typing: 'teclea', thinking: 'piensa', talking: 'habla', idle: 'lee' }
let line = 0, nextLineAt = 1200, paused = false

function idleStates(t) {
  for (const p of people) {
    if (t < p.until) continue // incluido el que habla: termina cuando vence su turno
    const r = Math.random()
    p.state = r < .55 ? 'typing' : r < .8 ? 'thinking' : 'idle'
    p.until = t + 1500 + Math.random() * 3500
  }
}

function say(t) {
  const [who, text] = SCRIPT[line % SCRIPT.length]
  line++
  const p = people.find((x) => x.id === who)
  p.state = 'talking'; p.until = t + 2600 + text.length * 35
  shownLines.push({ who, text, at: new Date() })
  if (shownLines.length > 40) shownLines.shift()
  bubble(p, text)
  logLine(p, text)
  nextLineAt = t + 3400 + Math.random() * 2200
  // el que va a hablar después se queda pensando un rato antes
  const next = people.find((x) => x.id === SCRIPT[line % SCRIPT.length][0])
  if (next !== p) { next.state = 'thinking'; next.until = nextLineAt }
}

// La conversación en la pantalla de la tele: rayitas de colores sobre el plano inclinado de la pared.
function tvLines() {
  const p = iso(3.05, 0.08)
  const x0 = p.x - 44, y0 = p.y - 120 - 92
  shownLines.slice(-4).forEach((m, i, list) => {
    const who = CAST.find((c) => c.id === m.who)
    const len = Math.min(64, 14 + m.text.length * 1.1)
    g.fillStyle = who.kind === 'human' ? who.shirt : who.body
    for (let k = 0; k < 6; k += 2) g.fillRect(x0 + k, y0 + i * 12 + k / 2, 2, 4)
    g.fillStyle = i === list.length - 1 ? 'rgba(235, 248, 255, .95)' : 'rgba(210, 230, 255, .55)'
    for (let k = 10; k < len; k += 2) g.fillRect(x0 + k, y0 + i * 12 + k / 2, 2, 3)
  })
}

// ── HTML ENCIMA DEL LIENZO ──────────────────────────────────────────────────────────────────────
let scale = 1
const overlay = document.getElementById('overlay')
const tags = new Map(), bubbles = new Map()
function place(el, x, y) { el.style.left = `${x * scale}px`; el.style.top = `${y * scale}px` }
function buildTags() {
  for (const p of people) {
    const el = document.createElement('div')
    el.className = 'tag'
    el.textContent = p.name
    overlay.appendChild(el); tags.set(p.id, el)
  }
}
function bubble(p, text) {
  bubbles.get(p.id)?.remove()
  const el = document.createElement('div')
  el.className = 'bubble'
  el.textContent = text
  overlay.appendChild(el); bubbles.set(p.id, el)
  const h = head(p); place(el, h.x, h.y - 6 - 30 / scale)
  el._until = performance.now() + 2600 + text.length * 35
}
function thinkBubble(p) {
  if (bubbles.get(p.id)) return
  const el = document.createElement('div')
  el.className = 'bubble think'; el.textContent = '…'
  overlay.appendChild(el); bubbles.set(p.id, el)
  el._think = true
}
function layoutOverlay(now) {
  for (const p of people) {
    const h = head(p)
    place(tags.get(p.id), h.x, h.y - 6)
    const b = bubbles.get(p.id)
    if (b) {
      const done = b._think ? p.state !== 'thinking' : now > b._until
      if (done) { b.remove(); bubbles.delete(p.id); continue }
      place(b, h.x, h.y - 6 - 30 / scale)
    } else if (p.state === 'thinking' && p.id === SCRIPT[line % SCRIPT.length][0]) {
      thinkBubble(p)
      place(bubbles.get(p.id), h.x, h.y - 6 - 30 / scale) // ya en su lugar: si no, asoma un cuadro en la esquina
    }
  }
}

const roster = document.getElementById('roster'), log = document.getElementById('log')
function drawRoster() {
  roster.innerHTML = people.map((p) => `<li><span class="swatch" style="background:${p.kind === 'human' ? p.shirt : p.body}"></span>
    <span class="name">${p.name}${p.owner ? `<small>agente de ${p.owner}</small>` : ''}</span>
    <span class="state ${p.state}">${STATE_LABEL[p.state]}</span></li>`).join('')
}
const hhmm = (d) => d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })
function logLine(p, text) {
  const el = document.createElement('div')
  el.className = 'msg'
  el.innerHTML = `<b style="color:${p.kind === 'human' ? shade(p.shirt, 1.6) : shade(p.body, 1.35)}"></b><span></span>`
  el.querySelector('b').textContent = p.owner ? `${p.name} (de ${p.owner})` : p.name
  el.querySelector('b').insertAdjacentHTML('beforeend', `<time>${hhmm(new Date())}</time>`)
  el.querySelector('span').textContent = text
  log.appendChild(el)
  while (log.children.length > 60) log.firstChild.remove()
  log.scrollTop = log.scrollHeight
}

// ── TAMAÑO, ZOOM Y ARRASTRE ─────────────────────────────────────────────────────────────────────
// La oficina entera entra al abrir; la rueda (o + y −) acerca hacia el puntero y arrastrar la mueve.
const stage = document.getElementById('stage'), scene = document.getElementById('scene')
const view = { z: 1, x: 0, y: 0 }
let fitScale = 1
let opened = false // al abrir, la vista arranca acercada a la mesa
function apply() {
  const r = stage.getBoundingClientRect()
  scale = fitScale * view.z
  const w = W * scale, h = H * scale
  // con zoom 1 queda centrada; con más, no deja ver más allá de los bordes
  const minX = Math.min(0, r.width - w), minY = Math.min(0, r.height - h)
  if (view.z <= 1) { view.x = (r.width - w) / 2; view.y = (r.height - h) / 2 } else {
    view.x = Math.max(minX, Math.min(0, view.x)); view.y = Math.max(minY, Math.min(0, view.y))
  }
  cv.style.width = `${w}px`; cv.style.height = `${h}px`
  scene.style.width = `${w}px`; scene.style.height = `${h}px`
  scene.style.left = `${view.x}px`; scene.style.top = `${view.y}px`
  document.getElementById('zoom-level').textContent = `${Math.round(view.z * 100)} %`
}
function fit() {
  const r = stage.getBoundingClientRect()
  fitScale = Math.min((r.width - 16) / W, (r.height - 16) / H)
  if (!opened && r.width > 0) {
    opened = true
    view.z = 1.9
    const c = iso(TABLE.u, TABLE.v), s = fitScale * view.z
    view.x = r.width / 2 - (c.x + 250) * s; view.y = r.height / 2 - (c.y - 140) * s
  }
  apply()
}
function zoomAt(z, cx, cy) {
  const nz = Math.max(1, Math.min(4, z))
  const k = nz / view.z
  view.x = cx - (cx - view.x) * k; view.y = cy - (cy - view.y) * k; view.z = nz
  apply()
}
new ResizeObserver(fit).observe(stage)
stage.addEventListener('wheel', (e) => {
  e.preventDefault()
  const r = stage.getBoundingClientRect()
  zoomAt(view.z * Math.exp(-e.deltaY * .0015), e.clientX - r.left, e.clientY - r.top)
}, { passive: false })
let drag = null
stage.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; stage.setPointerCapture(e.pointerId); stage.classList.add('dragging') })
stage.addEventListener('pointermove', (e) => { if (!drag) return; view.x = drag.vx + e.clientX - drag.x; view.y = drag.vy + e.clientY - drag.y; apply() })
stage.addEventListener('pointerup', () => { drag = null; stage.classList.remove('dragging') })
const centerZoom = (f) => { const r = stage.getBoundingClientRect(); zoomAt(view.z * f, r.width / 2, r.height / 2) }
document.getElementById('zoom-in').addEventListener('click', () => centerZoom(1.25))
document.getElementById('zoom-out').addEventListener('click', () => centerZoom(.8))
document.getElementById('zoom-fit').addEventListener('click', () => { view.z = 1; apply() })

// ── EL BUCLE ─────────────────────────────────────────────────────────────────────────────────────
let last = performance.now(), t = 0, rosterAt = 0
function frame(now) {
  const dt = now - last; last = now
  if (!paused) {
    t += dt
    if (t > nextLineAt) say(t)
    idleStates(t)
  }
  g.clearRect(0, 0, W, H)
  roomBack()
  tvLines()
  // todo lo que se para en el piso, de atrás hacia adelante (por u + v). La mesa redonda va después de quienes se
  // sientan detrás y a los costados, y antes de sus manos y lo que hay encima.
  const tableDepth = TABLE.u + TABLE.v + .3
  const things = [
    ...DECOR.map(([name, u, v, lift = 0, flip = false]) => ({ depth: u + v + (lift ? .01 : 0), draw: () => prop(name, u, v, lift, flip) })),
    ...people.map((p) => { const s = seatOf(p); return { depth: Math.min(s.u + s.v, tableDepth - .1), draw: () => { prop('chair', s.u + s.du * .12, s.v + s.dv * .12, 0, s.flip); person(p, t) } } }),
    { depth: tableDepth, draw: () => {
      roundTable()
      for (const p of people) hands(p, t)
      for (const [name, who] of TABLE_ITEMS) {
        if (!who) { prop(name, TABLE.u - .05, TABLE.v - .05, TABLE_TOP); continue }
        if (who === 'center') { prop(name, TABLE.u + .3, TABLE.v + .25, TABLE_TOP); continue }
        const s = seatOf(people.find((x) => x.id === who))
        prop(name, s.u - s.du * .6 + s.dv * .25, s.v - s.dv * .6 - s.du * .25, TABLE_TOP)
      }
    } },
  ]
  things.sort((a, b) => a.depth - b.depth).forEach((x) => x.draw())
  roomFront()
  layoutOverlay(now)
  if (now - rosterAt > 250) { drawRoster(); rosterAt = now; document.getElementById('clock').textContent = hhmm(new Date()) }
  requestAnimationFrame(frame)
}

document.getElementById('room-title').textContent = ROOM.title
document.getElementById('room-count').textContent = `${CAST.filter((c) => c.kind === 'human').length} personas · ${CAST.filter((c) => c.kind === 'agent').length} agentes`
document.getElementById('who-count').textContent = CAST.length
document.getElementById('pause').addEventListener('click', (e) => {
  paused = !paused
  e.target.textContent = paused ? 'seguir' : 'pausar'
  e.target.setAttribute('aria-pressed', String(paused))
})
Promise.all([...TILES.map((n) => load(n, `assets/tiles/${n}.png`)), ...Object.values(PROPS).map(([f]) => load(f, `assets/${f}.png`))])
  .then(() => { buildTags(); fit(); requestAnimationFrame(frame) })
</script>
