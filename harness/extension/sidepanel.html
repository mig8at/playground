<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cliente de prueba</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <strong>Cliente de prueba</strong>
    <span class="chip" id="env">—</span>
    <button class="icon" id="newPerson" title="Otra persona: cédula y celular nuevos, sin cliente activo" aria-label="Otra persona">↻</button>
  </header>
  <p class="note" id="envNote" hidden></p>

  <h2>Quién</h2>
  <div class="grid">
    <label for="doc">Cédula</label><input id="doc" inputmode="numeric">
    <label for="firstName">Nombre</label><input id="firstName">
    <label for="lastName">Apellido</label><input id="lastName">
    <label for="phone">Celular</label><input id="phone" inputmode="numeric">
    <label for="email">Correo</label><input id="email">
    <label for="amount">Monto</label><input id="amount" inputmode="numeric">
    <label for="issueDate">Expedición</label><input id="issueDate" type="date">
  </div>
  <p class="state" id="state">Escribí o generá una cédula.</p>
  <p class="note" id="lockNote" hidden>Hay una solicitud en curso en esta pestaña: los datos son los de ella. Para otra persona, «Nueva solicitud».</p>

  <h2>Cómo responden las centrales</h2>
  <div class="chips" id="presets">
    <button data-p="approves" class="on">Aprueba</button>
    <button data-p="unemployed">Sin empleo</button>
    <button data-p="lowScore">Score bajo</button>
    <button data-p="noExperian">Experian sin info</button>
  </div>
  <div class="grid">
    <label for="occupation">Ocupación</label>
    <select id="occupation"><option>Empleado</option><option>Independiente</option><option>Pensionado</option><option>Sin empleo</option></select>
    <label for="income">Ingreso</label><input id="income" inputmode="numeric">
    <label for="months">Meses cotizados</label><input id="months" inputmode="numeric">
    <label for="score">Score</label><input id="score" inputmode="numeric">
    <label for="negatives">Moras 12 m</label><input id="negatives" inputmode="numeric">
    <label for="consulted">Consultas 6 m</label><input id="consulted" inputmode="numeric">
  </div>

  <div class="actions">
    <button class="primary" id="ready" title="Persona nueva, centrales dictadas y la pestaña al inicio del flujo, con el monto de arriba. No borra ni da de baja a nadie: lo anterior queda en la base">Nueva solicitud</button>
    <button id="fill" title="Escribe lo de arriba en la pantalla del wizard, y el OTP en la del código">Rellenar</button>
  </div>
  <div id="step" hidden>
    <button class="primary" id="stepBtn"></button>
    <p class="note" id="stepNote"></p>
  </div>
  <p class="log" id="log"></p>

  <h2>OTP</h2>
  <p class="otp"><span id="otp">—</span><button class="icon" id="otpRefresh" title="Leer el último OTP de este celular" aria-label="Leer el OTP">↻</button><button class="icon" id="otpCopy" title="Copiar" aria-label="Copiar el OTP">⧉</button></p>

  <h2>La solicitud</h2>
  <div id="flow" class="flow"></div>
  <div id="req" class="req">Todavía no hay solicitud en esta pestaña.</div>

  <details id="dbConsole" class="console">
    <summary>Consola · la base de la solicitud</summary>
    <div class="tabs" id="dbTabs"></div>
    <div class="rows" id="dbRows"></div>
    <div class="foot" id="dbFoot"></div>
  </details>

  <script src="sidepanel.js"></script>
</body>
</html>
