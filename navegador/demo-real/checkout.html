<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tienda Andina · Pagar</title><link rel="stylesheet" href="/estilo.css"></head><body>
<header><a class="marca" href="/">Tienda Andina</a><a href="/">Productos</a><a href="/boletin.html">Boletín</a><a href="/cuenta.html">Mi cuenta</a><a href="/checkout.html">Carrito</a></header>
<main>
  <div class="caja"><h1>Tu compra</h1><div id="resumen"></div><p>Total: <strong id="total">$0</strong></p></div>
  <form class="caja" id="pago">
    <h2>Envío</h2>
    <label for="nombre">Nombre de quien recibe</label><input id="nombre">
    <label for="direccion">Dirección</label><input id="direccion">
    <label for="ciudad">Ciudad</label><select id="ciudad"><option value="">Elegí</option><option>Bogotá</option><option>Medellín</option><option>Cali</option></select>
    <h2>Pago con tarjeta</h2>
    <label for="tarjeta">Número de tarjeta</label><input id="tarjeta" inputmode="numeric" autocomplete="cc-number">
    <label for="vence">Vencimiento (MM/AA)</label><input id="vence" autocomplete="cc-exp">
    <label for="cvv">CVV</label><input id="cvv" inputmode="numeric" autocomplete="cc-csc">
    <label class="check"><input type="checkbox" id="terminos"> Acepto los términos y condiciones de compra y la política de devoluciones</label>
    <label class="check"><input type="checkbox" id="datos"> Autorizo el tratamiento de mis datos personales para fines comerciales</label>
    <p class="error" id="error"></p>
    <button id="pagar" disabled>Pagar ahora</button>
  </form>
  <p class="ok" id="listo" hidden></p>
</main>
<footer>© Tienda Andina</footer>
<script>
const c = JSON.parse(localStorage.getItem('andina.carrito') || '[]')
const total = c.reduce((a, [, p]) => a + p, 0)
document.getElementById('resumen').innerHTML = c.length ? c.map(([n, p]) => `<p>${n} · $${p.toLocaleString('es-CO')}</p>`).join('') : '<p>El carrito está vacío.</p>'
document.getElementById('total').textContent = '$' + total.toLocaleString('es-CO')
document.getElementById('pagar').textContent = `Pagar $${total.toLocaleString('es-CO')}`
const f = document.getElementById('pago')
const ok = () => ['nombre', 'direccion', 'ciudad', 'tarjeta', 'vence', 'cvv'].every((id) => document.getElementById(id).value.trim()) && document.getElementById('terminos').checked && total > 0
f.addEventListener('input', () => { document.getElementById('pagar').disabled = !ok() })
f.addEventListener('submit', (e) => {
  e.preventDefault()
  f.hidden = true
  const l = document.getElementById('listo'); l.hidden = false
  l.textContent = `Pago aprobado por $${total.toLocaleString('es-CO')}. Tu pedido llega en 3 días.`
  localStorage.removeItem('andina.carrito')
})
</script>
</body></html>
