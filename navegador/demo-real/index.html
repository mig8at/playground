<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tienda Andina</title><link rel="stylesheet" href="/estilo.css"></head><body>
<header><a class="marca" href="/">Tienda Andina</a><a href="/">Productos</a><a href="/boletin.html">Boletín</a><a href="/cuenta.html">Mi cuenta</a><a href="/checkout.html">Carrito</a></header>
<main>
  <h1>Café y artesanías de los Andes</h1>
  <div class="productos" id="productos"></div>
</main>
<footer>© Tienda Andina</footer>
<script>
const P = [['Café de altura 500 g', 42000], ['Ruana de lana', 189000], ['Taza de barro', 25000]]
document.getElementById('productos').innerHTML = P.map(([n, p], i) => `<div class="caja"><strong>${n}</strong><p>$${p.toLocaleString('es-CO')}</p><button data-i="${i}">Agregar ${n}</button></div>`).join('')
document.getElementById('productos').addEventListener('click', (e) => {
  if (e.target.dataset.i == null) return
  const c = JSON.parse(localStorage.getItem('andina.carrito') || '[]'); c.push(P[e.target.dataset.i]); localStorage.setItem('andina.carrito', JSON.stringify(c))
  e.target.textContent = 'Agregado ✓'
})
</script>
</body></html>
