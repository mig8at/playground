<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab · Tienda</title><link rel="stylesheet" href="/demo.css"></head><body>
<main>
  <h1>Tienda</h1>
  <div class="grid" id="catalogo"></div>
  <div class="card" id="carrito-card">
    <h2>Tu carrito <span id="badge" class="muted"></span></h2>
    <table class="data"><thead><tr><th>Producto</th><th>Cantidad</th><th>Subtotal</th><th></th></tr></thead><tbody id="carrito"></tbody></table>
    <div class="row" style="margin-top:12px">
      <input id="cupon" placeholder="Código de descuento" aria-label="Código de descuento"><button class="secondary" id="aplicar">Aplicar</button>
      <span id="cupon-msg" class="muted"></span>
    </div>
    <p>Total: <strong id="total">$0</strong></p>
    <div class="row"><button class="secondary" id="vaciar">Vaciar carrito</button><button id="pagar" disabled>Ir a pagar</button></div>
  </div>
  <form class="card" id="checkout" hidden aria-label="Pago">
    <h2>Pago</h2>
    <div class="field"><label for="dir">Dirección de envío</label><input id="dir"></div>
    <div class="field"><label for="tarjeta">Número de tarjeta</label><input id="tarjeta" inputmode="numeric" placeholder="4242 4242 4242 4242"></div>
    <div class="row"><div class="field"><label for="venc">Vencimiento</label><input id="venc" placeholder="MM/AA"></div>
      <div class="field"><label for="cvc">CVC</label><input id="cvc" inputmode="numeric" maxlength="4"></div></div>
    <p class="notice">Demo: la tarjeta de prueba es 4242 4242 4242 4242, cualquier vencimiento futuro y CVC de 3 números.</p>
    <p class="error" id="pago-error"></p>
    <button type="submit">Pagar</button>
  </form>
  <p class="ok" id="gracias" hidden></p>
</main>
<script type="module">
import { header, toast } from '/demo.js'; header()
const P = [['Audífonos Eco', 89000], ['Teclado Tecla', 149000], ['Mouse Rata', 59000], ['Mochila Ruta', 129000]]
const cart = new Map()
let desc = 0
const fmt = (n) => '$' + Math.round(n).toLocaleString('es-CO')
document.getElementById('catalogo').innerHTML = P.map(([n, p], i) => `<div class="card"><strong>${n}</strong><p class="muted">${fmt(p)}</p><button data-add="${i}" aria-label="Agregar ${n} al carrito">Agregar</button></div>`).join('')
document.getElementById('catalogo').addEventListener('click', (e) => { const i = e.target.dataset.add; if (i == null) return; cart.set(+i, (cart.get(+i) || 0) + 1); toast(`${P[i][0]} agregado`); render() })
function render() {
  const rows = [...cart].filter(([, q]) => q > 0)
  document.getElementById('carrito').innerHTML = rows.map(([i, q]) => `<tr><td>${P[i][0]}</td><td><div class="stepper"><button class="secondary" data-dec="${i}" aria-label="Quitar uno de ${P[i][0]}">−</button><span>${q}</span><button class="secondary" data-inc="${i}" aria-label="Sumar uno de ${P[i][0]}">+</button></div></td><td>${fmt(P[i][1] * q)}</td><td><button class="secondary" data-del="${i}" aria-label="Eliminar ${P[i][0]}">✕</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">El carrito está vacío</td></tr>'
  const sub = rows.reduce((a, [i, q]) => a + P[i][1] * q, 0)
  document.getElementById('total').textContent = fmt(sub * (1 - desc))
  document.getElementById('badge').textContent = rows.length ? `(${rows.reduce((a, [, q]) => a + q, 0)} productos)` : ''
  document.getElementById('pagar').disabled = !rows.length
}
document.getElementById('carrito').addEventListener('click', (e) => {
  const d = e.target.dataset
  if (d.inc) cart.set(+d.inc, cart.get(+d.inc) + 1)
  if (d.dec) cart.set(+d.dec, cart.get(+d.dec) - 1)
  if (d.del) cart.delete(+d.del)
  render()
})
document.getElementById('aplicar').addEventListener('click', () => {
  const ok = document.getElementById('cupon').value.trim().toUpperCase() === 'DEMO10'
  desc = ok ? 0.1 : 0
  document.getElementById('cupon-msg').textContent = ok ? 'Cupón aplicado: 10% de descuento' : 'Cupón inválido (probá DEMO10)'
  render()
})
document.getElementById('vaciar').addEventListener('click', () => { if (confirm('¿Vaciar el carrito?')) { cart.clear(); render(); toast('Carrito vacío') } })
document.getElementById('pagar').addEventListener('click', () => { document.getElementById('checkout').hidden = false; document.getElementById('dir').focus() })
document.getElementById('checkout').addEventListener('submit', (e) => {
  e.preventDefault()
  const t = document.getElementById('tarjeta').value.replace(/\s/g, ''), v = document.getElementById('venc').value, c = document.getElementById('cvc').value
  const [mm, aa] = v.split('/').map(Number)
  const err = !document.getElementById('dir').value.trim() ? 'Falta la dirección' : t !== '4242424242424242' ? 'Tarjeta rechazada'
    : !(mm >= 1 && mm <= 12 && aa >= 26) ? 'Vencimiento inválido' : !/^\d{3}$/.test(c) ? 'CVC inválido' : ''
  document.getElementById('pago-error').textContent = err
  if (err) return
  e.target.hidden = true; document.getElementById('carrito-card').hidden = true
  const g = document.getElementById('gracias'); g.hidden = false; g.textContent = `¡Pago aprobado! Pedido T-${Math.floor(1000 + Math.random() * 9000)} por ${document.getElementById('total').textContent}.`
})
render()
</script>
</body></html>
