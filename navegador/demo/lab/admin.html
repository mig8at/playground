<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab · Admin</title><link rel="stylesheet" href="/demo.css"></head><body>
<main>
  <h1>Usuarios</h1>
  <div class="row card"><input type="search" id="buscar" placeholder="Buscar por nombre o correo" aria-label="Buscar usuario" style="flex:1">
    <select id="rol" aria-label="Filtrar por rol"><option value="">Todos los roles</option><option>admin</option><option>asesor</option><option>cliente</option></select></div>
  <div class="card"><table class="data" aria-label="Usuarios"><thead><tr>
    <th><button data-sort="nombre">Nombre</button></th><th><button data-sort="email">Correo</button></th><th><button data-sort="rol">Rol</button></th><th>Acciones</th>
  </tr></thead><tbody id="filas"></tbody></table>
  <div class="row" style="margin-top:12px"><button class="secondary" id="prev">Anterior</button><span id="pag" class="muted"></span><button class="secondary" id="next">Siguiente</button></div></div>
</main>
<aside class="drawer" id="drawer" hidden aria-label="Editar usuario">
  <h2>Editar usuario</h2>
  <div class="field"><label for="e-nombre">Nombre</label><input id="e-nombre"></div>
  <div class="field"><label for="e-rol">Rol</label><select id="e-rol"><option>admin</option><option>asesor</option><option>cliente</option></select></div>
  <label class="row"><input type="checkbox" id="e-activo"> Activo</label>
  <div class="row" style="margin-top:16px"><button class="secondary" id="cancelar">Cancelar</button><button id="guardar">Guardar cambios</button></div>
</aside>
<script type="module">
import { header, toast } from '/demo.js'; header()
const NOMBRES = ['Ana Ruiz', 'Bruno Díaz', 'Carla Gómez', 'Diego Paz', 'Elena Mora', 'Fabio Sol', 'Gina Vela', 'Hugo León', 'Inés Lara', 'Jorge Cano', 'Karla Ríos', 'Luis Mena', 'Marta Gil', 'Nico Vaca']
let users = NOMBRES.map((n, i) => ({ id: i + 1, nombre: n, email: n.toLowerCase().replace(/[^a-z]+/g, '.') + '@demo.test', rol: ['admin', 'asesor', 'cliente'][i % 3], activo: i % 4 !== 0 }))
let sort = 'nombre', asc = true, page = 0, editId = 0
const PER = 5
function render() {
  const q = document.getElementById('buscar').value.toLowerCase(), r = document.getElementById('rol').value
  const list = users.filter((u) => (!r || u.rol === r) && (u.nombre + u.email).toLowerCase().includes(q))
    .sort((a, b) => (asc ? 1 : -1) * a[sort].localeCompare(b[sort]))
  const pages = Math.max(1, Math.ceil(list.length / PER)); page = Math.min(page, pages - 1)
  document.getElementById('filas').innerHTML = list.slice(page * PER, page * PER + PER).map((u) => `<tr><td>${u.nombre}${u.activo ? '' : ' <small class="muted">(inactivo)</small>'}</td><td>${u.email}</td><td>${u.rol}</td>
    <td><button class="secondary" data-edit="${u.id}" aria-label="Editar ${u.nombre}">Editar</button> <button class="secondary" data-del="${u.id}" aria-label="Eliminar ${u.nombre}">Eliminar</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">Sin resultados</td></tr>'
  document.getElementById('pag').textContent = `Página ${page + 1} de ${pages} · ${list.length} usuarios`
  document.getElementById('prev').disabled = page === 0
  document.getElementById('next').disabled = page >= pages - 1
}
document.getElementById('buscar').addEventListener('input', () => { page = 0; render() })
document.getElementById('rol').addEventListener('change', () => { page = 0; render() })
document.querySelectorAll('[data-sort]').forEach((b) => b.addEventListener('click', () => { asc = sort === b.dataset.sort ? !asc : true; sort = b.dataset.sort; render() }))
document.getElementById('prev').addEventListener('click', () => { page--; render() })
document.getElementById('next').addEventListener('click', () => { page++; render() })
document.getElementById('filas').addEventListener('click', (e) => {
  const d = e.target.dataset
  if (d.del) { const u = users.find((x) => x.id == d.del); if (confirm(`¿Eliminar a ${u.nombre}?`)) { users = users.filter((x) => x !== u); toast('Usuario eliminado'); render() } }
  if (d.edit) { const u = users.find((x) => x.id == d.edit); editId = u.id; document.getElementById('e-nombre').value = u.nombre; document.getElementById('e-rol').value = u.rol; document.getElementById('e-activo').checked = u.activo; document.getElementById('drawer').hidden = false }
})
document.getElementById('cancelar').addEventListener('click', () => { document.getElementById('drawer').hidden = true })
document.getElementById('guardar').addEventListener('click', () => {
  const u = users.find((x) => x.id === editId); u.nombre = document.getElementById('e-nombre').value; u.rol = document.getElementById('e-rol').value; u.activo = document.getElementById('e-activo').checked
  document.getElementById('drawer').hidden = true; toast('Cambios guardados'); render()
})
render()
</script>
</body></html>
