<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credidemo · Tus datos</title><link rel="stylesheet" href="/demo.css"></head><body>
<main>
  <div class="steps"><span class="on">1. Datos</span><span>2. Términos</span><span>3. Oferta</span><span>4. Confirmar</span></div>
  <form class="card" id="form" novalidate>
    <h1>Tus datos</h1>
    <p class="muted" id="producto"></p>
    <!-- a propósito, cada campo se nombra distinto: con etiqueta, sólo placeholder, aria-label o data-testid -->
    <div class="field"><label for="nombre">Nombre completo</label><input id="nombre" name="nombre" autocomplete="off"><span class="error" data-for="nombre"></span></div>
    <div class="field"><label for="cedula">Cédula</label><input id="cedula" name="cedula" inputmode="numeric"><span class="error" data-for="cedula"></span></div>
    <div class="field"><input name="email" type="email" placeholder="Correo electrónico"><span class="error" data-for="email"></span></div>
    <div class="field"><input name="celular" type="tel" aria-label="Celular" placeholder="3001234567"><span class="error" data-for="celular"></span></div>
    <div class="field"><label for="nacimiento">Fecha de nacimiento</label><input id="nacimiento" name="nacimiento" type="date"><span class="error" data-for="nacimiento"></span></div>
    <div class="field"><label for="ciudad">Ciudad</label>
      <select id="ciudad" name="ciudad"><option value="">Elegí tu ciudad</option><option value="BOG">Bogotá</option><option value="MED">Medellín</option><option value="CAL">Cali</option><option value="BAQ">Barranquilla</option></select>
      <span class="error" data-for="ciudad"></span></div>
    <button type="submit" id="continuar" data-testid="datos-continuar" disabled>Continuar</button>
  </form>
</main>
<script type="module">
import { header, store } from '/demo.js'; header()
const s = store.get()
if (s.producto) document.getElementById('producto').textContent = `Producto: ${s.producto}`
const form = document.getElementById('form')
const rules = {
  nombre: (v) => v.trim().split(/\s+/).length >= 2 || 'Escribí nombre y apellido',
  cedula: (v) => /^\d{6,10}$/.test(v) || 'La cédula tiene entre 6 y 10 números',
  email: (v) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) || 'Correo inválido',
  celular: (v) => /^3\d{9}$/.test(v) || 'El celular tiene 10 números y empieza en 3',
  nacimiento: (v) => { if (!v) return 'Elegí tu fecha de nacimiento'; const age = (Date.now() - new Date(v)) / 31557600000; return age >= 18 || 'Tenés que ser mayor de edad' },
  ciudad: (v) => !!v || 'Elegí una ciudad',
}
const touched = new Set()
function check() {
  let all = true
  for (const [name, rule] of Object.entries(rules)) {
    const el = form.elements[name], res = rule(el.value), bad = res !== true
    if (bad) all = false
    if (touched.has(name)) { el.classList.toggle('invalid', bad); form.querySelector(`[data-for="${name}"]`).textContent = bad ? res : '' }
  }
  document.getElementById('continuar').disabled = !all
}
for (const name of Object.keys(rules)) {
  const el = form.elements[name]
  if (s[name]) el.value = s[name]
  el.addEventListener('blur', () => { touched.add(name); check() })
  el.addEventListener('input', check)
  el.addEventListener('change', () => { touched.add(name); check() })
}
check()
form.addEventListener('submit', (e) => {
  e.preventDefault()
  store.set({ ...Object.fromEntries(Object.keys(rules).map((n) => [n, form.elements[n].value])), datos: true })
  location.href = '/solicitud/terminos.html'
})
</script>
</body></html>
