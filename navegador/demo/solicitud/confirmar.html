<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credidemo · Confirmar</title><link rel="stylesheet" href="/demo.css"></head><body>
<main>
  <div class="steps"><span>1. Datos</span><span>2. Términos</span><span>3. Oferta</span><span class="on">4. Confirmar</span></div>
  <div class="card">
    <h1>Confirmá con el código</h1>
    <p>Te enviamos un código al celular <strong id="cel"></strong>.</p>
    <p class="notice">Es una demo: el código de prueba es <strong>246810</strong>.</p>
    <div class="field"><label for="otp">Código de verificación</label><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><span class="error" id="otp-error"></span></div>
    <button id="verificar">Verificar</button>
  </div>
</main>
<script type="module">
import { header, store, requireStep } from '/demo.js'; header()
requireStep('oferta', '/solicitud/oferta.html')
document.getElementById('cel').textContent = store.get().celular
let tries = 0
document.getElementById('verificar').addEventListener('click', () => {
  const v = document.getElementById('otp').value
  if (v === '246810') { store.set({ confirmada: true, numero: 'CD-' + Math.floor(100000 + Math.random() * 900000) }); location.href = '/solicitud/listo.html'; return }
  tries++
  document.getElementById('otp-error').textContent = tries >= 3 ? 'Demasiados intentos: volvé a empezar' : 'Código incorrecto'
  if (tries >= 3) document.getElementById('verificar').disabled = true
})
</script>
</body></html>
