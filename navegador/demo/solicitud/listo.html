<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credidemo · Listo</title><link rel="stylesheet" href="/demo.css"></head><body>
<main><div class="card">
  <h1>¡Solicitud enviada!</h1>
  <p class="ok">Tu solicitud <strong id="numero"></strong> quedó registrada.</p>
  <p id="resumen" class="muted"></p>
  <button id="nueva" class="secondary">Empezar otra solicitud</button>
</div></main>
<script type="module">
import { header, store, requireStep } from '/demo.js'; header()
requireStep('confirmada', '/solicitud/confirmar.html')
const s = store.get()
document.getElementById('numero').textContent = s.numero
document.getElementById('resumen').textContent = `${s.nombre} · ${s.ciudad} · $${Number(s.monto).toLocaleString('es-CO')} a ${s.plazo} meses`
document.getElementById('nueva').addEventListener('click', () => { sessionStorage.removeItem('demo.solicitud'); location.href = '/solicitud/datos.html' })
</script>
</body></html>
