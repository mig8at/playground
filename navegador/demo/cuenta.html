<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credidemo · Mi cuenta</title><link rel="stylesheet" href="/demo.css"></head><body>
<script>if (!sessionStorage.getItem('demo.user')) location.replace('/ingresar.html?next=/cuenta.html')</script>
<main>
  <div class="card"><h1>Mi cuenta</h1><p>Hola, <strong id="user"></strong>.</p>
    <h2>Mis solicitudes</h2><p class="muted" id="sol">Sin solicitudes todavía.</p>
    <a href="/cuenta/datos.html">Editar mis datos</a></div>
</main>
<script type="module">
import { header, store } from '/demo.js'; header()
document.getElementById('user').textContent = sessionStorage.getItem('demo.user')
const s = store.get()
if (s.numero) document.getElementById('sol').textContent = `${s.numero} · $${Number(s.monto).toLocaleString('es-CO')} a ${s.plazo} meses`
</script>
</body></html>
