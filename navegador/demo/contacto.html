<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credidemo · Contacto</title><link rel="stylesheet" href="/demo.css"></head><body>
<main>
  <form class="card" id="form" novalidate>
    <h1>Contacto</h1>
    <div class="field"><label for="c-email">Correo</label><input id="c-email" type="email"></div>
    <div class="field"><label for="c-motivo">Motivo</label><select id="c-motivo"><option value="">Elegí un motivo</option><option value="info">Información</option><option value="queja">Queja</option><option value="otro">Otro</option></select></div>
    <div class="field"><label for="c-mensaje">Mensaje (mínimo 20 caracteres)</label><textarea id="c-mensaje" rows="4"></textarea><span class="muted" id="count">0 / 20</span></div>
    <div class="field"><label for="c-suma">¿Cuánto es 3 + 4?</label><input id="c-suma" inputmode="numeric" data-testid="captcha"></div>
    <label class="row"><input type="checkbox" id="c-copia"> Enviarme una copia</label>
    <p class="error" id="error"></p>
    <button type="submit">Enviar mensaje</button>
  </form>
  <p class="ok" id="ok" hidden>¡Mensaje enviado! Te respondemos pronto.</p>
</main>
<script type="module">
import { header } from '/demo.js'; header()
const msg = document.getElementById('c-mensaje')
msg.addEventListener('input', () => { document.getElementById('count').textContent = `${msg.value.length} / 20` })
document.getElementById('form').addEventListener('submit', (e) => {
  e.preventDefault()
  const err = !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(document.getElementById('c-email').value) ? 'Escribí un correo válido'
    : !document.getElementById('c-motivo').value ? 'Elegí un motivo'
    : msg.value.trim().length < 20 ? 'El mensaje es muy corto'
    : document.getElementById('c-suma').value.trim() !== '7' ? 'La suma no es correcta' : ''
  document.getElementById('error').textContent = err
  if (!err) { e.target.hidden = true; document.getElementById('ok').hidden = false }
})
</script>
</body></html>
