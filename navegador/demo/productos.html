<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credidemo · Productos</title><link rel="stylesheet" href="/demo.css"></head><body>
<main>
  <h1>Productos</h1>
  <div class="row card">
    <input id="q" type="search" placeholder="Buscar producto" aria-label="Buscar producto">
    <select id="cat" aria-label="Categoría">
      <option value="">Todas las categorías</option><option value="celulares">Celulares</option>
      <option value="motos">Motos</option><option value="hogar">Hogar</option>
    </select>
  </div>
  <div id="list" class="grid"></div>
  <p><button id="more" class="secondary">Cargar más</button></p>
</main>
<script type="module">
import { header } from '/demo.js'; header()
const ALL = [
  ['celulares', 'Celular Nova 12', 1200000], ['celulares', 'Celular Pixelo 8', 2100000], ['motos', 'Moto Brisa 125', 6500000],
  ['hogar', 'Nevera Polar 300', 1900000], ['motos', 'Moto Ruta 200', 9800000], ['hogar', 'Televisor Vista 55', 2400000],
  ['celulares', 'Celular Lumo Mini', 800000], ['hogar', 'Lavadora Ola 18', 1700000], ['motos', 'Scooter Urbana', 4200000],
]
let shown = 4
const fmt = (n) => '$' + n.toLocaleString('es-CO')
function render() {
  const q = document.getElementById('q').value.toLowerCase(), cat = document.getElementById('cat').value
  const items = ALL.map((p, i) => ({ id: i + 1, cat: p[0], name: p[1], price: p[2] }))
    .filter((p) => (!cat || p.cat === cat) && p.name.toLowerCase().includes(q))
  document.getElementById('list').innerHTML = items.slice(0, shown).map((p) =>
    `<div class="card"><strong>${p.name}</strong><p class="muted">${p.cat} · ${fmt(p.price)}</p><a href="/producto.html?id=${p.id}">Ver detalle</a></div>`).join('')
    || '<p class="muted">Ningún producto coincide.</p>'
  document.getElementById('more').hidden = items.length <= shown
}
document.getElementById('q').addEventListener('input', render)
document.getElementById('cat').addEventListener('change', render)
document.getElementById('more').addEventListener('click', () => { shown += 4; render() })
render()
</script>
</body></html>
