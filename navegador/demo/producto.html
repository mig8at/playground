<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credidemo · Producto</title><link rel="stylesheet" href="/demo.css"></head><body>
<main><div class="card" id="detail"></div><a href="/productos.html">← Volver a productos</a></main>
<script type="module">
import { header, store } from '/demo.js'; header()
const NAMES = ['Celular Nova 12', 'Celular Pixelo 8', 'Moto Brisa 125', 'Nevera Polar 300', 'Moto Ruta 200', 'Televisor Vista 55', 'Celular Lumo Mini', 'Lavadora Ola 18', 'Scooter Urbana']
const id = Number(new URLSearchParams(location.search).get('id'))
const name = NAMES[id - 1]
const d = document.getElementById('detail')
d.innerHTML = name ? `<h1>${name}</h1><p class="muted">Financiá este producto con Credidemo.</p>
  <button id="financiar">Financiar este producto</button>` : '<h1>Producto no encontrado</h1>'
document.getElementById('financiar')?.addEventListener('click', () => { store.set({ producto: name }); location.href = '/solicitud/datos.html' })
</script>
</body></html>
