<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credidemo · Ingresar</title><link rel="stylesheet" href="/demo.css"></head><body>
<main>
  <form class="card" id="form" style="max-width:420px">
    <h1>Ingresar</h1>
    <p class="muted">Usuario de prueba: está en <code>navegador/demo/credenciales.json</code>.</p>
    <div class="field"><label for="u">Correo</label><input id="u" type="email" autocomplete="username"></div>
    <div class="field"><label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password"></div>
    <p class="error" id="error"></p>
    <button type="submit">Ingresar</button>
  </form>
</main>
<script type="module">
import { header } from '/demo.js'; header()
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault()
  const creds = await (await fetch('/credenciales.json')).json()
  if (document.getElementById('u').value === creds.email && document.getElementById('p').value === creds.password) {
    sessionStorage.setItem('demo.user', creds.email)
    location.href = new URLSearchParams(location.search).get('next') || '/cuenta.html'
  } else document.getElementById('error').textContent = 'Correo o contraseña incorrectos'
})
</script>
</body></html>
