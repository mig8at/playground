<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navegador</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <h1>Navegador</h1>
    <span id="conn" class="pill">…</span>
  </header>

  <section>
    <h2>Esta pestaña</h2>
    <p id="tab-url" class="muted"></p>
    <button id="share" type="button">Compartir con el navegador</button>
    <p class="muted small">Sólo las pestañas compartidas, y las que abre el navegador, se pueden manejar desde Claude.</p>
  </section>

  <section>
    <h2>Sesión en vivo</h2>
    <div id="live" class="muted">Sin sesión.</div>
    <ol id="steps"></ol>
  </section>

  <section>
    <div class="row">
      <h2>Flujos</h2>
      <button id="reload" type="button" class="ghost">Actualizar</button>
    </div>
    <p id="flows-note" class="muted small"></p>
    <div id="flows"></div>
  </section>

  <script src="sidepanel.js"></script>
</body>
</html>
