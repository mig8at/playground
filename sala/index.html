<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala · barrido</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* Todo color sale de theme.css (tools/ui): esta página no declara colores propios. */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 13px;
    display: grid; grid-template-columns: 260px 1fr; height: 100vh;
  }
  nav { border-right: 1px solid var(--border); background: var(--sidebar); color: var(--sidebar-foreground); display: grid; grid-template-rows: auto auto 1fr auto 1fr; min-height: 0; }
  h2 { font-size: 12px; font-weight: 600; margin: 0; padding: 10px 12px; min-height: 40px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
  h2 .count { margin-left: auto; font-weight: 400; color: var(--muted-foreground); }
  .topics { overflow-y: auto; padding: 6px; min-height: 0; }
  .topic { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; padding: 6px; border-radius: var(--radius-md); cursor: pointer; }
  .topic:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
  .topic input { grid-row: span 2; margin-top: 2px; }
  .topic .id { font-family: var(--font-mono); font-size: 12px; word-break: break-all; }
  .topic .when { font-size: 11px; color: var(--muted-foreground); }
  .controls { display: grid; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .controls .row { display: flex; gap: 8px; align-items: center; }
  .controls label { color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; }
  .controls input[type=number] { width: 64px; }
  input, button {
    font: inherit; color: var(--foreground); background: var(--background);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 8px;
  }
  button { cursor: pointer; background: var(--secondary); color: var(--secondary-foreground); }
  button.primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); flex: 1; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 11px; color: var(--muted-foreground); }
  .history { overflow-y: auto; padding: 6px; min-height: 0; }
  .past { padding: 6px 8px; border-radius: var(--radius-md); cursor: pointer; }
  .past:hover, .past.active { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
  .past .ts { font-family: var(--font-mono); font-size: 11px; }
  .past .what { font-size: 12px; }
  .past .nums { font-size: 11px; color: var(--muted-foreground); }

  .app { display: grid; grid-template-rows: auto auto 1fr; min-height: 0; min-width: 0; }
  header { display: flex; gap: 14px; align-items: center; padding: 8px 14px; min-height: 40px; border-bottom: 1px solid var(--border); background: var(--card); }
  header .title { font-weight: 600; }
  header .meta { color: var(--muted-foreground); }
  .phases { display: flex; gap: 6px; margin-left: auto; }
  .phase { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted-foreground); font-size: 12px; }
  .phase.now { border-color: var(--ring); color: var(--foreground); box-shadow: 0 0 0 1px var(--ring); }
  .phase.done { background: var(--secondary); color: var(--secondary-foreground); }
  .empty { padding: 40px; color: var(--muted-foreground); line-height: 1.6; max-width: 640px; }
  .empty b { color: var(--foreground); }

  .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); max-height: 55vh; overflow-y: auto; }
  .lane {
    background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius-lg);
    display: grid; grid-template-rows: auto auto auto 1fr; min-height: 0; height: 210px; transition: box-shadow .2s, border-color .2s;
  }
  .lane.trabajando { border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }
  .lane.verifier { border-style: dashed; }
  .lane .head { display: flex; gap: 8px; align-items: center; padding: 8px 10px 4px; }
  .lane .name { font-weight: 600; font-family: var(--font-mono); font-size: 12px; word-break: break-all; }
  .lane .status { margin-left: auto; font-size: 11px; color: var(--muted-foreground); white-space: nowrap; }
  .lane .stats { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 10px 6px; font-size: 11px; color: var(--muted-foreground); border-bottom: 1px solid var(--border); }
  .lane .stats b { color: var(--foreground); font-weight: 600; }
  .lane .log { overflow-y: auto; padding: 6px 10px; min-height: 0; display: flex; flex-direction: column; gap: 3px; }
  .lane .step { font-size: 11px; line-height: 1.4; display: grid; grid-template-columns: 52px 1fr; gap: 6px; }
  .lane .step .at { color: var(--muted-foreground); font-family: var(--font-mono); }
  .lane .step.tool .what { font-family: var(--font-mono); word-break: break-all; }
  .lane .step.text .what { color: var(--muted-foreground); font-style: italic; }
  .lane .step.last .what { color: var(--foreground); }
  .lane .err { color: var(--destructive); font-size: 11px; padding: 4px 10px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .trabajando .dot { background: var(--primary); animation: pulse 1s infinite; }
  .listo .dot { background: var(--chart-2); }
  .error .dot, .cortado .dot { background: var(--destructive); }
  @keyframes pulse { 50% { opacity: .3; } }

  .findings { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .filters { margin-left: 12px; display: flex; gap: 4px; }
  .filters button { padding: 1px 8px; font-size: 11px; background: var(--background); color: var(--muted-foreground); }
  .filters button.on { background: var(--secondary); color: var(--secondary-foreground); }
  .flist { overflow-y: auto; padding: 8px 14px 14px; min-height: 0; }
  .f { display: grid; grid-template-columns: 44px 1fr; gap: 4px 10px; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); margin-bottom: 8px; }
  .f .badge { grid-row: span 3; display: grid; place-items: center; align-self: start; height: 44px; border-radius: var(--radius-md); font-size: 18px; font-weight: 700; background: var(--muted); color: var(--muted-foreground); }
  .f.ok .badge { background: var(--secondary); color: var(--secondary-foreground); box-shadow: inset 0 0 0 2px var(--chart-2); }
  .f.bad .badge { background: var(--destructive); color: var(--primary-foreground); }
  .f .tags { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted-foreground); }
  .f .tags .kind { padding: 0 6px; border-radius: 999px; border: 1px solid var(--border); color: var(--foreground); }
  .f .tags .fid { font-family: var(--font-mono); color: var(--foreground); }
  .f .text { line-height: 1.45; word-break: break-word; }
  .f .check { font-size: 12px; color: var(--muted-foreground); border-left: 2px solid var(--border); padding-left: 8px; word-break: break-word; }
  code { font-family: var(--font-mono); font-size: 12px; }
</style>
</head>
<body>
<nav>
  <div class="row" id="modes" style="padding:8px 12px 0">
    <label><input type="radio" name="mode" value="knowledge" checked> knowledge/</label>
    <label title="Pone al día canon: piezas que se comprueban y se ensayan, sin publicar"><input type="radio" name="mode" value="canon"> canon</label>
  </div>
  <h2><span id="ttitle">Temas de knowledge</span> <span class="count" id="tcount"></span></h2>
  <div class="hint" id="thint" style="padding:6px 12px 0">De la revisión más vieja a la más nueva. Un agente por tema.</div>
  <div class="topics" id="topics"></div>
  <div class="controls">
    <div class="row">
      <label title="Tope de cada agente, en US$ equivalentes">Agente US$ <input type="number" id="budget" value="2.5" min="0.5" max="6" step="0.5"></label>
      <label title="Tope del verificador, en US$ equivalentes">Verif. <input type="number" id="check" value="3" min="0.5" max="8" step="0.5"></label>
    </div>
    <label><input type="checkbox" id="mock" checked> Simulado (no gasta)</label>
    <div class="row">
      <button class="primary" id="start">Lanzar barrido</button>
      <button id="stop" disabled>Cortar</button>
    </div>
    <div class="hint" id="cost"></div>
  </div>
  <div class="history"><h2 style="padding-left:6px">Barridos anteriores</h2><div id="history"></div></div>
</nav>

<div class="app">
  <header>
    <span class="title">Barrido</span>
    <span class="meta" id="meta"></span>
    <div class="phases" id="phases"></div>
  </header>
  <div class="lanes" id="lanes"></div>
  <div class="findings" id="fpanel">
    <h2>Hallazgos <span class="filters" id="filters"></span><span class="count" id="fcount"></span></h2>
    <div class="flist" id="flist"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const code = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
let viewing = null, filter = 'todos', lastState = null;

const mode = () => document.querySelector('#modes input:checked').value;
async function loadTopics() {
  const canon = mode() === 'canon';
  $('ttitle').textContent = canon ? 'Temas de canon con deriva' : 'Temas de knowledge';
  $('thint').textContent = canon
    ? 'Los que la ronda marca con archivos cambiados en main, de más a menos. Cada agente arma piezas; las confirmadas se ensayan en canon sin publicar.'
    : 'De la revisión más vieja a la más nueva. Un agente por tema.';
  $('topics').innerHTML = '<div class="hint" style="padding:8px 12px">Cargando…</div>';
  const r = await fetch('/api/topics' + (canon ? '?mode=canon' : ''));
  if (!r.ok) { $('topics').innerHTML = `<div class="hint" style="padding:8px 12px">${esc(await r.text())}</div>`; $('tcount').textContent = ''; return; }
  const topics = await r.json();
  $('tcount').textContent = topics.length;
  $('topics').innerHTML = topics.map((t, i) => `
    <label class="topic" title="${esc(t.title)}">
      <input type="checkbox" value="${esc(t.id)}" ${i < 3 ? 'checked' : ''}>
      <span class="id">${esc(t.id)}</span>
      <span class="when">${canon ? esc(t.title) : `revisado ${esc((t.reviewed || '—').slice(0, 10))}`}</span>
    </label>`).join('');
  updateCost();
}
const chosen = () => [...document.querySelectorAll('#topics input:checked')].map((i) => i.value);
function updateCost() {
  const n = chosen().length, b = Number($('budget').value), c = Number($('check').value);
  $('cost').textContent = $('mock').checked
    ? `Simulado: ${n} agente(s), sin gasto.`
    : mode() === 'canon'
      ? `Hasta US$${(n * (b + c)).toFixed(2)} eq. (${n} cadenas × (${b} + verificador ${c})), del límite del asiento.`
      : `Hasta US$${(n * b + c).toFixed(2)} eq. (${n} × ${b} + verificador ${c}), del límite del asiento.`;
  $('start').disabled = n === 0 || n > 8 || Boolean(lastState && !lastState.ended);
}
$('topics').addEventListener('change', updateCost);
$('modes').addEventListener('change', loadTopics);
['budget', 'check', 'mock'].forEach((id) => $(id).addEventListener('input', updateCost));

$('start').onclick = async () => {
  const body = { mode: mode(), topics: chosen(), budget: Number($('budget').value), checkBudget: Number($('check').value), mock: $('mock').checked };
  if (!body.mock && !confirm(`Lanzar ${body.topics.length} agente(s) reales: hasta US$${(body.mode === 'canon' ? body.topics.length * (body.budget + body.checkBudget) : body.topics.length * body.budget + body.checkBudget).toFixed(2)} eq. del asiento.`)) return;
  const r = await fetch('/api/start', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { alert(await r.text()); return; }
  viewing = null; filter = 'todos';
  poll();
};
$('stop').onclick = () => fetch('/api/stop', { method: 'POST' });

const phaseName = { notas: 'Notas de archivos compartidos', 'integración': 'Integrador', 'en cadena': 'Cada tema en cadena: agente → verificador → ensayo', agentes: 'Agentes en paralelo', verificador: 'Verificador', ensayo: 'Ensayo en canon', terminado: 'Terminado', cortado: 'Cortado' };

function render(s) {
  if (!s) {
    $('meta').textContent = '';
    $('phases').innerHTML = '';
    $('lanes').innerHTML = `<div class="empty">
      Cada agente toma <b>un tema</b> de knowledge/ y trabaja solo, en paralelo con los otros, con todas las herramientas
      de lectura: el código de main de los dos monolitos, la base y los logs de prod en sólo lectura, el harness.
      No hablan entre ellos ni esperan turno. Cuando terminan todos, un <b>verificador</b> que no escribió nada
      comprueba cada hallazgo.<br><br>Elegí temas a la izquierda y lanzá el barrido. Con «Simulado» se ve el recorrido sin gastar.</div>`;
    $('fpanel').style.display = 'none';
    return;
  }
  $('fpanel').style.display = '';
  const live = !s.ended;
  const secs = Math.max(0, Math.round(((s.ended ? new Date(s.ended) : new Date()) - new Date(s.started)) / 1000));
  const cost = [...(s.agents || []), ...(s.verifiers || []), ...(s.notes || []), ...(s.correctors || []), s.integrator, s.verifier].reduce((a, x) => a + (x?.cost || 0), 0);
  const clock = s.started && s.started !== s.ended ? ` · ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}` : '';
  $('meta').textContent = `${s.id}${s.mock ? ' · simulado' : ''}${clock} · US$${cost.toFixed(2)} eq.`;
  const order = s.verifiers?.length
    ? ['notas', 'en cadena', 'integración', s.phase === 'cortado' ? 'cortado' : 'terminado']
    : ['agentes', 'verificador', ...(s.mode === 'canon' ? ['ensayo'] : []), s.phase === 'cortado' ? 'cortado' : 'terminado'];
  const at = order.indexOf(s.phase);
  $('phases').innerHTML = order.map((p, i) => `<span class="phase ${i < at ? 'done' : i === at ? 'now' : ''}">${i + 1}. ${phaseName[p]}</span>`).join('');

  const lanes = [];
  (s.notes || []).forEach((a) => lanes.push({ ...a, isVerifier: true }));
  (s.agents || []).forEach((a, i) => {
    lanes.push(a);
    if (s.verifiers?.[i]) lanes.push({ ...s.verifiers[i], isVerifier: true });
  });
  if (s.verifier) lanes.push({ ...s.verifier, isVerifier: true });
  (s.correctors || []).forEach((a) => lanes.push({ ...a, isVerifier: true }));
  if (s.integrator) lanes.push({ ...s.integrator, isVerifier: true });
  $('lanes').innerHTML = lanes.map((a) => {
    const steps = a.steps || [];
    const log = steps.length
      ? steps.map((st, i) => `<div class="step ${st.kind} ${i === steps.length - 1 ? 'last' : ''}"><span class="at">${esc(st.at)}</span><span class="what">${esc(st.text)}</span></div>`).join('')
      : `<div class="hint">${a.status === 'esperando' ? (a.isVerifier ? 'Espera a que terminen los agentes.' : 'En cola.') : a.status === 'trabajando' ? 'Arrancando…' : 'Este barrido no guardó los pasos.'}</div>`;
    return `<div class="lane ${esc(a.status)} ${a.isVerifier ? 'verifier' : ''}">
      <div class="head"><span class="dot"></span><span class="name">${a.isVerifier ? esc(a.topic || 'verificador') : esc(a.topic)}</span><span class="status">${esc(a.status)}</span></div>
      <div class="stats">
        <span><b>${a.tools || 0}</b> herramientas</span>
        ${a.isVerifier ? '' : `<span><b>${a.findings || 0}</b> hallazgos</span>`}
        ${a.tokensIn ? `<span>${Math.round(a.tokensIn / 1000)}k entrada</span>` : ''}
        ${a.cost ? `<span>US$${a.cost.toFixed(2)}</span>` : ''}
        ${a.seconds ? `<span>${a.seconds} s</span>` : ''}
      </div>
      <div class="err">${esc(a.err || '')}</div>
      <div class="log">${log}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.lane .log').forEach((el) => { el.scrollTop = el.scrollHeight; });

  const fs = s.findings || [];
  const n = (v) => fs.filter((f) => (f.verdict || '') === v).length;
  const filters = [['todos', `Todos ${fs.length}`], ['✓', `✓ ${n('✓')}`], ['✗', `✗ ${n('✗')}`], ['—', `— ${n('—')}`], ['', `Sin veredicto ${n('')}`]];
  $('filters').innerHTML = filters.map(([v, l]) => `<button data-v="${esc(v)}" class="${filter === v ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('fcount').textContent = live && s.phase === 'agentes' ? 'aparecen cuando terminan los agentes' : '';
  const shown = fs.filter((f) => filter === 'todos' || (f.verdict || '') === filter);
  $('flist').innerHTML = shown.length ? shown.map((f) => {
    const cls = f.verdict === '✓' ? 'ok' : f.verdict === '✗' ? 'bad' : '';
    const text = f.text.replace(/^HALLAZGO:\s*[^|]+\|\s*/, '');
    return `<div class="f ${cls}">
      <div class="badge">${esc(f.verdict || '·')}</div>
      <div class="tags"><span class="fid">${esc(f.id)}</span><span class="kind">${esc(f.kind || (f.text.match(/^HALLAZGO:\s*([^|]+?)\s*\|/) || [])[1] || 'hallazgo')}</span><span>${esc(f.topic)}</span></div>
      <div class="text">${code(text)}</div>
      ${f.check ? `<div class="check">${code(f.check)}</div>` : ''}
      ${f.rehearsal ? `<div class="check">ensayo en canon: ${esc(f.rehearsal)}</div>` : ''}
      ${f.integration ? `<div class="check">integración: ${esc(f.integration)}</div>` : ''}
      ${f.piece ? `<div class="check"><code>${esc(f.piece)}</code></div>` : ''}
    </div>`;
  }).join('') : `<div class="hint" style="padding:8px 0">${fs.length ? 'Nada con ese filtro.' : live ? 'Todavía no hay hallazgos.' : 'Este barrido no dejó hallazgos.'}</div>`;
}
$('filters').addEventListener('click', (e) => {
  const v = e.target?.dataset?.v;
  if (v === undefined) return;
  filter = v;
  render(viewing || lastState);
});

async function loadHistory() {
  const list = await (await fetch('/api/history')).json();
  $('history').innerHTML = list.length ? list.map((p) => `
    <div class="past ${viewing?.id === p.id ? 'active' : ''}" data-id="${esc(p.id)}">
      <div class="ts">${esc(p.id)}${p.mock ? ' · simulado' : ''}</div>
      <div class="what">${esc(p.topics || '—')}</div>
      <div class="nums">${p.findings} hallazgos · ${p.verified} ✓ · US$${(p.cost || 0).toFixed(2)}</div>
    </div>`).join('') : '<div class="hint" style="padding:6px">Todavía no hay.</div>';
}
$('history').addEventListener('click', async (e) => {
  const el = e.target.closest('.past');
  if (!el) return;
  const raw = await (await fetch('/api/history?id=' + encodeURIComponent(el.dataset.id))).json();
  if (!raw.agents?.length && raw.runs) raw.agents = raw.runs.map((r) => ({ ...r, status: 'listo', steps: [] })); // el primer barrido, antes de la página
  if (raw.verifier && !raw.verifier.status) raw.verifier.status = 'listo';
  const now = new Date().toISOString();
  viewing = { findings: [], agents: [], started: raw.started || now, ended: raw.ended || raw.started || now,
    ...raw, id: el.dataset.id, phase: raw.phase || 'terminado' };
  filter = 'todos';
  render(viewing);
  loadHistory();
});

let wasLive = false;
async function poll() {
  try { lastState = await (await fetch('/api/state')).json(); } catch { lastState = null; }
  const live = Boolean(lastState && !lastState.ended);
  $('stop').disabled = !live;
  updateCost();
  if (live) viewing = null;
  if (!viewing) render(lastState);
  if (wasLive && !live) loadHistory();
  wasLive = live;
}
loadTopics();
loadHistory();
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
