<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* Todo color sale de theme.css (tools/ui): esta página no declara colores propios. */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 13px;
    display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh;
  }
  header {
    display: flex; gap: 8px; align-items: center; padding: 8px 12px; min-height: 40px;
    border-bottom: 1px solid var(--border); background: var(--card);
  }
  header .title { font-weight: 600; margin-right: 8px; }
  header input { width: 140px; }
  select { font: inherit; color: var(--foreground); background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 6px; }
  .roles { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--card); }
  .roles label { font-size: 12px; }
  .roles label span { color: var(--foreground); }
  .roles select.model { font-size: 11px; padding: 1px 4px; }
  input, button {
    font: inherit; color: var(--foreground); background: var(--background);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 8px;
  }
  button { cursor: pointer; background: var(--secondary); color: var(--secondary-foreground); }
  button.primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  button:disabled { opacity: .5; cursor: default; }
  label { display: flex; gap: 4px; align-items: center; color: var(--muted-foreground); }
  .meta { margin-left: auto; color: var(--muted-foreground); }
  main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  .stage { display: grid; grid-template-rows: auto 1fr; min-height: 0; border-right: 1px solid var(--border); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; padding: 8px 12px; max-height: 45vh; overflow-y: auto; }
  .tile {
    background: var(--card); color: var(--card-foreground); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 8px 10px; min-height: 84px; display: flex; flex-direction: column; gap: 4px;
    transition: box-shadow .2s, border-color .2s;
  }
  .tile.speaking { border-color: var(--ring); box-shadow: 0 0 0 2px var(--ring); }
  .avatar {
    width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px;
    background: var(--accent); color: var(--accent-foreground);
  }
  .tile .who { display: flex; gap: 10px; align-items: center; }
  .tile .name { font-weight: 600; }
  .tile .role, .tile .stat { color: var(--muted-foreground); font-size: 12px; }
  .tile .doing { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); word-break: break-all; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 4px; }
  .speaking .dot { background: var(--primary); animation: pulse 1s infinite; }
  .error .dot { background: var(--destructive); }
  @keyframes pulse { 50% { opacity: .3; } }
  .transcript { overflow-y: auto; padding: 0 12px 12px; min-height: 0; }
  .msg { padding: 8px 0; border-top: 1px solid var(--border); white-space: pre-wrap; line-height: 1.45; }
  .msg .from { font-weight: 600; margin-right: 6px; }
  .msg .at { color: var(--muted-foreground); font-size: 11px; }
  .msg.moderador { color: var(--muted-foreground); }
  .msg.aviso { color: var(--muted-foreground); font-style: italic; }
  .msg.portero { color: var(--muted-foreground); font-size: 11px; padding: 2px 0; border-top: none; }
  .tile .work { font-size: 12px; color: var(--foreground); }
  aside { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  aside h2 { font-size: 12px; font-weight: 600; margin: 0; padding: 10px 12px; min-height: 40px; border-bottom: 1px solid var(--border); }
  .claims { overflow-y: auto; padding: 8px 12px; min-height: 0; }
  .claim { padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 8px; background: var(--card); }
  .claim .cmd { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); margin-top: 4px; word-break: break-all; }
  .claim.nocmd { border-style: dashed; }
  .claim .tag { font-size: 11px; color: var(--muted-foreground); }
  .claim .head { display: flex; gap: 6px; align-items: baseline; }
  .claim .id { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); }
  .badge { font-size: 11px; padding: 0 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); color: var(--muted-foreground); white-space: nowrap; }
  .badge.comprobada { border-color: var(--primary); color: var(--foreground); }
  .badge.refutada { border-color: var(--destructive); color: var(--foreground); }
  .badge.sin.comando { border-style: dashed; }
  .claim.refutada > div:not(.cmd):not(.tag):not(.head) { text-decoration: line-through; }
  footer { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); background: var(--card); min-height: 30px; }
  footer input { flex: 1; }
  .empty { color: var(--muted-foreground); padding: 12px 0; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { border-top: 1px solid var(--border); } }
</style>
</head>
<body>
<header>
  <span class="title">Sala</span>
  <label>Tarea <input id="task" placeholder="id o slug" value="86"></label>
  <label>Rondas <input id="rounds" type="number" min="1" max="6" value="3" style="width:56px"></label>
  <label title="Equivalente a precio de API: la sala corre con la suscripción, no se cobra por token; gasta el límite de uso del asiento">Tope US$ eq. <input id="budget" type="number" min="0.5" max="10" step="0.5" value="3" style="width:64px"></label>
  <label>Modo <select id="mode"><option value="canal">canal</option><option value="rondas">rondas</option></select></label>
  <label>Elenco <select id="preset"></select></label>
  <label><input id="mock" type="checkbox"> Simulada</label>
  <button class="primary" id="start">Empezar llamada</button>
  <button id="stop" disabled>Cortar</button>
  <span class="meta" id="meta">sin llamada</span>
</header>
<div class="roles" id="roles"></div>
<main>
  <section class="stage">
    <div class="grid" id="grid"></div>
    <div class="transcript" id="transcript"><div class="empty">La transcripción aparece acá.</div></div>
  </section>
  <aside>
    <h2>Pizarra · afirmaciones</h2>
    <div class="claims" id="claims"><div class="empty">Cada afirmación entra con el comando que la sostiene; la que no lo trae queda punteada.</div></div>
  </aside>
</main>
<footer>
  <input id="say" placeholder="Hablá en la llamada (llega a cada agente en su próximo turno)">
  <button id="send">Enviar</button>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const tk = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n || 0));
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let last = null;

function render(st) {
  st.messages = st.messages || [];
  st.claims = st.claims || [];
  last = st;
  $('start').disabled = st.running;
  $('stop').disabled = !st.running;
  $('meta').textContent = st.task
    ? `#${st.task} · ${st.mode === 'canal' ? 'canal' : `ronda ${Math.min(st.round, st.rounds)}/${st.rounds}`} · US$${st.spent.toFixed(2)} eq. API de ${st.budget.toFixed(2)}${st.mock ? ' · simulada' : ''}${st.ended ? ' · ' + st.ended : ''}`
    : 'sin llamada';
  if (st.objecting) $('meta').textContent += ' · ronda de objeciones';

  const people = [...st.participants, { id: 'miguel', name: 'Miguel', role: 'tú', status: 'esperando', doing: '', cost: 0, turns: 0 }];
  $('grid').innerHTML = people.map((p) => {
    const speaking = p.status === 'pensando';
    const initials = p.name.split(' ').filter((w) => /^\p{L}/u.test(w) && w.length > 2).map((w) => w[0]).slice(0, 2).join('').toUpperCase() || p.name[0];
    return `<div class="tile ${speaking ? 'speaking' : ''} ${p.status === 'error' ? 'error' : ''}">
      <div class="who"><div class="avatar">${esc(initials)}</div>
        <div><div class="name">${esc(p.name)}</div><div class="role">${esc(p.role)}</div></div></div>
      <div class="stat"><span class="dot"></span>${esc(p.status)}${p.id !== 'miguel' ? ` · ${p.turns} turno(s) · US$${p.cost.toFixed(2)} eq.` : ''}</div>
      ${p.model ? `<div class="stat">${esc(p.model.replace('claude-', ''))} · ${esc(p.effort || '')}${p.use && p.use.calls ? ` · ${tk(p.use.in + p.use.cacheWrite + p.use.cacheRead)} entrada · ${tk(p.use.out)} salida${p.use.passes ? ` · ${p.use.passes} PASO` : ''}` : ''}</div>` : ''}
      ${p.work ? `<div class="work">trabajando en: ${esc(p.work)}</div>` : ''}
      ${p.doing ? `<div class="doing">▸ ${esc(p.doing)}</div>` : ''}
    </div>`;
  }).join('');

  const t = $('transcript');
  const atBottom = t.scrollHeight - t.scrollTop - t.clientHeight < 40;
  t.innerHTML = st.messages.length
    ? st.messages.map((m) => `<div class="msg ${esc(m.who)} ${esc(m.kind || '')}"><span class="from">${esc(m.name)}</span><span class="at">${esc(m.at)}</span>\n${esc(m.text)}</div>`).join('')
    : '<div class="empty">La transcripción aparece acá.</div>';
  if (atBottom) t.scrollTop = t.scrollHeight;

  $('claims').innerHTML = st.claims.length
    ? st.claims.map((c) => `<div class="claim ${c.command ? '' : 'nocmd'} ${esc(c.status)}">
        <div class="head"><span class="id">${esc(c.id)}</span><span class="badge ${esc(c.status)}">${esc(c.status)}</span></div>
        <div>${esc(c.claim)}</div>
        <div class="tag">${esc(c.who)}${c.prose ? ' · dicho en prosa' : ''}${c.command ? '' : ' · sin comando: vale como opinión'}</div>
        ${c.command ? `<div class="cmd">$ ${esc(c.command)}</div>` : ''}
        ${c.check && c.check !== c.command ? `<div class="cmd">comprobado con: ${esc(c.check)}</div>` : ''}
      </div>`).join('')
    : '<div class="empty">Cada afirmación entra con el comando que la sostiene; la que no lo trae queda punteada.</div>';
}

const post = (url, body) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) })
  .then(async (r) => { if (!r.ok) alert(await r.text()); });

const roles = () => [...document.querySelectorAll('#roles input:checked')].map((i) => i.value);
let presets = {};
fetch('/api/roles').then((r) => r.json()).then((d) => {
  presets = d.presets;
  const models = ['claude-opus-5-5', 'claude-sonnet-5-5', 'claude-haiku-5-5'];
  $('roles').innerHTML = d.roles.map((r) => `<label title="${esc(r.role)} · esfuerzo ${esc(r.effort)}">${r.id === 'coordinador' ? '' : `<input type="checkbox" value="${esc(r.id)}">`} <span>${esc(r.name)}</span>
    <select class="model" data-role="${esc(r.id)}">${models.map((m) => `<option value="${m}" ${m === r.model ? 'selected' : ''}>${m.replace('claude-', '')}</option>`).join('')}</select></label>`).join('');
  $('preset').innerHTML = Object.keys(presets).map((k) => `<option value="${esc(k)}">${esc(k)}</option>`).join('') + '<option value="">a mano</option>';
  $('preset').value = 'defecto';
  const apply = () => { const ids = presets[$('preset').value]; if (!ids) return; document.querySelectorAll('#roles input').forEach((i) => { i.checked = ids.includes(i.value); }); };
  $('preset').onchange = apply;
  $('roles').addEventListener('change', (e) => { if (e.target.tagName === 'INPUT') $('preset').value = ''; });
  apply();
});
$('start').onclick = () => {
  if (!roles().length) { alert('Convocá al menos un rol.'); return; }
  const models = Object.fromEntries([...document.querySelectorAll('#roles select.model')].map((s) => [s.dataset.role, s.value]));
  post('/api/start', { task: $('task').value.trim(), rounds: Number($('rounds').value), budget: Number($('budget').value), mock: $('mock').checked, roles: roles(), mode: $('mode').value, models });
};
$('stop').onclick = () => post('/api/stop');
const send = () => { const v = $('say').value.trim(); if (!v) return; post('/api/say', { text: v }); $('say').value = ''; };
$('send').onclick = send;
$('say').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

const es = new EventSource('/api/events');
es.onmessage = (e) => render(JSON.parse(e.data));
</script>
</body>
</html>
